<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👀みてつくるシート🚗</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 10px;
}

.container {
  max-width: 600px;
  margin: 0 auto;
}

header {
  background: white;
  padding: 15px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 15px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

h1 {
  font-size: 24px;
  color: #333;
}

.nav-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 15px;
}

.nav-btn {
  background: white;
  border: 2px solid #ddd;
  padding: 12px 8px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  transition: all 0.3s;
  color: #555;
}

.nav-btn:hover {
  background: #f0f0f0;
}

.nav-btn.active {
  background: #667eea;
  color: white;
  border-color: #667eea;
  transform: scale(1.05);
}

.step-card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 8px 16px rgba(0,0,0,0.2);
}

.step-title {
  font-size: 20px;
  font-weight: bold;
  color: #333;
  margin-bottom: 15px;
  padding-bottom: 10px;
  border-bottom: 3px solid #667eea;
}

.step-image {
  width: 100%;
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 15px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  transition: transform 0.2s;
}

.step-image:hover {
  transform: scale(1.02);
}

.ok-box {
  background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
  border: 3px solid #4CAF50;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 15px;
}

.ok-label {
  font-weight: bold;
  color: #2E7D32;
  font-size: 16px;
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.ok-label::before {
  content: "✓";
  display: inline-block;
  width: 24px;
  height: 24px;
  background: #4CAF50;
  color: white;
  border-radius: 50%;
  text-align: center;
  line-height: 24px;
  font-size: 18px;
}

.ok-text {
  color: #1B5E20;
  font-size: 16px;
  font-weight: bold;
}

.note-box {
  background: #FFF9C4;
  border: 3px solid #FBC02D;
  border-radius: 10px;
  padding: 15px;
}

.note-box.danger {
  background: #FFEBEE;
  border-color: #F44336;
}

.note-label {
  font-weight: bold;
  color: #F57F17;
  font-size: 16px;
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.note-box.danger .note-label {
  color: #C62828;
}

.note-label::before {
  content: "💡";
  font-size: 20px;
}

.note-box.danger .note-label::before {
  content: "⚠️";
}

.note-text {
  color: #F57F17;
  font-size: 15px;
}

.note-box.danger .note-text {
  color: #C62828;
}

.final-badge {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin-top: 15px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}

.overlay.active {
  display: flex;
}

.overlay-image {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  cursor: pointer;
}

@media (orientation: landscape) {
  .overlay-image {
    width: 100%;
    height: 100vh;
  }
}

@media (max-width: 480px) {
  h1 {
    font-size: 20px;
  }
  
  .nav-btn {
    font-size: 12px;
    padding: 10px 6px;
  }
  
  .step-title {
    font-size: 18px;
  }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>👀みてつくるシート🚗</h1>
  </header>

  <div class="nav-buttons" id="navButtons"></div>
  
  <div class="step-card" id="stepCard"></div>
</div>

<div class="overlay" id="overlay">
  <img class="overlay-image" id="overlayImage" alt="拡大画像">
</div>

<script>
const steps = [
  { 
    nav:"① でんち", 
    title:"① 電池（BOX）", 
    img:"images/battery_box.jpg",
    ok:"電池の向きOK！", 
    note:"＋と－を確認します。" 
  },
  { 
    nav:"② せん", 
    title:"② 電池につける電線", 
    img:"images/wire_magnet.jpg",
    ok:"線がつながった！", 
    note:"磁石がしっかり付いているか確認。外れていないか見ます。" 
  },
  { 
    nav:"③ スイッチ", 
    title:"③ 前後切り替えスイッチ", 
    img:"images/switch_complete.jpg",
    ok:"前後が切り替わる！", 
    note:"左右SWを押して切り替わるか確認。向きを確認します。" 
  },
  { 
    nav:"④ まわる", 
    title:"④ モーターは回る？", 
    img:"images/motor_test.jpg",
    ok:"回れば OK（又は、LEDチェッカーで調べる）", 
    note:"指を近づけないよう注意。回らない（つかない）場合は配線を確認。" 
  },
  { 
    nav:"⑤ みため", 
    title:"⑤ 見た目完成（実験中）", 
    img:"images/car_complete.jpg",
    ok:"つなぎ方をためそう！", 
    note:"前後が逆なら入れ替えてみよう。", 
    danger:true 
  },
  { 
    nav:"⑥ かんせい", 
    title:"⑥ ほんとうの完成！", 
    img:"images/complete.jpg",
    ok:"前後に動いたら大成功！", 
    note:"安全に走らせよう。", 
    final:true 
  }
];

let currentStep = 0;

function initNav() {
  const navButtons = document.getElementById('navButtons');
  navButtons.innerHTML = '';
  
  steps.forEach((step, index) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    if (index === currentStep) btn.classList.add('active');
    btn.textContent = step.nav;
    btn.onclick = () => {
      currentStep = index;
      render();
    };
    navButtons.appendChild(btn);
  });
}

function render() {
  initNav();
  
  const step = steps[currentStep];
  const stepCard = document.getElementById('stepCard');
  
  let html = `
    <div class="step-title">${step.title}</div>
    <img src="${step.img}" alt="${step.title}" class="step-image" id="stepImage">
    
    <div class="ok-box">
      <div class="ok-label">できているポイント</div>
      <div class="ok-text">${step.ok}</div>
    </div>
    
    <div class="note-box${step.danger ? ' danger' : ''}">
      <div class="note-label">${step.danger ? '注意' : 'ヒント'}</div>
      <div class="note-text">${step.note}</div>
    </div>
  `;
  
  if (step.final) {
    html += '<div class="final-badge">🎉 おめでとう！完成です！ 🎉</div>';
  }
  
  stepCard.innerHTML = html;
  
  document.getElementById('stepImage').onclick = showOverlay;
}

function showOverlay() {
  const overlay = document.getElementById('overlay');
  const overlayImage = document.getElementById('overlayImage');
  const step = steps[currentStep];
  
  overlayImage.src = step.img;
  overlay.classList.add('active');
}

function hideOverlay() {
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('active');
}

document.getElementById('overlay').onclick = hideOverlay;

render();
</script>

</body>
</html>
