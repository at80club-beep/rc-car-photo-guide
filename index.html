<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー工作｜写真で工程確認</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#faf7f2;
  --main:#f0b344;
  --border:#e0cfa0;
  --ok:#4caf50;
  --note:#8a6d1d;
  --danger:#e53935;
}

body{
  margin:0;
  font-family:"Hiragino Sans","メイリオ",sans-serif;
  background:var(--bg);
  color:#333;
}

/* ===== ヘッダー ===== */
header{
  position:sticky;
  top:0;
  background:#fff7dd;
  border-bottom:4px solid var(--border);
  padding:10px;
  z-index:100;
}

h1{
  font-size:1.2em;
  margin:0 0 8px;
  font-weight:900;
}

/* ===== ナビ ===== */
nav{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

nav button{
  flex:1 1 auto;
  min-width:110px;
  padding:10px;
  font-size:15px;
  font-weight:800;
  border-radius:12px;
  border:3px solid var(--note);
  background:#fff;
}

nav button.active{
  background:var(--main);
  border-color:#000;
}

/* ===== メイン ===== */
main{
  padding:12px;
}

.section-title{
  font-size:1.4em;
  font-weight:900;
  border-bottom:3px solid var(--main);
  margin-bottom:12px;
}

.photo-box{
  background:#fff;
  border:4px solid var(--border);
  border-radius:14px;
  padding:14px;
}

.photo-box.danger{
  border-color:var(--danger);
  background:#fff0f0;
}

.danger-label{
  display:none;
  text-align:center;
  font-size:1.1em;
  font-weight:900;
  color:var(--danger);
  margin-bottom:6px;
}

.photo-box.danger .danger-label{
  display:block;
}

.photo-img{
  width:100%;
  max-width:640px;
  display:block;
  margin:0 auto 10px;
  border-radius:12px;
  border:4px solid var(--border);
}

.ok-box{
  background:#e8f6e8;
  border:3px solid var(--ok);
  border-radius:10px;
  padding:10px;
  font-size:1.1em;
  font-weight:900;
  text-align:center;
  margin:10px 0;
}

.note{
  background:#f5efe4;
  border-left:4px solid var(--note);
  padding:10px;
  border-radius:8px;
  margin-top:8px;
  font-size:1em;
}

/* 操作ヒント（初回用） */
.hint{
  font-size:0.95em;
  color:#555;
  margin-top:6px;
  text-align:center;
}

/* ⑤用 戻りボタン */
.retry-box{
  display:none;
  margin-top:10px;
}

.retry-box button{
  width:100%;
  padding:14px;
  font-size:16px;
  font-weight:900;
  border-radius:14px;
  border:4px solid var(--danger);
  background:#fff3f3;
  color:var(--danger);
  margin-top:8px;
}

/* 完成マーク */
.complete-mark{
  display:none;
  text-align:center;
  font-size:2em;
  font-weight:900;
  color:#ff9800;
  margin:15px 0;
}

/* ===== 写真拡大 ===== */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:999;
  touch-action:none;
}

.overlay-inner{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.overlay img{
  max-width:95%;
  max-height:95%;
  transform-origin:center center;
}

.close{
  position:absolute;
  top:20px;
  right:20px;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#000;
  color:#fff;
  font-size:32px;
  line-height:48px;
  text-align:center;
  z-index:1000;
}

.overlay-hint{
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;
  color:#fff;
  font-size:0.95em;
  opacity:0.9;
}
</style>
</head>

<body>

<header>
  <h1>リモコンカー作り 写真で確認</h1>
  <nav id="nav"></nav>
</header>

<main>
  <div class="section-title" id="title"></div>

  <div class="photo-box" id="photoBox">
    <div class="danger-label">⚠ ここはためすところ（失敗OK）</div>

    <img id="photo" class="photo-img">

    <div class="ok-box" id="ok"></div>

    <div class="retry-box" id="retryBox">
      <button onclick="showStep(2)">🔁 ③ スイッチに戻る</button>
      <button onclick="showStep(3)">🔁 ④ 回る？をもう一度</button>
    </div>

    <div class="complete-mark" id="completeMark">🌟 ほんとうの完成！ 🌟</div>

    <div class="note" id="note"></div>

    <div class="hint" id="hint">
      👆写真タップで拡大 ／ 🤏2本指で拡大縮小 ／ 🖐動かす
    </div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="close" onclick="closeOverlay()">×</div>
  <div class="overlay-inner">
    <img id="overlayImg">
  </div>
  <div class="overlay-hint">
    🤏 拡大縮小　🖐 移動　👆 タップで戻る　↔ 工程切替
  </div>
</div>

<script>
const steps = [
  { nav:"① 電池", title:"① 電池（BOX）", img:"images/battery_box.jpg",
    ok:"電池の向きOK！", note:"＋と－を確認します。" },

  { nav:"② 電池の線", title:"② 電池につける電線", img:"images/wire_magnet.jpg",
    ok:"線がつながった！", note:"磁石がしっかり付いているか確認。" },

  { nav:"③ スイッチ", title:"③ 前後切り替えスイッチ", img:"images/switch_complete.jpg",
    ok:"前後が切り替わる！", note:"左右SWを押して切り替わるか確認。" },

  { nav:"④ 回る？", title:"④ モーターは回る？", img:"images/motor_test.jpg",
    ok:"回れば OK"（又は、LEDチェッカーで調べる）, note:"指を近づけないよう注意。　回らない（つかない）場合は配線を確認。" },

  { nav:"⑤ 見た目完成", title:"⑤ 見た目完成（実験中）", img:"images/car_complete.jpg",
    ok:"つなぎ方をためそう！", note:"前後が逆なら入れ替えてみよう。", danger:true },

  { nav:"⑥ ほんとうの完成", title:"⑥ ほんとうの完成！", img:"images/car_complete.jpg",
    ok:"前後に動いたら大成功！", note:"安全に走らせよう。", final:true }
];

let current=0;

/* ナビ生成 */
const nav=document.getElementById("nav");
steps.forEach((s,i)=>{
  const b=document.createElement("button");
  b.textContent=s.nav;
  if(i===0) b.classList.add("active");
  b.onclick=()=>showStep(i);
  nav.appendChild(b);
});

function showStep(i){
  current=i;
  document.querySelectorAll("nav button").forEach((b,idx)=>{
    b.classList.toggle("active",idx===i);
  });
  const s=steps[i];
  title.textContent=s.title;
  photo.src=s.img;
  ok.textContent=s.ok;
  note.textContent=s.note;
  photoBox.classList.toggle("danger",!!s.danger);
  retryBox.style.display=s.danger?"block":"none";
  completeMark.style.display=s.final?"block":"none";
}

/* ===== 拡大・ジェスチャー ===== */
let scale=1, startScale=1;
let offsetX=0, offsetY=0, startX=0, startY=0;
let startDist=0;

photo.onclick=()=>{
  overlay.style.display="block";
  overlayImg.src=photo.src;
  resetTransform();
};

overlay.onclick=()=>closeOverlay();

function closeOverlay(){
  overlay.style.display="none";
}

function resetTransform(){
  scale=1;
  offsetX=0;
  offsetY=0;
  applyTransform();
}

function applyTransform(){
  overlayImg.style.transform=
    `translate(${offsetX}px,${offsetY}px) scale(${scale})`;
}

overlay.addEventListener("touchstart",e=>{
  if(e.touches.length===1){
    startX=e.touches[0].clientX-offsetX;
    startY=e.touches[0].clientY-offsetY;
  }
  if(e.touches.length===2){
    startDist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    startScale=scale;
  }
});

overlay.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(e.touches.length===1){
    offsetX=e.touches[0].clientX-startX;
    offsetY=e.touches[0].clientY-startY;
    applyTransform();
  }
  if(e.touches.length===2){
    const dist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    scale=Math.min(5,Math.max(1,startScale*(dist/startDist)));
    applyTransform();
  }
},{passive:false});

/* スワイプで工程切替 */
let swipeStartX=0;
overlay.addEventListener("touchstart",e=>{
  swipeStartX=e.touches[0].clientX;
});

overlay.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-swipeStartX;
  if(Math.abs(dx)>80){
    if(dx<0 && current<steps.length-1) current++;
    if(dx>0 && current>0) current--;
    showStep(current);
    overlayImg.src=steps[current].img;
    resetTransform();
  }
});

showStep(0);
</script>

</body>
</html>
