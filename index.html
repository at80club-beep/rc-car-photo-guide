<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー 写真参照ガイド</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =====================
   基本変数（ズレ防止の要）
===================== */
:root {
  --font-base: 16px;
  --header-height: 120px;
}

/* =====================
   全体
===================== */
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #faf7f2;
  color: #333;
  font-size: var(--font-base);
  line-height: 1.6;
}

/* =====================
   ヘッダー
===================== */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #fff7dd;
  border-bottom: 1px solid #e0d7c2;
  padding: 8px 12px;
}

header h1 {
  margin: 0 0 6px;
  font-size: 1.4em;
}

/* =====================
   ナビ
===================== */
nav {
  display: flex;
  gap: 6px;
  overflow-x: auto;
}

nav a,
nav button {
  font-size: 0.85em;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid #e0cfa0;
  background: #fff;
  color: #554018;
  cursor: pointer;
  white-space: nowrap;
}

/* =====================
   メイン
===================== */
main {
  padding: 12px;
}

/* =====================
   セクション（リンクずれ対策）
===================== */
section {
  background: #fff;
  border: 1px solid #eee0c8;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 24px;

  /* ★ ここが最重要 */
  scroll-margin-top: var(--header-height);
}

h2 {
  margin: 0 0 8px;
  font-size: 1.2em;
  border-left: 4px solid #f0b344;
  padding-left: 8px;
  color: #d89c2c;
}

/* =====================
   指導ポイント
===================== */
.note-box {
  background: #f5efe4;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
  font-size: 0.9em;
}

/* 上級者モード制御 */
#toggle-note {
  display: none;
}

.advanced #toggle-note {
  display: inline-block;
}

.hide-note .note-box {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>リモコンカー 写真参照ガイド</h1>
  <nav>
    <a href="#battery">電池BOX</a>
    <a href="#wire">電線</a>
    <a href="#switch">スイッチ</a>
    <a href="#test">テスト</a>
    <a href="#complete">完成</a>

    <!-- 上級者のみ -->
    <button id="toggle-note">指導ポイント ON / OFF</button>

    <!-- 文字サイズ -->
    <button onclick="setFont(0.9)">小</button>
    <button onclick="setFont(1)">中</button>
    <button onclick="setFont(1.1)">大</button>
  </nav>
</header>

<main>

<section id="battery">
  <h2>📦 電池BOX</h2>
  <p>写真 P25 を参照</p>
  <div class="note-box">
    ・＋－の向きを必ず確認<br>
    ・銅テープは強めに押さえる
  </div>
</section>

<section id="wire">
  <h2>🔌 電線づくり</h2>
  <p>写真 P30 を参照</p>
  <div class="note-box">
    ・磁石の位置を確認<br>
    ・接触不良に注意
  </div>
</section>

<section id="switch">
  <h2>🎮 スイッチ</h2>
  <p>写真 P62 / P72</p>
  <div class="note-box">
    ・左右で電気の向きが変わる
  </div>
</section>

<section id="test">
  <h2>🔬 テスト実験</h2>
  <p>写真 P81</p>
  <div class="note-box">
    ・回転方向を見比べる
  </div>
</section>

<section id="complete">
  <h2>🏆 完成</h2>
  <p>写真 P50</p>
  <div class="note-box">
    ・配線がタイヤに当たらない
  </div>
</section>

</main>

<script>
/* =====================
   初心者 / 上級者 切替
===================== */
const params = new URLSearchParams(location.search);
const isAdvanced = params.get("mode") === "advanced";

if (isAdvanced) {
  document.body.classList.add("advanced");
}

/* =====================
   指導ポイント ON / OFF
===================== */
const toggleBtn = document.getElementById("toggle-note");
let noteVisible = true;

toggleBtn?.addEventListener("click", () => {
  noteVisible = !noteVisible;
  document.body.classList.toggle("hide-note", !noteVisible);
});

/* =====================
   文字サイズ（ズレ完全防止）
===================== */
function setFont(scale) {
  document.documentElement.style.setProperty(
    "--font-base", `${16 * scale}px`
  );
  document.documentElement.style.setProperty(
    "--header-height", `${120 * scale}px`
  );
}
</script>

</body>
</html>
