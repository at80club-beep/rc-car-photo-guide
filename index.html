<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>リモコンカー 写真参照ガイド</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.6;
  background: #faf7f2;
  color: #333;
  font-size: 16px;
}

/* ===== ヘッダー ===== */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff7dd;
  border-bottom: 1px solid #e0d7c2;
  padding: 8px 12px;
}

.header-title h1 {
  margin: 0;
  font-size: 24px;
}
.header-title small {
  font-size: 12px;
}

/* ===== ナビ ===== */
nav {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 0;
}
nav a {
  text-decoration: none;
  font-size: 14px;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1px solid #e0cfa0;
  background: #fffdf4;
  color: #554018;
  white-space: nowrap;
}

/* ===== フォント操作 ===== */
.font-controls-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 8px;
}
.font-btn-nav {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid #e0cfa0;
  background: #fffdf4;
  cursor: pointer;
}
.font-btn-nav.active {
  background: #f0b344;
  color: #fff;
}

/* ===== メイン ===== */
main {
  padding: 12px;
}

section {
  position: relative;
  margin: 24px 0 32px 32px;
  padding: 14px;
  background: #fff;
  border-radius: 10px;
  border: 1px solid #eee0c8;
}

/* ===== 見出し ===== */
h2 {
  margin: 0 0 8px;
  border-left: 4px solid #f0b344;
  padding-left: 8px;
  color: #d89c2c;
}

/* ===== ノート ===== */
.note-box {
  background: #f5efe4;
  padding: 12px;
  border-radius: 8px;
  margin-top: 12px;
}

/* ===== バインダー ===== */
.ring-binder {
  position: absolute;
  left: -26px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.ring {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #d8d8d8;
  border: 2px solid #999;
}

/* ===== モバイル ===== */
@media (max-width:600px) {
  section { margin-left: 28px; }
}
</style>
</head>

<body>

<header>
  <div class="header-title">
    <h1>リモコンカー 写真参照ガイド <small>（指導員用）</small></h1>
  </div>

  <nav>
    <a href="#battery-box">電池BOX</a>
    <a href="#wire">電線</a>
    <a href="#switch">スイッチ</a>
    <a href="#test">テスト</a>
    <a href="#complete">完成</a>

    <div class="font-controls-nav">
      <button class="font-btn-nav" id="font-small">小</button>
      <button class="font-btn-nav active" id="font-medium">中</button>
      <button class="font-btn-nav" id="font-large">大</button>
    </div>
  </nav>
</header>

<main>

<section id="battery-box">
  <div class="ring-binder"><div class="ring"></div><div class="ring"></div></div>
  <h2>📦 電池BOX</h2>
  <div class="note-box">電池の向きを確認させる</div>
</section>

<section id="wire">
  <div class="ring-binder"><div class="ring"></div><div class="ring"></div></div>
  <h2>🔌 電線作り</h2>
  <div class="note-box">磁石と銅線を使う</div>
</section>

<section id="switch">
  <div class="ring-binder"><div class="ring"></div><div class="ring"></div></div>
  <h2>🎮 スイッチ</h2>
  <div class="note-box">左右で向きが変わる</div>
</section>

<section id="test">
  <div class="ring-binder"><div class="ring"></div><div class="ring"></div></div>
  <h2>🔬 テスト</h2>
  <div class="note-box">回転方向を確認</div>
</section>

<section id="complete">
  <div class="ring-binder"><div class="ring"></div><div class="ring"></div></div>
  <h2>🏆 完成</h2>
  <div class="note-box">バランスを確認</div>
</section>

</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const header = document.querySelector('header');
  const sections = document.querySelectorAll('section');
  const buttons = {
    small: document.getElementById('font-small'),
    medium: document.getElementById('font-medium'),
    large: document.getElementById('font-large')
  };

  const applySize = size => {
    const scale = size === 'small' ? 0.9 : size === 'large' ? 1.15 : 1;
    document.body.style.fontSize = 16 * scale + 'px';
    localStorage.setItem('fontSize', size);
    Object.keys(buttons).forEach(k =>
      buttons[k].classList.toggle('active', k === size)
    );
    updateAnchor();
  };

  const updateAnchor = () => {
    const h = header.offsetHeight + 8;
    document.documentElement.style.scrollPaddingTop = h + 'px';
    sections.forEach(s => s.style.scrollMarginTop = h + 'px');
  };

  Object.keys(buttons).forEach(k =>
    buttons[k].onclick = () => applySize(k)
  );

  applySize(localStorage.getItem('fontSize') || 'medium');
  window.addEventListener('resize', updateAnchor);
});
</script>

</body>
</html>
