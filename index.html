<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>👀みてつくるシート🚗</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-main: #f5f7fb;
      --bg-card: #ffffff;
      --color-primary: #2b7bff;
      --color-primary-soft: #e3efff;
      --color-ok: #1b9b5f;
      --color-ok-soft: #e3f6ec;
      --color-note: #555555;
      --color-danger: #d84343;
      --color-danger-soft: #ffe6e6;
      --color-final: #f5a623;
      --border-soft: #dde3f0;
      --text-main: #222222;
      --text-muted: #666666;
      --shadow-soft: 0 4px 10px rgba(0, 0, 0, 0.06);
      --radius-card: 14px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 640px;
      padding: 12px 12px 24px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .title-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #c3d9ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: var(--shadow-soft);
    }

    .header-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title-main {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .title-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Nav buttons */
    .nav-wrapper {
      margin: 10px 0 12px;
      background: transparent;
    }

    .nav {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 4px 2px 4px 0;
      -webkit-overflow-scrolling: touch;
    }

    .nav::-webkit-scrollbar {
      height: 4px;
    }

    .nav::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.15);
      border-radius: 999px;
    }

    .nav-button {
      flex: 0 0 auto;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-soft);
      background: #ffffff;
      color: var(--text-main);
      font-size: 12px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.1s ease;
    }

    .nav-button span.step-num {
      font-weight: 700;
      margin-right: 4px;
      color: var(--color-primary);
    }

    .nav-button.active {
      background: var(--color-primary);
      color: #ffffff;
      border-color: var(--color-primary);
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(43, 123, 255, 0.35);
    }

    .nav-button.active span.step-num {
      color: #ffffff;
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-soft);
      padding: 10px 10px 14px;
      border: 1px solid var(--border-soft);
    }

    .step-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .step-label-main {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--color-primary-soft);
      color: var(--color-primary);
      font-size: 12px;
      font-weight: 600;
    }

    .step-label-main .step-number {
      font-weight: 700;
    }

    .step-label-tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-soft);
      color: var(--text-muted);
    }

    .step-title {
      font-size: 16px;
      font-weight: 700;
      margin: 4px 2px 8px;
      line-height: 1.4;
    }

    /* Image area */
    .image-wrapper {
      margin: 0 0 10px;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #e4e8f2;
      cursor: pointer;
    }

    .image-wrapper::after {
      content: "タップで写真をひろげる";
      position: absolute;
      bottom: 6px;
      right: 8px;
      padding: 3px 8px;
      font-size: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      border-radius: 999px;
    }

    .step-image {
      width: 100%;
      display: block;
      object-fit: contain;
      background: #d9dfec;
    }

    /* Info sections */
    .info-block {
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .info-block .icon {
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .info-label {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 2px;
      opacity: 0.85;
    }

    .info-text {
      font-size: 13px;
    }

    .info-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-ok {
      background: var(--color-ok-soft);
      color: var(--color-ok);
    }

    .info-note {
      background: #f0f3fb;
      color: var(--color-note);
    }

    .info-note-danger {
      background: var(--color-danger-soft);
      color: var(--color-danger);
    }

    .info-note-final {
      background: #fff7e6;
      color: var(--color-final);
    }

    /* Footer hint */
    .footer-hint {
      margin-top: 6px;
      font-size: 10px;
      color: var(--text-muted);
      text-align: right;
    }

    /* Overlay for enlarged image */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
    }

    .overlay.active {
      display: flex;
    }

    .overlay img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      transition: transform 0.2s ease;
    }

    .overlay-hint {
      position: fixed;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: #f0f0f0;
      opacity: 0.85;
      pointer-events: none;
    }

    .overlay-close {
      position: fixed;
      top: 10px;
      right: 14px;
      font-size: 13px;
      color: #f5f5f5;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      pointer-events: none;
    }

    /* ポートレート時は、拡大画像を横向きに見せる */
    @media (orientation: portrait) {
      .overlay img {
        transform: rotate(90deg);
        max-width: 100vh;
        max-height: 100vw;
      }
    }

    /* Responsive tweaks */
    @media (min-width: 640px) {
      .app {
        padding-top: 20px;
      }

      .title-main {
        font-size: 22px;
      }

      .step-title {
        font-size: 17px;
      }

      .info-text {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="title-icon" aria-hidden="true">
        👀
      </div>
      <div class="header-text">
        <div class="title-main">👀みてつくるシート🚗</div>
        <div class="title-sub">リモコンカー作り：写真で工程をいっしょに確認しよう</div>
      </div>
    </header>

    <section class="nav-wrapper" aria-label="工程ナビゲーション">
      <div class="nav" id="nav"></div>
    </section>

    <main class="card" aria-live="polite">
      <div class="step-label-row">
        <div class="step-label-main">
          <span class="step-number" id="step-badge-number"></span>
          <span id="step-badge-label">こうてい</span>
        </div>
        <div class="step-label-tag" id="step-tag">リモコンカーのつくり方</div>
      </div>

      <h1 class="step-title" id="step-title"></h1>

      <div class="image-wrapper" id="image-wrapper">
        <img id="step-image" class="step-image" src="" alt="工程の写真">
      </div>

      <section class="info-block info-ok" id="info-ok">
        <div class="icon">✅</div>
        <div class="info-body">
          <div class="info-label">できているポイント</div>
          <div class="info-text" id="ok-text"></div>
        </div>
      </section>

      <section class="info-block info-note" id="info-note">
        <div class="icon" id="note-icon">💡</div>
        <div class="info-body">
          <div class="info-label" id="note-label">ちゅうい・ヒント</div>
          <div class="info-text" id="note-text"></div>
        </div>
      </section>

      <div class="footer-hint">
        写真をタップすると、横向きで大きく見られます。
      </div>
    </main>
  </div>

  <!-- Enlarged image overlay -->
  <div class="overlay" id="overlay">
    <img id="overlay-image" src="" alt="拡大した工程の写真">
    <div class="overlay-close">タップでもどる</div>
    <div class="overlay-hint">画面の向きを変えても、横長で見やすく表示されます。</div>
  </div>

  <script>
    const steps = [
      {
        nav: "① でんち",
        title: "① でんち（BOX）",
        img: "images/battery_box.jpg",
        ok: "電池の向きOK！",
        note: "＋と－を確認します。"
      },
      {
        nav: "② せん",
        title: "② 電池につける電線",
        img: "images/wire_magnet.jpg",
        ok: "線がつながった！",
        note: "磁石がしっかり付いているか確認。外れていないか見ます。"
      },
      {
        nav: "③ スイッチ",
        title: "③ 前後切り替えスイッチ",
        img: "images/switch_complete.jpg",
        ok: "前後が切り替わる！",
        note: "左右SWを押して切り替わるか確認。向きを確認します。"
      },
      {
        nav: "④ まわる",
        title: "④ モーターは回る？",
        img: "images/motor_test.jpg",
        ok: "回れば OK（又は、LEDチェッカーで調べる）",
        note: "指を近づけないよう注意。回らない（つかない）場合は配線を確認。"
      },
      {
        nav: "⑤ みため",
        title: "⑤ 見た目完成（実験中）",
        img: "images/car_complete.jpg",
        ok: "つなぎ方をためそう！",
        note: "前後が逆なら入れ替えてみよう。",
        danger: true
      },
      {
        nav: "⑥ かんせい",
        title: "⑥ ほんとうの完成！",
        img: "images/complete.jpg",
        ok: "前後に動いたら大成功！",
        note: "安全に走らせよう。",
        final: true
      }
    ];

    const navContainer = document.getElementById('nav');
    const stepBadgeNumber = document.getElementById('step-badge-number');
    const stepTag = document.getElementById('step-tag');
    const stepTitle = document.getElementById('step-title');
    const stepImage = document.getElementById('step-image');
    const okText = document.getElementById('ok-text');
    const infoOk = document.getElementById('info-ok');
    const infoNote = document.getElementById('info-note');
    const noteText = document.getElementById('note-text');
    const noteIcon = document.getElementById('note-icon');
    const noteLabel = document.getElementById('note-label');
    const imageWrapper = document.getElementById('image-wrapper');

    const overlay = document.getElementById('overlay');
    const overlayImage = document.getElementById('overlay-image');

    let currentStepIndex = 0;

    function createNav() {
      steps.forEach((step, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'nav-button';
        btn.setAttribute('data-index', index.toString());

        const parts = step.nav.split(' ');
        const num = parts[0] || '';
        const label = parts.slice(1).join(' ') || '';

        const spanNum = document.createElement('span');
        spanNum.className = 'step-num';
        spanNum.textContent = num;

        const spanLabel = document.createElement('span');
        spanLabel.textContent = label;

        btn.appendChild(spanNum);
        if (label) btn.appendChild(spanLabel);

        btn.addEventListener('click', () => {
          setStep(index);
        });

        navContainer.appendChild(btn);
      });
    }

    function setStep(index) {
      currentStepIndex = index;

      const step = steps[index];

      // Nav active state
      const buttons = navContainer.querySelectorAll('.nav-button');
      buttons.forEach(btn => btn.classList.remove('active'));
      const activeBtn = navContainer.querySelector(`.nav-button[data-index="${index}"]`);
      if (activeBtn) activeBtn.classList.add('active');

      // Badge number
      const parts = step.nav.split(' ');
      stepBadgeNumber.textContent = parts[0] || '';

      // Tag
      if (step.final) {
        stepTag.textContent = "さいごのチェック";
      } else if (step.danger) {
        stepTag.textContent = "ためし方にちゅうい";
      } else {
        stepTag.textContent = "リモコンカーのつくり方";
      }

      // Title
      stepTitle.textContent = step.title;

      // Image
      stepImage.src = step.img;
      stepImage.alt = step.title + " の写真";

      // OK
      okText.textContent = step.ok || "";

      // Note
      noteText.textContent = step.note || "";

      // Note styles
      infoNote.classList.remove('info-note-danger', 'info-note-final');
      infoNote.classList.add('info-note');
      noteIcon.textContent = "💡";
      noteLabel.textContent = "ちゅうい・ヒント";

      if (step.danger) {
        infoNote.classList.remove('info-note');
        infoNote.classList.add('info-note-danger');
        noteIcon.textContent = "⚠️";
        noteLabel.textContent = "ちゅうい（安全）";
      }

      if (step.final) {
        infoNote.classList.remove('info-note');
        infoNote.classList.add('info-note-final');
        noteIcon.textContent = "🎉";
        noteLabel.textContent = "ラストメッセージ";
      }

      // スクロール位置を少し上に
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }

    function openOverlay() {
      const step = steps[currentStepIndex];
      overlayImage.src = step.img;
      overlayImage.alt = step.title + " の拡大写真";
      overlay.classList.add('active');
    }

    function closeOverlay() {
      // 拡大情報をリセット
      overlayImage.src = '';
      overlayImage.alt = '';
      overlay.classList.remove('active');
    }

    // 初期化
    createNav();
    setStep(0);

    // 画像タップで拡大
    imageWrapper.addEventListener('click', () => {
      openOverlay();
    });

    // 拡大中はタップで閉じる（スワイプによる写真移動は実装しない）
    overlay.addEventListener('click', () => {
      closeOverlay();
    });

    // エスケープキーでも閉じる（指導員向け）
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('active')) {
        closeOverlay();
      }
    });
  </script>
</body>
</html>
