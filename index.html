<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リモコンカー作り 写真で確認シート</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --bg-main: #f6f7fb;
      --bg-card: #ffffff;
      --accent: #3a7bd5;
      --accent-soft: #e4f0ff;
      --ok-bg: #e6f8ea;
      --ok-border: #30a14e;
      --ok-text: #187338;
      --note-bg: #fff8e6;
      --note-border: #ffb74d;
      --note-text: #8a5b00;
      --danger-bg: #ffe9e9;
      --danger-border: #f44336;
      --danger-text: #b02121;
      --final-bg: #e9f7ff;
      --final-border: #2196f3;
      --final-text: #0b558f;
      --text-main: #222;
      --text-sub: #555;
      --nav-bg: #ffffff;
      --nav-border: #d4d7e0;
      --shadow-soft: 0 2px 6px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 8px 8px 24px;
    }

    header {
      padding: 8px 8px 4px;
    }

    header h1 {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.4;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* ナビ */
    .nav-wrapper {
      position: sticky;
      top: 0;
      z-index: 5;
      background: linear-gradient(to bottom, #f6f7fb 70%, rgba(246,247,251,0));
      padding: 6px 0 6px;
    }

    .nav-scroll {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 4px 2px 8px;
      scrollbar-width: none;
    }

    .nav-scroll::-webkit-scrollbar {
      display: none;
    }

    .nav-button {
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid var(--nav-border);
      background: var(--nav-bg);
      padding: 6px 10px;
      font-size: 0.8rem;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-soft);
      color: var(--text-sub);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
    }

    .nav-button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .nav-button:active {
      transform: scale(0.97);
    }

    /* カード本体 */
    .card {
      margin-top: 4px;
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: var(--shadow-soft);
      padding: 12px 12px 14px;
    }

    .step-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 3px 8px 3px 6px;
      margin-bottom: 6px;
    }

    .step-label-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .step-title {
      margin: 0 0 6px;
      font-size: 1.1rem;
      line-height: 1.35;
    }

    .step-subtitle {
      margin: 0 0 10px;
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .img-wrapper {
      margin: 0 0 10px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #ddd;
      background: #000;
      position: relative;
      cursor: pointer;
    }

    .step-image {
      width: 100%;
      display: block;
      object-fit: cover;
      max-height: 260px;
    }

    .img-hint {
      position: absolute;
      right: 6px;
      bottom: 4px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .img-hint-icon {
      width: 10px;
      height: 10px;
      border: 2px solid #fff;
      border-radius: 2px;
      box-sizing: border-box;
      position: relative;
    }
    .img-hint-icon::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 3px;
      border-top: 2px solid #fff;
      border-right: 2px solid #fff;
      transform: translate(-70%, -10%) rotate(45deg);
    }

    .ok-box,
    .note-box {
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 0.86rem;
      line-height: 1.4;
    }

    .ok-box {
      background: var(--ok-bg);
      border: 1px solid var(--ok-border);
      color: var(--ok-text);
    }

    .note-box {
      background: var(--note-bg);
      border: 1px solid var(--note-border);
      color: var(--note-text);
    }

    .ok-label,
    .note-label {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 999px;
      margin-bottom: 3px;
    }

    .ok-label {
      background: #30a14e;
      color: #fff;
    }

    .note-label {
      background: #ffb74d;
      color: #4a3000;
    }

    .danger-tag {
      display: inline-block;
      margin-top: 3px;
      font-size: 0.7rem;
      background: var(--danger-bg);
      border-radius: 999px;
      padding: 2px 8px;
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      font-weight: 600;
    }

    .final-tag {
      display: inline-block;
      margin-top: 3px;
      font-size: 0.7rem;
      background: var(--final-bg);
      border-radius: 999px;
      padding: 2px 8px;
      border: 1px solid var(--final-border);
      color: var(--final-text);
      font-weight: 600;
    }

    .footer-note {
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--text-sub);
      text-align: right;
    }

    /* 拡大ビュー（横向き表示） */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      touch-action: none;
    }

    .overlay.visible {
      display: flex;
    }

    .overlay-inner {
      position: relative;
      width: 100vh;
      max-width: 100vw;
      height: 100vw;
      max-height: 100vh;
      transform: rotate(90deg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .overlay-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
    }

    .overlay-info {
      position: fixed;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      font-size: 0.8rem;
      pointer-events: none;
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
    }

    .overlay-info span {
      display: inline-block;
      margin: 0 6px;
    }

    /* 矢印（視覚ガイドのみ、タップ範囲は全体） */
    .overlay-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 1.6rem;
      pointer-events: none;
      user-select: none;
    }
    .overlay-arrow.left {
      left: 10px;
    }
    .overlay-arrow.right {
      right: 10px;
    }

    @media (min-width: 600px) {
      header h1 {
        font-size: 1.25rem;
      }
      .step-image {
        max-height: 320px;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>リモコンカー作り<br>写真で確認シート</h1>
    <p>指導員用：子どもと一緒に写真を見て、ゆっくり一工程ずつ確認します。</p>
  </header>

  <div class="nav-wrapper">
    <div class="nav-scroll" id="navScroll">
      <!-- JSでボタンを生成 -->
    </div>
  </div>

  <main>
    <section class="card" id="stepCard">
      <div class="step-label" id="stepLabel">
        <span class="step-label-dot"></span>
        <span id="stepNavText"></span>
      </div>
      <h2 class="step-title" id="stepTitle"></h2>
      <p class="step-subtitle" id="stepSubtitle"></p>

      <div class="img-wrapper" id="imgWrapper">
        <img src="" alt="" class="step-image" id="stepImage">
        <div class="img-hint">
          <span class="img-hint-icon"></span>
          <span>タップで大きく</span>
        </div>
      </div>

      <div class="ok-box">
        <div class="ok-label">できているポイント（OK）</div>
        <div id="okText"></div>
      </div>

      <div class="note-box" id="noteBox">
        <div class="note-label">注意・ヒント</div>
        <div id="noteText"></div>
        <div id="extraTagContainer"></div>
      </div>

      <div class="footer-note">
        写真をタップ → 横向きで拡大、左右スワイプで前後の工程へ
      </div>
    </section>
  </main>
</div>

<!-- 拡大オーバーレイ -->
<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <img src="" alt="" id="overlayImg" class="overlay-img">
  </div>
  <div class="overlay-arrow left">&#9664;</div>
  <div class="overlay-arrow right">&#9654;</div>
  <div class="overlay-info">
    <span id="overlayTitle"></span>
    <span>｜</span>
    <span>タップで戻る／左右スワイプで移動</span>
  </div>
</div>

<script>
  const steps = [
    { nav:"① 電池", title:"① 電池（BOX）", img:"images/battery_box.jpg",
      ok:"電池の向きOK！", note:"＋と－を確認します。" },

    { nav:"② 電池の線", title:"② 電池につける電線", img:"images/wire_magnet.jpg",
      ok:"線がつながった！", note:"磁石がしっかり付いているか確認。外れていないか見ます。" },

    { nav:"③ スイッチ", title:"③ 前後切り替えスイッチ", img:"images/switch_complete.jpg",
      ok:"前後が切り替わる！", note:"左右SWを押して切り替わるか確認。向きを確認します。" },

    { nav:"④ 回る？", title:"④ モーターは回る？", img:"images/motor_test.jpg",
      ok:"回れば OK（又は、LEDチェッカーで調べる）", note:"指を近づけないよう注意。回らない（つかない）場合は配線を確認。" },

    { nav:"⑤ 見た目完成", title:"⑤ 見た目完成（実験中）", img:"images/car_complete.jpg",
      ok:"つなぎ方をためそう！", note:"前後が逆なら入れ替えてみよう。", danger:true },

    { nav:"⑥ ほんとうの完成", title:"⑥ ほんとうの完成！", img:"images/complete.jpg",
      ok:"前後に動いたら大成功！", note:"安全に走らせよう。", final:true }
  ];

  const navScroll = document.getElementById('navScroll');
  const stepCard = document.getElementById('stepCard');
  const stepLabelText = document.getElementById('stepNavText');
  const stepTitle = document.getElementById('stepTitle');
  const stepSubtitle = document.getElementById('stepSubtitle');
  const stepImage = document.getElementById('stepImage');
  const imgWrapper = document.getElementById('imgWrapper');
  const okText = document.getElementById('okText');
  const noteText = document.getElementById('noteText');
  const noteBox = document.getElementById('noteBox');
  const extraTagContainer = document.getElementById('extraTagContainer');

  const overlay = document.getElementById('overlay');
  const overlayImg = document.getElementById('overlayImg');
  const overlayTitle = document.getElementById('overlayTitle');

  let currentIndex = 0;
  let navButtons = [];

  function createNavButtons() {
    steps.forEach((step, index) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'nav-button';
      btn.textContent = step.nav;
      btn.addEventListener('click', () => {
        setStep(index);
      });
      navScroll.appendChild(btn);
      navButtons.push(btn);
    });
  }

  function setStep(index) {
    if (index < 0 || index >= steps.length) return;
    currentIndex = index;
    const step = steps[index];

    stepLabelText.textContent = step.nav;
    stepTitle.textContent = step.title;
    stepSubtitle.textContent = (index === 0)
      ? "まずは電池から。むきが合っているか、いっしょにチェックします。"
      : `工程 ${index + 1} / ${steps.length} を確認中`;

    stepImage.src = step.img;
    stepImage.alt = step.title;
    okText.textContent = step.ok;
    noteText.textContent = step.note;

    extraTagContainer.innerHTML = "";
    noteBox.style.borderColor = "var(--note-border)";
    noteBox.style.backgroundColor = "var(--note-bg)";
    if (step.danger) {
      const tag = document.createElement('div');
      tag.className = 'danger-tag';
      tag.textContent = "※ 実験中：安全に気をつけてためそう";
      extraTagContainer.appendChild(tag);
      noteBox.style.borderColor = "var(--danger-border)";
      noteBox.style.backgroundColor = "var(--danger-bg)";
    }
    if (step.final) {
      const tag = document.createElement('div');
      tag.className = 'final-tag';
      tag.textContent = "ゴール：ここまで来たらリモコンカー完成！";
      extraTagContainer.appendChild(tag);
      noteBox.style.borderColor = "var(--final-border)";
      noteBox.style.backgroundColor = "var(--final-bg)";
    }

    navButtons.forEach((btn, i) => {
      btn.classList.toggle('active', i === index);
    });

    const activeBtn = navButtons[index];
    if (activeBtn && activeBtn.scrollIntoView) {
      activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }

  // 画像タップで拡大
  imgWrapper.addEventListener('click', () => {
    openOverlay(currentIndex);
  });

  function openOverlay(index) {
    const step = steps[index];
    overlayImg.src = step.img;
    overlayImg.alt = step.title;
    overlayTitle.textContent = step.title;
    overlay.classList.add('visible');
  }

  function closeOverlay() {
    overlay.classList.remove('visible');
  }

  function showNext(delta) {
    let nextIndex = currentIndex + delta;
    if (nextIndex < 0) nextIndex = 0;
    if (nextIndex >= steps.length) nextIndex = steps.length - 1;
    if (nextIndex === currentIndex) return;
    currentIndex = nextIndex;
    setStep(currentIndex);
    openOverlay(currentIndex);
  }

  // オーバーレイ操作
  let touchStartX = 0;
  let touchStartY = 0;
  let touchEndX = 0;
  let touchEndY = 0;
  const SWIPE_THRESHOLD = 40;
  const TAP_THRESHOLD = 10;

  overlay.addEventListener('touchstart', (e) => {
    const touch = e.changedTouches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    touchEndX = touch.clientX;
    touchEndY = touch.clientY;
  }, { passive: true });

  overlay.addEventListener('touchmove', (e) => {
    const touch = e.changedTouches[0];
    touchEndX = touch.clientX;
    touchEndY = touch.clientY;
  }, { passive: true });

  overlay.addEventListener('touchend', (e) => {
    const dx = touchEndX - touchStartX;
    const dy = touchEndY - touchStartY;

    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    if (absDx < TAP_THRESHOLD && absDy < TAP_THRESHOLD) {
      // タップ → 閉じる
      closeOverlay();
      return;
    }

    if (absDx > SWIPE_THRESHOLD && absDx > absDy) {
      if (dx < 0) {
        // 左にスワイプ → 次へ
        showNext(1);
      } else {
        // 右にスワイプ → 前へ
        showNext(-1);
      }
    }
  });

  // PC用クリックでも閉じる
  overlay.addEventListener('click', () => {
    closeOverlay();
  });

  // キーボード操作（PCデモ用）
  document.addEventListener('keydown', (e) => {
    if (!overlay.classList.contains('visible')) return;
    if (e.key === 'Escape') {
      closeOverlay();
    } else if (e.key === 'ArrowRight') {
      showNext(1);
    } else if (e.key === 'ArrowLeft') {
      showNext(-1);
    }
  });

  // 初期化
  createNavButtons();
  setStep(0);
</script>
</body>
</html>
