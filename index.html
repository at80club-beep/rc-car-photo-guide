<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>👀みてつくるシート🚗</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
  background:#f4f6f8;
  color:#222;
}
.container{
  max-width:960px;
  margin:0 auto;
  padding:12px 16px 40px;
}
h1{
  text-align:center;
  font-size:1.6rem;
  margin:12px 0 16px;
}
.nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
}
.nav::-webkit-scrollbar{display:none;}
.nav button{
  flex:0 0 auto;
  padding:10px 16px;
  border-radius:999px;
  border:none;
  background:#ddd;
  font-size:1rem;
}
.nav button.active{
  background:#2a7cff;
  color:#fff;
}
.card{
  margin-top:16px;
  padding:16px;
  border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
  background:#fff;
}
.card.ok{background:#e8f6ec;}
.card.note{background:#fffbe8;}
.card.final{background:#e8f0ff;}
.card h2{
  margin:0 0 8px;
  font-size:1.3rem;
}
.photo-wrap{
  text-align:center;
  margin:12px 0;
}
.photo-wrap img{
  max-width:100%;
  border-radius:12px;
  touch-action:manipulation;
}
.photo-hint{
  font-size:.9rem;
  color:#555;
  margin-top:4px;
}
.ok-text{
  font-weight:bold;
  margin:8px 0;
}
.note-text{
  font-size:.95rem;
}
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  touch-action:none;
}
.overlay img{
  max-width:100%;
  max-height:100%;
  touch-action:manipulation;
}
.close-btn{
  position:absolute;
  top:12px;
  right:12px;
  width:44px;
  height:44px;
  border:none;
  border-radius:50%;
  font-size:1.6rem;
}
@media(min-width:768px){
  .nav{overflow-x:visible;}
}
</style>
</head>
<body>
<div class="container">
  <h1>👀みてつくるシート🚗</h1>
  <div class="nav" id="nav"></div>
  <div id="content"></div>
</div>

<script>
const steps = [
  { nav:"① でんち", title:"① でんち（BOX）", img:"images/battery_box.jpg",
    ok:"電池の向きOK！", note:"＋と－を確認します。" },
  { nav:"② せん", title:"② 電池につける電線", img:"images/wire_magnet.jpg",
    ok:"線がつながった！", note:"磁石がしっかり付いているか確認。外れていないか見ます。" },
  { nav:"③ スイッチ", title:"③ 前後切り替えスイッチ", img:"images/switch_complete.jpg",
    ok:"前後が切り替わる！", note:"左右SWを押して切り替わるか確認。向きを確認します。" },
  { nav:"④ まわる", title:"④ モーターは回る？", img:"images/motor_test.jpg",
    ok:"回れば OK（又は、LEDチェッカーで調べる）", note:"指を近づけないよう注意。回らない（つかない）場合は配線を確認。" },
  { nav:"⑤ みため", title:"⑤ 見た目完成（実験中）", img:"images/car_complete.jpg",
    ok:"つなぎ方をためそう！", note:"前後が逆なら入れ替えてみよう。", danger:true },
  { nav:"⑥ かんせい", title:"⑥ ほんとうの完成！", img:"images/complete.jpg",
    ok:"前後に動いたら大成功！", note:"安全に走らせよう。", final:true }
];

const navEl=document.getElementById("nav");
const contentEl=document.getElementById("content");

steps.forEach((s,i)=>{
  const b=document.createElement("button");
  b.textContent=s.nav;
  b.addEventListener("pointerdown",()=>showStep(i));
  navEl.appendChild(b);
});

function showStep(i){
  [...navEl.children].forEach((b,idx)=>b.classList.toggle("active",idx===i));
  const s=steps[i];
  contentEl.innerHTML="";
  const card=document.createElement("div");
  card.className="card"+(s.final?" final":s.danger?" note":" ok");
  const h2=document.createElement("h2");
  h2.textContent=s.title;
  const wrap=document.createElement("div");
  wrap.className="photo-wrap";
  const img=document.createElement("img");
  img.src=s.img;
  img.alt=s.title;
  img.addEventListener("pointerdown",()=>openOverlay(s.img));
  const hint=document.createElement("div");
  hint.className="photo-hint";
  hint.textContent="タップで拡大";
  wrap.append(img,hint);
  const ok=document.createElement("div");
  ok.className="ok-text";
  ok.textContent=s.ok;
  const note=document.createElement("div");
  note.className="note-text";
  note.textContent=s.note;
  card.append(h2,wrap,ok,note);
  contentEl.appendChild(card);
}

function openOverlay(src){
  document.body.style.overflow="hidden";
  const overlay=document.createElement("div");
  overlay.className="overlay";
  const img=document.createElement("img");
  img.src=src;
  if(window.innerWidth<window.innerHeight){
    img.style.transform="rotate(90deg)";
  }
  const closeBtn=document.createElement("button");
  closeBtn.className="close-btn";
  closeBtn.textContent="×";
  closeBtn.addEventListener("pointerdown",closeOverlay);
  overlay.addEventListener("pointerdown",(e)=>{
    if(e.target===overlay){closeOverlay();}
  });
  overlay.append(img,closeBtn);
  document.body.appendChild(overlay);

  function closeOverlay(){
    document.body.style.overflow="";
    window.scrollTo(0,0);
    overlay.remove();
  }
}

showStep(0);
</script>
</body>
</html>
