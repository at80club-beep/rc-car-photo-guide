<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー作り 写真で確認シート</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#faf7f2;
  --main:#f0b344;
  --border:#e0cfa0;
  --ok:#4caf50;
  --note:#a6842c;
  --danger:#e53935;
}

body{
  margin:0;
  font-family:"Hiragino Sans","メイリオ",sans-serif;
  background:var(--bg);
  color:#333;
  line-height:1.7;
}

/* ===== ヘッダー ===== */
header{
  position:sticky;
  top:0;
  background:#fff7dd;
  border-bottom:4px solid var(--border);
  padding:10px;
  z-index:100;
}

.header-top{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
}

h1{
  font-size:1.3em;
  margin:0;
  font-weight:900;
}

/* ===== ナビ ===== */
nav{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

nav button{
  flex:1 1 auto;
  min-width:120px;
  padding:10px;
  font-size:16px;
  font-weight:800;
  border-radius:12px;
  border:3px solid var(--note);
  background:#fff;
  cursor:pointer;
}

nav button.active{
  background:var(--main);
  border-color:#000;
}

/* ===== メイン ===== */
main{
  padding:12px;
}

.section-title{
  font-size:1.4em;
  font-weight:900;
  border-bottom:3px solid var(--main);
  margin-bottom:12px;
}

.photo-box{
  background:#fff;
  border:4px solid var(--border);
  border-radius:14px;
  padding:14px;
}

/* ⚠⑤専用 赤枠 */
.photo-box.danger{
  border-color:var(--danger);
  background:#fff0f0;
}

.danger-label{
  display:none;
  font-size:1.2em;
  font-weight:900;
  color:var(--danger);
  text-align:center;
  margin-bottom:6px;
}

.photo-box.danger .danger-label{
  display:block;
}

.photo-img{
  width:100%;
  max-width:640px;
  margin:0 auto 10px;
  display:block;
  border-radius:12px;
  border:4px solid var(--border);
}

.ok-box{
  background:#e8f6e8;
  border:3px solid var(--ok);
  border-radius:10px;
  padding:10px;
  font-weight:900;
  text-align:center;
  margin:10px 0;
}

/* ===== 戻るボタン（⑤用） ===== */
.retry-box{
  display:none;
  margin-top:10px;
}

.retry-box button{
  width:100%;
  padding:12px;
  font-size:16px;
  font-weight:900;
  border-radius:14px;
  border:4px solid var(--danger);
  background:#fff3f3;
  color:var(--danger);
  cursor:pointer;
  margin-top:8px;
}

/* ===== 完成マーク ===== */
.complete-mark{
  display:none;
  text-align:center;
  font-size:2em;
  font-weight:900;
  color:#ff9800;
  margin:15px 0;
}

.note{
  background:#f5efe4;
  border-left:4px solid var(--note);
  padding:10px;
  border-radius:8px;
  margin-top:8px;
}
</style>
</head>

<body>

<header>
  <h1>リモコンカー作り 写真で確認シート</h1>
  <nav id="nav"></nav>
</header>

<main>
  <div class="section-title" id="title"></div>

  <div class="photo-box" id="photoBox">
    <div class="danger-label">⚠ ここは ためすところ（失敗OK）</div>

    <img id="photo" class="photo-img">
    <div class="ok-box" id="ok"></div>

    <!-- ⑤専用：戻り導線 -->
    <div class="retry-box" id="retryBox">
      <button onclick="show(2)">🔁 ③ 回る？に戻る</button>
      <button onclick="show(3)">🔁 ④ 回る？をもう一度</button>
    </div>

    <div class="complete-mark" id="completeMark">🌟 ほんとうの完成！ 🌟</div>
    <div class="note" id="note"></div>
  </div>
</main>
