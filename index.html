<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー進行ガイド</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --font-base: 18px;
  --header-height: 150px;
  --main-color: #005bbb;
}

/* ===== 共通 ===== */
html {
  scroll-behavior: smooth;
  scroll-padding-top: var(--header-height);
}

body {
  margin: 0;
  font-family: sans-serif;
  font-size: var(--font-base);
  line-height: 1.8;
  background: #f7f7f7;
}

/* ===== ヘッダー ===== */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--header-height);
  background: #ffffff;
  border-bottom: 4px solid var(--main-color);
  z-index: 1000;
  padding: 10px;
}

.header-inner {
  max-width: 1000px;
  margin: auto;
}

/* ===== 文字サイズ ===== */
.font-control {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.font-btn {
  font-size: 16px;
  padding: 10px 18px;
  border: 3px solid #666;
  background: #fff;
  cursor: pointer;
  border-radius: 8px;
}

.font-active {
  background: #555;
  color: #fff;
  border-color: #222;
  font-weight: bold;
}

/* ===== ナビ ===== */
nav {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

nav a {
  padding: 12px 18px;
  border: 4px solid var(--main-color);
  color: var(--main-color);
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
  background: #fff;
}

nav a.active {
  background: var(--main-color);
  color: #fff;
}

/* ===== メイン ===== */
main {
  padding-top: calc(var(--header-height) + 20px);
  max-width: 900px;
  margin: auto;
}

section {
  background: #fff;
  border: 4px solid #ccc;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 40px;
}

h2 {
  margin-top: 0;
}

/* ===== 指導ポイント ===== */
.note-box {
  border: 4px dashed #999;
  padding: 15px;
  margin-top: 15px;
  background: #fafafa;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <!-- 文字サイズ -->
    <div class="font-control">
      <button class="font-btn" data-scale="0.9" onclick="setFont(0.9,this)">小</button>
      <button class="font-btn" data-scale="1" onclick="setFont(1,this)">中</button>
      <button class="font-btn" data-scale="1.1" onclick="setFont(1.1,this)">大</button>
    </div>

    <!-- ナビ -->
    <nav>
      <a href="#battery">① 電池BOX</a>
      <a href="#wire">② 電線</a>
      <a href="#switch">③ スイッチ</a>
      <a href="#test">④ テスト</a>
      <a href="#complete">⑤ 完成</a>
    </nav>

  </div>
</header>

<main>

<section id="battery">
  <h2>① 電池BOX</h2>
  <p>写真P25を見ながら作ります。</p>
  <div class="note-box">
    ・＋と－の向きを確認<br>
    ・銅テープはしっかり押す
  </div>
</section>

<section id="wire">
  <h2>② 電線づくり</h2>
  <p>写真P30を確認。</p>
</section>

<section id="switch">
  <h2>③ スイッチ</h2>
  <p>写真P62 / P72。</p>
</section>

<section id="test">
  <h2>④ テスト</h2>
  <p>写真P81。</p>
</section>

<section id="complete">
  <h2>⑤ 完成</h2>
  <p>写真P50。</p>
</section>

</main>

<script>
const BASE_FONT = 18;
const BASE_HEADER = 150;

/* ===== 文字サイズ ===== */
function setFont(scale, btn) {
  document.documentElement.style.setProperty(
    "--font-base", `${BASE_FONT * scale}px`
  );
  document.documentElement.style.setProperty(
    "--header-height", `${BASE_HEADER * scale}px`
  );

  document.querySelectorAll(".font-btn").forEach(b => {
    b.classList.remove("font-active");
  });
  btn.classList.add("font-active");

  localStorage.setItem("fontScale", scale);
}

function loadFontSetting() {
  const scale = parseFloat(localStorage.getItem("fontScale")) || 1;

  document.documentElement.style.setProperty(
    "--font-base", `${BASE_FONT * scale}px`
  );
  document.documentElement.style.setProperty(
    "--header-height", `${BASE_HEADER * scale}px`
  );

  document.querySelectorAll(".font-btn").forEach(b => {
    if (parseFloat(b.dataset.scale) === scale) {
      b.classList.add("font-active");
    }
  });
}

/* ===== ナビの現在地表示 ===== */
const links = document.querySelectorAll("nav a");
const sections = document.querySelectorAll("section");

function updateNav() {
  let current = "";
  sections.forEach(sec => {
    const rect = sec.getBoundingClientRect();
    if (rect.top <= 200) current = sec.id;
  });

  links.forEach(link => {
    link.classList.toggle(
      "active",
      link.getAttribute("href") === "#" + current
    );
  });
}

window.addEventListener("scroll", updateNav);
window.addEventListener("DOMContentLoaded", () => {
  loadFontSetting();
  updateNav();
});
</script>

</body>
</html>
