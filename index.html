<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー作り 写真で確認シート（指導員用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =====================
   サイズ制御用変数
===================== */
:root{
  --font-base:20px;
  --btn-font:20px;
  --btn-padding:12px 18px;
  --btn-border:5px;
  --title-weight:900;
  --photo-max-width:95vw;
}

/* =====================
   共通
===================== */
body{
  margin:0;
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
  background:#faf7f2;
  color:#333;
  font-size:var(--font-base);
  line-height:1.7;
}

/* =====================
   ヘッダー
===================== */
header{
  position:sticky;
  top:0;
  background:#fff7dd;
  border-bottom:4px solid #e0cfa0;
  padding:8px 10px;
  z-index:100;
}

/* タイトル行 */
.header-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.title{
  font-size:1.3em;
  font-weight:var(--title-weight);
  margin:0;
  white-space:nowrap;
}

.subtitle{
  font-size:0.6em;
  font-weight:500;
  color:#555;
  margin-left:4px;
}

/* =====================
   文字サイズ切替
===================== */
.font-controls{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

.font-controls button{
  min-width:50px;
  padding:8px 12px;
  font-size:16px;
  border:2px solid #999;
  background:#fff;
  border-radius:8px;
  cursor:pointer;
}

.font-controls button.active{
  background:#333;
  color:#fff;
  border-color:#000;
}

/* =====================
   工程ナビ
===================== */
nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:8px 0 6px;
}

nav button{
  flex:1 1 auto;
  min-width:120px;
  min-height:50px;
  font-size:var(--btn-font);
  padding:var(--btn-padding);
  border:var(--btn-border) solid #a6842c;
  background:#fff;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  margin-bottom:5px;
}

nav button.active{
  background:#f0b344;
  color:#000;
  border-color:#000;
}

/* =====================
   メイン
===================== */
main{
  padding:12px;
}

.section-title{
  font-size:1.3em;
  font-weight:800;
  margin-bottom:12px;
  padding-bottom:5px;
  border-bottom:3px solid #f0b344;
}

.photo-box{
  background:#fff;
  border:4px solid #e0cfa0;
  border-radius:14px;
  padding:15px;
  text-align:center;
}

/* 写真コンテナ */
.photo-container{
  position:relative;
  max-width:var(--photo-max-width);
  margin:0 auto 15px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.photo-img{
  width:auto;
  max-width:100%;
  max-height:400px;
  object-fit:contain;
  display:block;
  border-radius:12px;
  border:4px solid #e0cfa0;
  cursor:pointer;
  background:#f9f9f9;
  margin:0 auto;
}

.photo-img:active{
  transform:scale(0.98);
}

/* スマホ向けヒント */
.photo-hint{
  text-align:center;
  color:#666;
  font-size:0.9em;
  margin:5px 0 15px;
  padding:8px;
  background:#f0f0f0;
  border-radius:8px;
  border-left:4px solid #f0b344;
}

/* OKメッセージ */
.ok-box{
  background:#e8f6e8;
  border:3px solid #4caf50;
  border-radius:10px;
  padding:12px;
  margin:15px 0;
  font-size:1.1em;
  font-weight:800;
  text-align:center;
}

/* 補足 */
.note{
  background:#f5efe4;
  padding:12px;
  border-radius:8px;
  font-size:1em;
  border-left:4px solid #a6842c;
}

/* =====================
   写真拡大（スマホ最適化）
===================== */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:999;
  align-items:center;
  justify-content:center;
  touch-action:none;
}

.overlay-content{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.overlay img{
  max-width:100%;
  max-height:100%;
  transition:transform 0.3s ease;
  cursor:zoom-in;
}

.overlay img.zoomed{
  cursor:zoom-out;
  transform:scale(1.5);
}

/* 閉じるボタン */
.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  width:60px;
  height:60px;
  background:rgba(0,0,0,0.7);
  color:white;
  font-size:40px;
  line-height:60px;
  text-align:center;
  border-radius:50%;
  z-index:1000;
  cursor:pointer;
  border:3px solid white;
}

/* 拡大縮小ボタン */
.zoom-controls{
  position:absolute;
  bottom:20px;
  right:20px;
  display:flex;
  gap:10px;
  z-index:1000;
}

.zoom-btn{
  width:50px;
  height:50px;
  background:rgba(0,0,0,0.7);
  color:white;
  font-size:24px;
  line-height:50px;
  text-align:center;
  border-radius:50%;
  cursor:pointer;
  border:2px solid white;
  font-weight:bold;
}

/* スマホ縦向きの場合 */
@media (max-width:768px) and (orientation:portrait){
  .overlay img{
    max-width:90vh;
    max-height:90vw;
    transform:rotate(90deg);
    transform-origin:center;
  }
  
  .overlay img.zoomed{
    transform:rotate(90deg) scale(1.5);
  }
  
  .rotate-hint{
    position:absolute;
    top:30px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.7);
    color:white;
    padding:12px 25px;
    border-radius:25px;
    font-size:18px;
    z-index:1000;
    animation:fadeInOut 4s ease-in-out forwards;
    text-align:center;
    line-height:1.4;
  }
  
  @keyframes fadeInOut{
    0%{ opacity:0; }
    20%{ opacity:1; }
    80%{ opacity:1; }
    100%{ opacity:0; }
  }
}

/* タブレット・PC・スマホ横向き */
@media (min-width:769px), (orientation:landscape){
  .overlay img{
    max-width:95%;
    max-height:95%;
  }
  
  .rotate-hint{
    display:none;
  }
}

/* =====================
   印刷対応
===================== */
@media print{
  header{
    display:none;
  }

  .photo-img, .photo-hint{
    display:none;
  }

  body{
    background:#fff;
    font-size:14pt;
  }

  .photo-box{
    border:none;
    padding:0;
  }
}

/* =====================
   フッター
===================== */
footer{
  text-align:center;
  padding:15px;
  font-size:0.9em;
  color:#666;
  border-top:2px solid #e0cfa0;
  margin-top:20px;
}

/* 画像エラースタイル */
.img-error{
  position:relative;
}

.img-error::after{
  content:"画像が見つかりません";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  color:#ff6b6b;
  font-weight:bold;
  text-align:center;
  padding:10px;
  background:rgba(255,255,255,0.9);
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <h1 class="title">
      リモコンカー作り 写真で確認シート
      <span class="subtitle">（指導員用）</span>
    </h1>

    <div class="font-controls">
      <button data-size="small">小</button>
      <button data-size="medium">中</button>
      <button data-size="large" class="active">大</button>
    </div>
  </div>

  <nav id="nav">
    <button data-target="battery" class="active">電池BOX完成</button>
    <button data-target="wire">電池につける電線</button>
    <button data-target="switch">前後切り替えスイッチ</button>
    <button data-target="test">モーターのテスト</button>
    <button data-target="complete">完成品</button>
  </nav>
</header>

<main>
  <div class="section-title" id="sectionTitle">
    電池BOX完成
  </div>

  <div class="photo-box">
    <div class="photo-container">
      <img id="photo" src="images/battery_box.jpg" alt="電池BOX完成" class="photo-img">
    </div>
    
    <p class="photo-hint">
      📱スマホの場合は写真をタップすると画面いっぱいに拡大表示されます<br>
      ⚡拡大写真をタップでさらに拡大、もう一度タップで元に戻ります
    </p>

    <div class="ok-box" id="okMessage">
      ✅ この写真と同じになっていれば OK です
    </div>

    <div class="note" id="note">
      電池の＋－向きが合っているかを確認します。
    </div>
  </div>
</main>

<footer>
  <p>このシートはリモコンカー作りの指導員用です。写真を見比べて確認しましょう。</p>
</footer>

<!-- 写真拡大 -->
<div id="overlay" class="overlay">
  <div class="overlay-content">
    <div class="close-btn" onclick="closePhoto()">×</div>
    <div class="rotate-hint">画面を横向きにしてご覧ください</div>
    <div class="zoom-controls">
      <div class="zoom-btn" onclick="zoomIn()">＋</div>
      <div class="zoom-btn" onclick="zoomOut()">－</div>
      <div class="zoom-btn" onclick="resetZoom()">↺</div>
    </div>
    <img id="overlayImg" onclick="toggleZoom()">
  </div>
</div>

<script>
/* =====================
   工程データ
===================== */
const sections = {
  battery:{
    title:"電池BOX完成",
    img:"images/battery_box.jpg",
    ok:"この写真と同じになっていれば OK です",
    note:"電池の＋－向きが合っているかを確認します。"
  },
  wire:{
    title:"電池につける電線",
    img:"images/wire_magnet.jpg",
    ok:"この形になっていれば OK です",
    note:"磁石が端子にピタッと付いているか確認します。"
  },
  switch:{
    title:"前後切り替えスイッチ",
    img:"images/switch_complete.jpg",
    ok:"この配置になっていれば OK です",
    note:"左右のボタンで動きが変わることを確認します。"
  },
  test:{
    title:"モーターのテスト",
    img:"images/motor_test.jpg",
    ok:"写真のように回れば OK です",
    note:"回らない場合は接触を確認します。"
  },
  complete:{
    title:"完成品",
    img:"images/car_complete.jpg",
    ok:"この状態なら完成です",
    note:"配線がタイヤに絡んでいないか確認します。"
  }
};

/* =====================
   工程切替
===================== */
const buttons = document.querySelectorAll("nav button");
const photo = document.getElementById("photo");

buttons.forEach(btn => {
  btn.onclick = () => {
    buttons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    const key = btn.dataset.target;
    const section = sections[key];
    
    document.getElementById("sectionTitle").textContent = section.title;
    document.getElementById("okMessage").innerHTML = "✅ " + section.ok;
    document.getElementById("note").innerHTML = section.note;
    
    // 画像の読み込み
    const img = new Image();
    img.onload = function() {
      photo.src = section.img;
      photo.alt = section.title;
      photo.classList.remove("img-error");
      console.log(`✅ 画像を読み込みました: ${section.img}`);
    };
    img.onerror = function() {
      photo.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480"><rect width="640" height="480" fill="%23f5f5f5"/><text x="320" y="220" font-family="Arial" font-size="24" fill="%23666" text-anchor="middle">${section.title}</text><text x="320" y="260" font-family="Arial" font-size="18" fill="%23999" text-anchor="middle">画像準備中</text></svg>`;
      photo.alt = `${section.title}（画像準備中）`;
      photo.classList.add("img-error");
      console.error(`❌ 画像が見つかりません: ${section.img}`);
    };
    img.src = section.img;
    
    // ボタンにフォーカスを当てる
    btn.focus();
  };
});

/* =====================
   写真拡大（スマホ最適化）
===================== */
const overlay = document.getElementById("overlay");
const overlayImg = document.getElementById("overlayImg");
let currentScale = 1;
let isZoomed = false;

// 写真クリックで拡大
photo.onclick = () => {
  overlayImg.src = photo.src;
  overlayImg.classList.remove("zoomed");
  isZoomed = false;
  currentScale = 1;
  overlay.style.display = "flex";
  document.body.style.overflow = "hidden";
};

// 拡大画像を閉じる
function closePhoto() {
  overlay.style.display = "none";
  document.body.style.overflow = "auto";
  overlayImg.classList.remove("zoomed");
  isZoomed = false;
  currentScale = 1;
}

// 拡大画像をタップでズームトグル
function toggleZoom() {
  isZoomed = !isZoomed;
  overlayImg.classList.toggle("zoomed", isZoomed);
  currentScale = isZoomed ? 1.5 : 1;
}

// ズームイン
function zoomIn() {
  currentScale = Math.min(currentScale + 0.5, 3);
  overlayImg.style.transform = `scale(${currentScale})`;
  if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) {
    overlayImg.style.transform = `rotate(90deg) scale(${currentScale})`;
  }
  isZoomed = true;
  overlayImg.classList.add("zoomed");
}

// ズームアウト
function zoomOut() {
  currentScale = Math.max(currentScale - 0.5, 1);
  overlayImg.style.transform = `scale(${currentScale})`;
  if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) {
    overlayImg.style.transform = `rotate(90deg) scale(${currentScale})`;
  }
  if (currentScale <= 1) {
    isZoomed = false;
    overlayImg.classList.remove("zoomed");
  }
}

// ズームリセット
function resetZoom() {
  currentScale = 1;
  overlayImg.style.transform = "";
  if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) {
    overlayImg.style.transform = "rotate(90deg)";
  }
  isZoomed = false;
  overlayImg.classList.remove("zoomed");
}

// オーバーレイクリックで閉じる
overlay.onclick = (e) => {
  if (e.target === overlay || e.target.classList.contains('rotate-hint')) {
    closePhoto();
  }
};

// スマホの回転イベントに対応
window.addEventListener("orientationchange", function() {
  setTimeout(() => {
    if (overlay.style.display === "flex") {
      if (window.innerHeight > window.innerWidth) {
        overlayImg.style.transform = `rotate(90deg) scale(${currentScale})`;
      } else {
        overlayImg.style.transform = `scale(${currentScale})`;
      }
    }
  }, 300);
});

// ESCキーでも閉じられるように
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && overlay.style.display === "flex") {
    closePhoto();
  }
});

/* =====================
   文字サイズ切替（保存） - 画像位置も調整
===================== */
const sizeButtons = document.querySelectorAll(".font-controls button");

function applySize(size) {
  sizeButtons.forEach(b => b.classList.remove("active"));
  
  if (size === "small") {
    document.documentElement.style.setProperty("--font-base", "16px");
    document.documentElement.style.setProperty("--btn-font", "16px");
    document.documentElement.style.setProperty("--btn-padding", "8px 14px");
    document.documentElement.style.setProperty("--btn-border", "3px");
    document.documentElement.style.setProperty("--title-weight", "700");
    document.documentElement.style.setProperty("--photo-max-width", "95vw");
  } else if (size === "medium") {
    document.documentElement.style.setProperty("--font-base", "18px");
    document.documentElement.style.setProperty("--btn-font", "18px");
    document.documentElement.style.setProperty("--btn-padding", "10px 16px");
    document.documentElement.style.setProperty("--btn-border", "4px");
    document.documentElement.style.setProperty("--title-weight", "800");
    document.documentElement.style.setProperty("--photo-max-width", "90vw");
  } else if (size === "large") {
    document.documentElement.style.setProperty("--font-base", "20px");
    document.documentElement.style.setProperty("--btn-font", "20px");
    document.documentElement.style.setProperty("--btn-padding", "12px 18px");
    document.documentElement.style.setProperty("--btn-border", "5px");
    document.documentElement.style.setProperty("--title-weight", "900");
    document.documentElement.style.setProperty("--photo-max-width", "85vw");
  }
  
  localStorage.setItem("fontSize", size);
  document.querySelector(`.font-controls button[data-size="${size}"]`).classList.add("active");
}

sizeButtons.forEach(btn => {
  btn.onclick = () => {
    applySize(btn.dataset.size);
  };
});

// 保存された設定を適用（デフォルトは「大」）
const saved = localStorage.getItem("fontSize") || "large";
applySize(saved);

/* =====================
   初期読み込み
===================== */
window.addEventListener('load', function() {
  // 初期画像の存在をチェック
  const img = new Image();
  img.onload = function() {
    console.log('✅ 初期画像が正常に読み込まれました');
  };
  img.onerror = function() {
    console.error('❌ 初期画像が見つかりません');
  };
  img.src = sections.battery.img;
});
</script>

</body>
</html>
