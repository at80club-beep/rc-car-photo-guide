<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>👀みてつくるシート🚗</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#f6f7f8;
  --card:#ffffff;
  --ok:#e6f7ec;
  --danger:#fff1f0;
  --final:#e8f4ff;
  --accent:#ff9800;
  --text:#333;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}

.container{
  max-width:960px;
  margin:0 auto;
  padding:12px;
}

header{
  text-align:center;
  font-size:1.6rem;
  font-weight:bold;
  margin:8px 0 12px;
}

/* ===== ナビ ===== */
.nav-wrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.nav{
  display:flex;
  gap:8px;
  padding:8px 0;
}
.nav button{
  flex:0 0 auto;
  border:none;
  padding:10px 14px;
  border-radius:999px;
  background:#ddd;
  font-size:1rem;
  cursor:pointer;
}
.nav button.active{
  background:var(--accent);
  color:#fff;
  font-weight:bold;
}
@media(min-width:900px){
  .nav-wrap{ overflow-x:visible; }
  .nav{ justify-content:center; }
}

/* ===== カード ===== */
.card{
  background:var(--card);
  border-radius:16px;
  padding:16px;
  margin-top:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}
.card.ok{ background:var(--ok); }
.card.danger{ background:var(--danger); }
.card.final{ background:var(--final); }

.card h2{
  margin:0 0 10px;
  font-size:1.4rem;
}

/* ===== 画像 ===== */
.photo-wrap{
  position:relative;
}
.photo-wrap img{
  width:100%;
  border-radius:12px;
}
.photo-label{
  position:absolute;
  bottom:8px;
  right:8px;
  background:rgba(0,0,0,0.6);
  color:#fff;
  font-size:0.85rem;
  padding:4px 8px;
  border-radius:999px;
}

/* ===== メッセージ ===== */
.ok-msg{
  margin-top:12px;
  font-size:1.1rem;
  font-weight:bold;
}
.note{
  margin-top:6px;
  font-size:1rem;
}

/* ===== オーバーレイ ===== */
.overlay{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.overlay img{
  max-width:100%;
  max-height:100%;
}
.overlay.show{ display:flex; }

@media(min-width:900px){
  .container{ padding:24px; }
  header{ font-size:2rem; }
}
</style>
</head>

<body>
<div class="container">
  <header>👀みてつくるシート🚗</header>

  <div class="nav-wrap">
    <div class="nav" id="nav"></div>
  </div>

  <div id="content"></div>
</div>

<div class="overlay" id="overlay">
  <img id="overlayImg" src="">
</div>

<script>
const steps = [
  { nav:"① でんち", title:"① でんち（BOX）", img:"images/battery_box.jpg",
    ok:"電池の向きOK！", note:"＋と－を確認します。" },

  { nav:"② せん", title:"② 電池につける電線", img:"images/wire_magnet.jpg",
    ok:"線がつながった！", note:"磁石がしっかり付いているか確認。外れていないか見ます。" },

  { nav:"③ スイッチ", title:"③ 前後切り替えスイッチ", img:"images/switch_complete.jpg",
    ok:"前後が切り替わる！", note:"左右SWを押して切り替わるか確認。向きを確認します。" },

  { nav:"④ まわる", title:"④ モーターは回る？", img:"images/motor_test.jpg",
    ok:"回れば OK（又は、LEDチェッカーで調べる）", note:"指を近づけないよう注意。回らない（つかない）場合は配線を確認。" },

  { nav:"⑤ みため", title:"⑤ 見た目完成（実験中）", img:"images/car_complete.jpg",
    ok:"つなぎ方をためそう！", note:"前後が逆なら入れ替えてみよう。", danger:true },

  { nav:"⑥ かんせい", title:"⑥ ほんとうの完成！", img:"images/complete.jpg",
    ok:"前後に動いたら大成功！", note:"安全に走らせよう。", final:true }
];

const navEl = document.getElementById("nav");
const contentEl = document.getElementById("content");
let current = 0;

steps.forEach((s,i)=>{
  const b = document.createElement("button");
  b.textContent = s.nav;
  b.onclick = ()=>showStep(i);
  navEl.appendChild(b);
});

function showStep(i){
  current = i;
  [...navEl.children].forEach((b,idx)=>b.classList.toggle("active",idx===i));

  const s = steps[i];
  const cls = s.final ? "final" : s.danger ? "danger" : "ok";

  contentEl.innerHTML = `
    <div class="card ${cls}">
      <h2>${s.title}</h2>
      <div class="photo-wrap">
        <img src="${s.img}" alt="" id="photo">
        <div class="photo-label">タップで拡大</div>
      </div>
      <div class="ok-msg">${s.ok}</div>
      <div class="note">${s.note}</div>
    </div>
  `;

  document.getElementById("photo").onclick = ()=>openOverlay(s.img);
}

const overlay = document.getElementById("overlay");
const overlayImg = document.getElementById("overlayImg");

function openOverlay(src){
  overlayImg.src = src;
  overlayImg.style.transform =
    window.innerWidth < window.innerHeight ? "rotate(90deg)" : "none";
  overlay.classList.add("show");
}

overlay.onclick = ()=>{
  overlay.classList.remove("show");
  overlayImg.style.transform = "none";
  window.scrollTo({ top:0 });
};

showStep(0);
</script>
</body>
</html>
