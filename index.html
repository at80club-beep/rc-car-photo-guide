<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー作り 写真で確認シート（指導員用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">

<style>
:root{
  --font-base:20px;
  --btn-font:20px;
  --btn-padding:12px 18px;
  --btn-border:5px;
  --title-weight:900;
  --photo-max-width:95vw;
}

body{
  margin:0;
  font-family:"Hiragino Sans","メイリオ",sans-serif;
  background:#faf7f2;
  color:#333;
  font-size:var(--font-base);
  line-height:1.7;
  overflow-x:hidden;
}

body.photo-expanded{
  overflow:hidden;
  position:fixed;
  width:100%;
  height:100%;
}

/* ---------- ヘッダー ---------- */
header{
  position:sticky;
  top:0;
  background:#fff7dd;
  border-bottom:4px solid #e0cfa0;
  padding:8px 10px;
  z-index:100;
}

.header-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.title{
  font-size:1.3em;
  font-weight:var(--title-weight);
  margin:0;
}

.subtitle{
  font-size:0.6em;
  color:#555;
}

.font-controls{
  display:flex;
  gap:6px;
}

.font-controls button{
  padding:8px 12px;
  font-size:16px;
  border:2px solid #999;
  border-radius:8px;
  background:#fff;
}

.font-controls button.active{
  background:#333;
  color:#fff;
}

/* ---------- ナビ ---------- */
nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:8px 0;
}

nav button{
  flex:1 1 auto;
  min-width:120px;
  min-height:50px;
  font-size:var(--btn-font);
  padding:var(--btn-padding);
  border:var(--btn-border) solid #a6842c;
  border-radius:12px;
  background:#fff;
  font-weight:700;
}

nav button.active{
  background:#f0b344;
  border-color:#000;
}

/* ---------- メイン ---------- */
main{
  padding:12px;
}

.section-title{
  font-size:1.3em;
  font-weight:800;
  border-bottom:3px solid #f0b344;
  margin-bottom:12px;
}

.photo-box{
  background:#fff;
  border:4px solid #e0cfa0;
  border-radius:14px;
  padding:15px;
  text-align:center;
}

.photo-container{
  max-width:var(--photo-max-width);
  margin:auto;
}

.photo-img{
  max-width:100%;
  max-height:400px;
  border-radius:12px;
  border:4px solid #e0cfa0;
  cursor:pointer;
}

.photo-hint{
  margin:10px 0;
  font-size:0.9em;
  color:#666;
}

.ok-box{
  background:#e8f6e8;
  border:3px solid #4caf50;
  border-radius:10px;
  padding:12px;
  font-weight:800;
}

.note{
  background:#f5efe4;
  padding:12px;
  border-left:4px solid #a6842c;
  margin-top:10px;
}

/* ---------- 拡大表示 ---------- */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:999;
}

.overlay-content{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.overlay-img{
  max-width:100%;
  max-height:100%;
  transform-origin:center;
  cursor:move;
}

.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  width:60px;
  height:60px;
  background:#000;
  color:#fff;
  font-size:40px;
  text-align:center;
  line-height:60px;
  border-radius:50%;
  border:3px solid #fff;
}

/* ---------- スマホ横向き優先 ---------- */
@media (max-width:768px){
  .overlay-img{
    width:100vw;
    height:auto;
    max-height:100vh;
    max-width:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <h1 class="title">リモコンカー作り 写真で確認シート <span class="subtitle">（指導員用）</span></h1>
    <div class="font-controls">
      <button data-size="small">小</button>
      <button data-size="medium">中</button>
      <button data-size="large" class="active">大</button>
    </div>
  </div>

  <nav>
    <button class="active">電池BOX完成</button>
  </nav>
</header>

<main>
  <div class="section-title">電池BOX完成</div>

  <div class="photo-box">
    <div class="photo-container">
      <img id="photo" src="images/battery_box.jpg" class="photo-img">
    </div>

    <p class="photo-hint">📱タップで拡大（横向きで自動ズーム）</p>

    <div class="ok-box">✅ この写真と同じならOK</div>
    <div class="note">電池の＋－向きを確認</div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="overlay-content">
    <div class="close-btn" id="closeBtn">×</div>
    <img id="overlayImg" class="overlay-img">
  </div>
</div>

<script>
const photo = document.getElementById("photo");
const overlay = document.getElementById("overlay");
const overlayImg = document.getElementById("overlayImg");
const closeBtn = document.getElementById("closeBtn");

let scale = 1;
let posX = 0;
let posY = 0;

function updateTransform(){
  overlayImg.style.transform =
    `translate(${posX}px, ${posY}px) scale(${scale})`;
}

function resetView(){
  scale = 1;
  posX = 0;
  posY = 0;
  updateTransform();
}

/* ---------- 横向き時 自動ズーム ---------- */
function applyOrientationZoom(){
  if (overlay.style.display !== "block") return;

  if (window.matchMedia("(orientation: landscape)").matches) {
    scale = 1.2;
  } else {
    scale = 1.0;
    posX = 0;
    posY = 0;
  }
  updateTransform();
}

window.addEventListener("orientationchange", applyOrientationZoom);
window.addEventListener("resize", applyOrientationZoom);

/* ---------- 開く ---------- */
photo.onclick = () => {
  overlayImg.src = photo.src;
  overlay.style.display = "block";
  document.body.classList.add("photo-expanded");
  resetView();
  applyOrientationZoom();
};

/* ---------- 閉じる ---------- */
closeBtn.onclick = () => {
  overlay.style.display = "none";
  document.body.classList.remove("photo-expanded");
  resetView();
};
</script>

</body>
</html>
