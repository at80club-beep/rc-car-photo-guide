<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー 写真参照ガイド</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ===== 基本 ===== */
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #faf7f2;
  color: #333;
  font-size: 16px;
  line-height: 1.6;
}

/* ===== ヘッダー ===== */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff7dd;
  border-bottom: 1px solid #e0d7c2;
  padding: 8px 12px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}
header small {
  font-size: 12px;
}

/* ===== ナビ ===== */
nav {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 0;
}

nav a {
  text-decoration: none;
  font-size: 14px;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1px solid #e0cfa0;
  background: #fffdf4;
  color: #554018;
  white-space: nowrap;
}

nav button {
  border: 1px solid #e0cfa0;
  background: #fffdf4;
  border-radius: 999px;
  padding: 2px 8px;
  font-size: 12px;
  cursor: pointer;
}

/* ===== メイン ===== */
main {
  padding: 12px;
}

/* セクションの余白は下だけ */
section {
  margin: 0 0 32px;
  padding: 14px;
  background: #fff;
  border-radius: 10px;
  border: 1px solid #eee0c8;
}

/* 見出しがアンカー基準 */
section > h2 {
  margin: 0 0 8px;
  border-left: 4px solid #f0b344;
  padding-left: 8px;
  color: #d89c2c;
}

/* 写真参照 */
.photo-reference {
  background: #fff8e6;
  border-left: 6px solid #e0b85c;
  padding: 12px;
  border-radius: 8px;
  margin-top: 10px;
}

.photo-page {
  font-size: 20px;
  font-weight: bold;
  color: #d89c2c;
}

/* 指導ポイント */
.note-box {
  background: #f5efe4;
  padding: 12px;
  border-radius: 8px;
  margin-top: 10px;
}

/* ===== 印刷 ===== */
@media print {
  header { display: none; }
  .note-box { display: none; }
}
</style>
</head>

<body>

<header>
  <h1>リモコンカー 写真参照ガイド <small>（指導員用）</small></h1>
  <nav>
    <a href="#battery-box">電池BOX</a>
    <a href="#wire">電線</a>
    <a href="#switch">スイッチ</a>
    <a href="#test">テスト</a>
    <a href="#complete">完成</a>

    <span style="margin-left:8px;font-size:12px;">文字</span>
    <button id="font-s">小</button>
    <button id="font-m">中</button>
    <button id="font-l">大</button>

    <button id="toggle-note">指導ポイント</button>
  </nav>
</header>

<main>

<section id="battery-box">
  <h2>📦 電池BOXをつくろう！</h2>
  <div class="photo-reference">
    <div class="photo-page">写真 P25</div>
    電池の向き、固定方法を確認します。
  </div>
  <div class="note-box">
    ・＋と－の向きを確認<br>
    ・銅テープで固定
  </div>
</section>

<section id="wire">
  <h2>🔌 電線を作ろう！</h2>
  <div class="photo-reference">
    <div class="photo-page">写真 P30</div>
    磁石と銅線の仕組み
  </div>
  <div class="note-box">
    ・端子に確実に接触
  </div>
</section>

<section id="switch">
  <h2>🎮 スイッチ完成図</h2>
  <div class="photo-reference">
    <div class="photo-page">写真 P62 / P72</div>
    配線と構造
  </div>
  <div class="note-box">
    ・左右で電気の向きが変わる
  </div>
</section>

<section id="test">
  <h2>🔬 テスト実験</h2>
  <div class="photo-reference">
    <div class="photo-page">写真 P81</div>
    回転方向を確認
  </div>
  <div class="note-box">
    ・接触不良を確認
  </div>
</section>

<section id="complete">
  <h2>🏆 完成品</h2>
  <div class="photo-reference">
    <div class="photo-page">写真 P50</div>
    完成形
  </div>
  <div class="note-box">
    ・配線とバランス調整
  </div>
</section>

</main>

<script>
(function () {
  const header = document.querySelector('header');
  const headings = document.querySelectorAll('section > h2');
  const notes = document.querySelectorAll('.note-box');
  const body = document.body;

  if (!header) return;

  function updateAnchorOffset() {
    const h = header.getBoundingClientRect().height + 8;
    document.documentElement.style.scrollPaddingTop = h + 'px';
    headings.forEach(hd => {
      hd.style.scrollMarginTop = h + 'px';
    });
  }

  function setFont(scale) {
    body.style.fontSize = (16 * scale) + 'px';
    setTimeout(updateAnchorOffset, 0);
  }

  document.getElementById('font-s').onclick = () => setFont(0.9);
  document.getElementById('font-m').onclick = () => setFont(1);
  document.getElementById('font-l').onclick = () => setFont(1.15);

  document.getElementById('toggle-note').onclick = () => {
    notes.forEach(n => {
      n.style.display = n.style.display === 'none' ? '' : 'none';
    });
    setTimeout(updateAnchorOffset, 0);
  };

  window.addEventListener('resize', updateAnchorOffset);
  updateAnchorOffset();
})();
</script>

</body>
</html>
