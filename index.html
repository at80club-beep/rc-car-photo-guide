<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー 写真参照ガイド（指導員用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =====================
   サイズ制御用変数
===================== */
:root{
  --font-base:16px;
  --btn-font:16px;
  --btn-padding:8px 14px;
  --btn-border:3px;
  --title-weight:800;
}

/* =====================
   共通
===================== */
body{
  margin:0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background:#faf7f2;
  color:#333;
  font-size:var(--font-base);
  line-height:1.7;
}

/* =====================
   ヘッダー
===================== */
header{
  position:sticky;
  top:0;
  background:#fff7dd;
  border-bottom:4px solid #e0cfa0;
  padding:8px 10px;
  z-index:100;
}

/* タイトル行 */
.header-row{
  display:flex;
  align-items:center;
  gap:10px;
  overflow-x:auto;
}

.title{
  font-size:1.3em;
  font-weight:var(--title-weight);
  margin:0;
  white-space:nowrap;
}

.subtitle{
  font-size:0.6em;
  font-weight:500;
  color:#555;
  margin-left:4px;
}

/* =====================
   文字サイズ切替
===================== */
.font-controls{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

.font-controls button{
  min-width:44px;
  padding:6px 10px;
  font-size:14px;
  border:2px solid #999;
  background:#fff;
  border-radius:8px;
  cursor:pointer;
}

.font-controls button.active{
  background:#333;
  color:#fff;
  border-color:#000;
}

/* =====================
   工程ナビ
===================== */
nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:6px 0 4px;
}

nav button{
  flex:0 0 auto;
  font-size:var(--btn-font);
  padding:var(--btn-padding);
  border:var(--btn-border) solid #a6842c;
  background:#fff;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}

nav button.active{
  background:#f0b344;
  color:#000;
  border-color:#000;
}

/* =====================
   メイン
===================== */
main{
  padding:12px;
}

.section-title{
  font-size:1.25em;
  font-weight:800;
  margin-bottom:10px;
}

.photo-box{
  background:#fff;
  border:4px solid #e0cfa0;
  border-radius:14px;
  padding:12px;
}

/* 写真 */
.photo-img{
  width:100%;
  max-width:640px;
  display:block;
  margin:0 auto 10px;
  border-radius:12px;
  border:4px solid #e0cfa0;
  cursor:pointer;
}

.photo-img:active{
  transform:scale(0.98);
}

/* OKメッセージ */
.ok-box{
  background:#e8f6e8;
  border:3px solid #4caf50;
  border-radius:10px;
  padding:10px;
  margin:10px 0;
  font-size:1.05em;
  font-weight:800;
  text-align:center;
}

/* 補足 */
.note{
  background:#f5efe4;
  padding:10px;
  border-radius:8px;
  font-size:0.95em;
}

/* =====================
   写真拡大
===================== */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  z-index:999;
  align-items:center;
  justify-content:center;
}

.overlay img{
  max-width:95%;
  max-height:95%;
  border-radius:12px;
}

/* =====================
   印刷対応
===================== */
@media print{
  header{
    display:none;
  }

  .photo-img{
    display:none;
  }

  body{
    background:#fff;
    font-size:12pt;
  }

  .photo-box{
    border:none;
    padding:0;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <h1 class="title">
      リモコンカー 写真参照ガイド
      <span class="subtitle">（指導員用）</span>
    </h1>

    <div class="font-controls">
      <button data-size="small">小</button>
      <button data-size="medium" class="active">中</button>
      <button data-size="large">大</button>
    </div>
  </div>

  <nav id="nav">
    <button data-target="battery" class="active">電池BOX完成</button>
    <button data-target="wire">電池にくっつく電線</button>
    <button data-target="switch">前後が切り替わるスイッチ</button>
    <button data-target="test">モーターが回るテスト</button>
    <button data-target="complete">完成したリモコンカー</button>
  </nav>
</header>

<main>

  <div class="section-title" id="sectionTitle">
    電池BOX完成
  </div>

  <div class="photo-box">
    <img id="photo" src="images/battery_box.jpg" alt="電池BOX完成" class="photo-img">

    <div class="ok-box" id="okMessage">
      ✅ この写真と同じになっていれば OK です
    </div>

    <div class="note" id="note">
      電池の＋－向きが合っているかを確認します。
    </div>
  </div>

</main>

<!-- 写真拡大 -->
<div id="overlay" class="overlay" onclick="closePhoto()">
  <img id="overlayImg">
</div>

<script>
/* =====================
   工程データ
===================== */
const sections = {
  battery:{
    title:"電池BOX完成",
    img:"images/battery_box.jpg",
    ok:"この写真と同じになっていれば OK です",
    note:"電池の＋－向きが合っているかを確認します。"
  },
  wire:{
    title:"電池にくっつく電線",
    img:"images/wire_magnet.jpg",
    ok:"この形になっていれば OK です",
    note:"磁石が端子にピタッと付いているか確認します。"
  },
  switch:{
    title:"前後が切り替わるスイッチ",
    img:"images/switch_complete.jpg",
    ok:"この配置になっていれば OK です",
    note:"左右のボタンで動きが変わることを確認します。"
  },
  test:{
    title:"モーターが回るテスト",
    img:"images/motor_test.jpg",
    ok:"写真のように回れば OK です",
    note:"回らない場合は接触を確認します。"
  },
  complete:{
    title:"完成したリモコンカー",
    img:"images/car_complete.jpg",
    ok:"この状態なら完成です",
    note:"配線がタイヤに絡んでいないか確認します。"
  }
};

/* =====================
   工程切替
===================== */
const buttons = document.querySelectorAll("nav button");
buttons.forEach(btn=>{
  btn.onclick=()=>{
    buttons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    const key = btn.dataset.target;
    document.getElementById("sectionTitle").textContent = sections[key].title;
    document.getElementById("photo").src = sections[key].img;
    document.getElementById("photo").alt = sections[key].title;
    document.getElementById("okMessage").innerHTML = "✅ " + sections[key].ok;
    document.getElementById("note").innerHTML = sections[key].note;
  };
});

/* =====================
   写真拡大
===================== */
const photo = document.getElementById("photo");
const overlay = document.getElementById("overlay");
const overlayImg = document.getElementById("overlayImg");

photo.onclick = () => {
  overlayImg.src = photo.src;
  overlay.style.display = "flex";
};

function closePhoto(){
  overlay.style.display = "none";
}

/* =====================
   文字サイズ切替（保存）
===================== */
const sizeButtons = document.querySelectorAll(".font-controls button");

function applySize(size){
  if(size==="small"){
    document.documentElement.style.setProperty("--font-base","14px");
    document.documentElement.style.setProperty("--btn-font","14px");
    document.documentElement.style.setProperty("--btn-padding","6px 10px");
    document.documentElement.style.setProperty("--btn-border","2px");
    document.documentElement.style.setProperty("--title-weight","700");
  }
  if(size==="medium"){
    document.documentElement.style.setProperty("--font-base","16px");
    document.documentElement.style.setProperty("--btn-font","16px");
    document.documentElement.style.setProperty("--btn-padding","8px 14px");
    document.documentElement.style.setProperty("--btn-border","3px");
    document.documentElement.style.setProperty("--title-weight","800");
  }
  if(size==="large"){
    document.documentElement.style.setProperty("--font-base","19px");
    document.documentElement.style.setProperty("--btn-font","20px");
    document.documentElement.style.setProperty("--btn-padding","12px 18px");
    document.documentElement.style.setProperty("--btn-border","5px");
    document.documentElement.style.setProperty("--title-weight","900");
  }
  localStorage.setItem("fontSize",size);
}

sizeButtons.forEach(btn=>{
  btn.onclick=()=>{
    sizeButtons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    applySize(btn.dataset.size);
  };
});

const saved = localStorage.getItem("fontSize") || "medium";
applySize(saved);
document.querySelector(`.font-controls button[data-size="${saved}"]`).classList.add("active");
</script>

</body>
</html>
