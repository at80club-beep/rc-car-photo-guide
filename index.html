<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>👀みてつくるシート🚗</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --primary:#2d7ff9;
  --ok:#e6f6ea;
  --note:#fff6e0;
  --danger:#ffe6e6;
  --final:#e6f0ff;
  --text:#222;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container{
  max-width:960px;
  margin:0 auto;
  padding:12px;
}
h1{
  text-align:center;
  font-size:1.8rem;
  margin:10px 0 16px;
}
.nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
}
.nav::-webkit-scrollbar{display:none;}
.nav button{
  flex:0 0 auto;
  border:none;
  border-radius:999px;
  padding:10px 14px;
  font-size:1rem;
  background:#ddd;
  cursor:pointer;
}
.nav button.active{
  background:var(--primary);
  color:#fff;
}
@media(min-width:768px){
  .nav{overflow-x:visible; justify-content:space-between;}
}
.card{
  background:var(--card);
  border-radius:16px;
  padding:16px;
  margin-top:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}
.card.ok{background:var(--ok);}
.card.note{background:var(--note);}
.card.danger{background:var(--danger);}
.card.final{background:var(--final);}
.card h2{
  font-size:1.4rem;
  margin:0 0 12px;
}
.photo-wrap{
  position:relative;
}
.photo-wrap img{
  width:100%;
  border-radius:12px;
  cursor:pointer;
}
.photo-label{
  position:absolute;
  bottom:8px;
  right:8px;
  background:rgba(0,0,0,0.6);
  color:#fff;
  font-size:0.85rem;
  padding:4px 8px;
  border-radius:999px;
}
.msg{
  font-size:1.1rem;
  margin-top:10px;
}
.small{
  font-size:0.95rem;
  opacity:0.9;
}

/* overlay */
.overlay{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  touch-action:none;
}
.overlay img{
  max-width:90vw;
  max-height:90vh;
}
.overlay .close{
  position:absolute;
  top:16px;
  right:16px;
  background:#fff;
  border:none;
  border-radius:50%;
  width:44px;
  height:44px;
  font-size:1.5rem;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="container">
  <h1>👀みてつくるシート🚗</h1>
  <div class="nav" id="nav"></div>
  <div id="content"></div>
</div>

<script>
const steps = [
  { nav:"① でんち", title:"① でんち（BOX）", img:"images/battery_box.jpg",
    ok:"電池の向きOK！", note:"＋と－を確認します。" },

  { nav:"② せん", title:"② 電池につける電線", img:"images/wire_magnet.jpg",
    ok:"線がつながった！", note:"磁石がしっかり付いているか確認。外れていないか見ます。" },

  { nav:"③ スイッチ", title:"③ 前後切り替えスイッチ", img:"images/switch_complete.jpg",
    ok:"前後が切り替わる！", note:"左右SWを押して切り替わるか確認。向きを確認します。" },

  { nav:"④ まわる", title:"④ モーターは回る？", img:"images/motor_test.jpg",
    ok:"回れば OK（又は、LEDチェッカーで調べる）", note:"指を近づけないよう注意。回らない（つかない）場合は配線を確認。" },

  { nav:"⑤ みため", title:"⑤ 見た目完成（実験中）", img:"images/car_complete.jpg",
    ok:"つなぎ方をためそう！", note:"前後が逆なら入れ替えてみよう。", danger:true },

  { nav:"⑥ かんせい", title:"⑥ ほんとうの完成！", img:"images/complete.jpg",
    ok:"前後に動いたら大成功！", note:"安全に走らせよう。", final:true }
];

const navEl = document.getElementById("nav");
const contentEl = document.getElementById("content");

steps.forEach((s,i)=>{
  const b=document.createElement("button");
  b.textContent=s.nav;
  if(i===0)b.classList.add("active");
  b.onclick=()=>selectStep(i);
  navEl.appendChild(b);
});

function selectStep(i){
  [...navEl.children].forEach((b,idx)=>b.classList.toggle("active",idx===i));
  renderStep(i);
  window.scrollTo(0,0);
}

function renderStep(i){
  const s=steps[i];
  const card=document.createElement("div");
  card.className="card";
  if(s.danger)card.classList.add("danger");
  if(s.final)card.classList.add("final");
  card.innerHTML=`
    <h2>${s.title}</h2>
    <div class="photo-wrap">
      <img src="${s.img}" alt="">
      <div class="photo-label">タップで拡大</div>
    </div>
    <div class="msg">✅ ${s.ok}</div>
    <div class="msg small">⚠️ ${s.note}</div>
  `;
  card.querySelector("img").onclick=()=>openOverlay(s.img);
  contentEl.innerHTML="";
  contentEl.appendChild(card);
}

function openOverlay(src){
  document.body.style.overflow="hidden";

  const overlay=document.createElement("div");
  overlay.className="overlay";

  const img=document.createElement("img");
  img.src=src;

  const close=document.createElement("button");
  close.className="close";
  close.textContent="×";

  if(window.innerHeight>window.innerWidth){
    img.style.transform="rotate(90deg)";
  }

  close.onclick=()=>{
    document.body.style.overflow="";
    window.scrollTo(0,0);
    overlay.remove();
  };

  overlay.appendChild(img);
  overlay.appendChild(close);
  document.body.appendChild(overlay);
}

renderStep(0);
</script>
</body>
</html>
