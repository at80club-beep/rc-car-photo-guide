<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー作り 写真で確認シート（指導員用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =====================
   サイズ制御用変数
===================== */
:root{
  --font-base:20px;
  --btn-font:20px;
  --btn-padding:12px 18px;
  --btn-border:5px;
  --title-weight:900;
  --photo-max-width:95vw;
}

/* =====================
   共通
===================== */
body{
  margin:0;
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
  background:#faf7f2;
  color:#333;
  font-size:var(--font-base);
  line-height:1.7;
  overflow-x:hidden;
}

/* =====================
   ヘッダー
===================== */
header{
  position:sticky;
  top:0;
  background:#fff7dd;
  border-bottom:4px solid #e0cfa0;
  padding:8px 10px;
  z-index:100;
}

/* タイトル行 */
.header-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.title{
  font-size:1.3em;
  font-weight:var(--title-weight);
  margin:0;
  white-space:nowrap;
}

.subtitle{
  font-size:0.6em;
  font-weight:500;
  color:#555;
  margin-left:4px;
}

/* =====================
   文字サイズ切替
===================== */
.font-controls{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

.font-controls button{
  min-width:50px;
  padding:8px 12px;
  font-size:16px;
  border:2px solid #999;
  background:#fff;
  border-radius:8px;
  cursor:pointer;
}

.font-controls button.active{
  background:#333;
  color:#fff;
  border-color:#000;
}

/* =====================
   工程ナビ
===================== */
nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:8px 0 6px;
}

nav button{
  flex:1 1 auto;
  min-width:120px;
  min-height:50px;
  font-size:var(--btn-font);
  padding:var(--btn-padding);
  border:var(--btn-border) solid #a6842c;
  background:#fff;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  margin-bottom:5px;
}

nav button.active{
  background:#f0b344;
  color:#000;
  border-color:#000;
}

/* =====================
   メイン
===================== */
main{
  padding:12px;
  scroll-margin-top:120px; /* ヘッダー分のオフセット */
}

.section-title{
  font-size:1.3em;
  font-weight:800;
  margin-bottom:12px;
  padding-bottom:5px;
  border-bottom:3px solid #f0b344;
  scroll-margin-top:120px; /* スクロール時の位置調整 */
}

.photo-box{
  background:#fff;
  border:4px solid #e0cfa0;
  border-radius:14px;
  padding:15px;
  text-align:center;
}

/* 写真コンテナ */
.photo-container{
  position:relative;
  max-width:var(--photo-max-width);
  margin:0 auto 15px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.photo-img{
  width:auto;
  max-width:100%;
  max-height:400px;
  object-fit:contain;
  display:block;
  border-radius:12px;
  border:4px solid #e0cfa0;
  cursor:pointer;
  background:#f9f9f9;
  margin:0 auto;
}

.photo-img:active{
  transform:scale(0.98);
}

/* スマホ向けヒント */
.photo-hint{
  text-align:center;
  color:#666;
  font-size:0.9em;
  margin:5px 0 15px;
  padding:8px;
  background:#f0f0f0;
  border-radius:8px;
  border-left:4px solid #f0b344;
}

/* OKメッセージ */
.ok-box{
  background:#e8f6e8;
  border:3px solid #4caf50;
  border-radius:10px;
  padding:12px;
  margin:15px 0;
  font-size:1.1em;
  font-weight:800;
  text-align:center;
}

/* 補足 */
.note{
  background:#f5efe4;
  padding:12px;
  border-radius:8px;
  font-size:1em;
  border-left:4px solid #a6842c;
}

/* =====================
   写真拡大（スマホ最適化）- ピンチズーム対応
===================== */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:999;
  touch-action:none;
  overflow:hidden;
}

.overlay-content{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.overlay img{
  position:absolute;
  max-width:none;
  max-height:none;
  transition:transform 0.1s ease;
  cursor:move;
  will-change:transform;
  transform-origin:center center;
  user-select:none;
  -webkit-user-drag:none;
}

/* スマホ向け：必ず横向き表示 */
@media (max-width: 768px) {
  .overlay img {
    /* スマホの場合は常に横向き表示 */
    transform: rotate(0deg);
    width: auto;
    height: auto;
    max-width: 90vw;
    max-height: 90vh;
  }
  
  /* スマホ縦向きの場合でも横向きに表示 */
  @media (orientation: portrait) {
    .overlay img {
      transform: rotate(90deg);
      max-width: 90vh;
      max-height: 90vw;
    }
  }
}

/* 閉じるボタン */
.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  width:60px;
  height:60px;
  background:rgba(0,0,0,0.7);
  color:white;
  font-size:40px;
  line-height:60px;
  text-align:center;
  border-radius:50%;
  z-index:1001;
  cursor:pointer;
  border:3px solid white;
}

/* 操作説明 */
.instruction{
  position:absolute;
  bottom:20px;
  left:0;
  right:0;
  text-align:center;
  color:white;
  font-size:16px;
  z-index:1000;
  padding:10px;
  background:rgba(0,0,0,0.5);
  opacity:0.8;
}

/* タップで閉じるエリア */
.tap-to-close{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  z-index:999;
  display:none;
}

/* タブレット・PC・スマホ横向き */
@media (min-width:769px), (orientation:landscape){
  .overlay img{
    max-width:95%;
    max-height:95%;
  }
}

/* =====================
   印刷対応
===================== */
@media print{
  header{
    display:none;
  }

  .photo-img, .photo-hint{
    display:none;
  }

  body{
    background:#fff;
    font-size:14pt;
  }

  .photo-box{
    border:none;
    padding:0;
  }
}

/* =====================
   フッター
===================== */
footer{
  text-align:center;
  padding:15px;
  font-size:0.9em;
  color:#666;
  border-top:2px solid #e0cfa0;
  margin-top:20px;
}

/* 画像エラースタイル */
.img-error{
  position:relative;
}

.img-error::after{
  content:"画像が見つかりません";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  color:#ff6b6b;
  font-weight:bold;
  text-align:center;
  padding:10px;
  background:rgba(255,255,255,0.9);
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <h1 class="title">
      リモコンカー作り 写真で確認シート
      <span class="subtitle">（指導員用）</span>
    </h1>

    <div class="font-controls">
      <button data-size="small">小</button>
      <button data-size="medium">中</button>
      <button data-size="large" class="active">大</button>
    </div>
  </div>

  <nav id="nav">
    <button data-target="battery" class="active">電池BOX完成</button>
    <button data-target="wire">電池につける電線</button>
    <button data-target="switch">前後切り替えスイッチ</button>
    <button data-target="test">モーターのテスト</button>
    <button data-target="complete">完成品</button>
  </nav>
</header>

<main>
  <div class="section-title" id="sectionTitle">
    電池BOX完成
  </div>

  <div class="photo-box">
    <div class="photo-container">
      <img id="photo" src="images/battery_box.jpg" alt="電池BOX完成" class="photo-img">
    </div>
    
    <p class="photo-hint">
      📱写真をタップで拡大表示<br>
      🤏拡大中: 指2本で拡大縮小・1本指で移動・タップで戻る
    </p>

    <div class="ok-box" id="okMessage">
      ✅ この写真と同じになっていれば OK です
    </div>

    <div class="note" id="note">
      電池の＋－向きが合っているかを確認します。
    </div>
  </div>
</main>

<footer>
  <p>このシートはリモコンカー作りの指導員用です。写真を見比べて確認しましょう。</p>
</footer>

<!-- 写真拡大 -->
<div id="overlay" class="overlay">
  <div class="overlay-content">
    <div class="close-btn" onclick="closePhoto()">×</div>
    <div class="instruction">
      指2本で拡大縮小・1本指で移動・タップで閉じる
    </div>
    <!-- タップで閉じる透明なエリア -->
    <div class="tap-to-close" id="tapToClose" onclick="closePhoto()"></div>
    <img id="overlayImg">
  </div>
</div>

<script>
/* =====================
   工程データ
===================== */
const sections = {
  battery:{
    title:"電池BOX完成",
    img:"images/battery_box.jpg",
    ok:"この写真と同じになっていれば OK です",
    note:"電池の＋－向きが合っているかを確認します。"
  },
  wire:{
    title:"電池につける電線",
    img:"images/wire_magnet.jpg",
    ok:"この形になっていれば OK です",
    note:"磁石が端子にピタッと付いているか確認します。"
  },
  switch:{
    title:"前後切り替えスイッチ",
    img:"images/switch_complete.jpg",
    ok:"この配置になっていれば OK です",
    note:"左右のボタンで動きが変わることを確認します。"
  },
  test:{
    title:"モーターのテスト",
    img:"images/motor_test.jpg",
    ok:"写真のように回れば OK です",
    note:"回らない場合は接触を確認します。"
  },
  complete:{
    title:"完成品",
    img:"images/car_complete.jpg",
    ok:"この状態なら完成です",
    note:"配線がタイヤに絡んでいないか確認します。"
  }
};

/* =====================
   工程切替 - ページトップにスクロールする機能追加
===================== */
const buttons = document.querySelectorAll("nav button");
const photo = document.getElementById("photo");

// ページトップにスクロールする関数
function scrollToTop() {
  // スムーズスクロールを使用（高齢者向けにゆっくり）
  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

buttons.forEach(btn => {
  btn.onclick = () => {
    // まずページトップにスクロール
    scrollToTop();
    
    // 少し遅延させてから内容を変更（スクロールが始まった後）
    setTimeout(() => {
      buttons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const key = btn.dataset.target;
      const section = sections[key];
      
      document.getElementById("sectionTitle").textContent = section.title;
      document.getElementById("okMessage").innerHTML = "✅ " + section.ok;
      document.getElementById("note").innerHTML = section.note;
      
      // 画像の読み込み
      const img = new Image();
      img.onload = function() {
        photo.src = section.img;
        photo.alt = section.title;
        photo.classList.remove("img-error");
      };
      img.onerror = function() {
        photo.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480"><rect width="640" height="480" fill="%23f5f5f5"/><text x="320" y="220" font-family="Arial" font-size="24" fill="%23666" text-anchor="middle">${section.title}</text><text x="320" y="260" font-family="Arial" font-size="18" fill="%23999" text-anchor="middle">画像準備中</text></svg>`;
        photo.alt = `${section.title}（画像準備中）`;
        photo.classList.add("img-error");
      };
      img.src = section.img;
      
      // ボタンにフォーカスを当てる
      btn.focus();
    }, 300); // 300msの遅延でスクロール後に内容変更
  };
});

/* =====================
   写真拡大 - ピンチズーム対応
===================== */
const overlay = document.getElementById("overlay");
const overlayImg = document.getElementById("overlayImg");
const instruction = document.getElementById("instruction");
const tapToClose = document.getElementById("tapToClose");

// ピンチズーム用の変数
let currentScale = 1;
let currentX = 0;
let currentY = 0;
let lastX = 0;
let lastY = 0;
let isDragging = false;
let initialDistance = null;
let initialScale = 1;
let touchStartTime = 0;
let touchStartX = 0;
let touchStartY = 0;
let isZoomed = false;

// 写真クリックで拡大表示
photo.onclick = () => {
  overlayImg.src = photo.src;
  overlayImg.style.transform = 'translate(0px, 0px) scale(1)';
  overlay.style.display = "block";
  document.body.style.overflow = "hidden";
  
  // スマホの場合は横向きに調整
  adjustForMobile();
  
  // ズーム状態をリセット
  resetZoomState();
  
  // タップで閉じるエリアを表示（3秒後に表示）
  tapToClose.style.display = "none";
  setTimeout(() => {
    tapToClose.style.display = "block";
  }, 3000);
};

// スマホ表示用の調整
function adjustForMobile() {
  if (window.innerWidth <= 768) {
    // スマホの場合は横向き表示
    if (window.innerHeight > window.innerWidth) {
      // 縦向きの場合
      overlayImg.style.transform = 'rotate(90deg) translate(0px, 0px) scale(1)';
    } else {
      // 横向きの場合
      overlayImg.style.transform = 'translate(0px, 0px) scale(1)';
    }
  }
}

// ズーム状態をリセット
function resetZoomState() {
  currentScale = 1;
  currentX = 0;
  currentY = 0;
  isDragging = false;
  isZoomed = false;
  initialDistance = null;
  initialScale = 1;
}

// 拡大画像を閉じる
function closePhoto() {
  overlay.style.display = "none";
  document.body.style.overflow = "auto";
  resetZoomState();
  tapToClose.style.display = "none";
}

// 画像のトランスフォームを更新
function updateTransform() {
  // 画像がコンテナからはみ出さないように制限
  const containerWidth = overlay.clientWidth;
  const containerHeight = overlay.clientHeight;
  const imgWidth = overlayImg.naturalWidth * currentScale;
  const imgHeight = overlayImg.naturalHeight * currentScale;
  
  // 画像がコンテナより小さい場合は中央に配置
  if (imgWidth < containerWidth) {
    currentX = 0;
  } else {
    // 画像がコンテナより大きい場合は移動範囲を制限
    const maxX = (imgWidth - containerWidth) / 2;
    currentX = Math.max(Math.min(currentX, maxX), -maxX);
  }
  
  if (imgHeight < containerHeight) {
    currentY = 0;
  } else {
    const maxY = (imgHeight - containerHeight) / 2;
    currentY = Math.max(Math.min(currentY, maxY), -maxY);
  }
  
  // スマホの場合は回転を考慮
  let transform = '';
  if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) {
    // スマホ縦向きの場合は90度回転
    transform = `rotate(90deg) translate(${currentX}px, ${currentY}px) scale(${currentScale})`;
  } else {
    transform = `translate(${currentX}px, ${currentY}px) scale(${currentScale})`;
  }
  
  overlayImg.style.transform = transform;
  isZoomed = currentScale > 1.1;
}

// タッチイベントの処理 - スマホ用
overlayImg.addEventListener('touchstart', (e) => {
  e.preventDefault();
  
  if (e.touches.length === 1) {
    // 1本指: ドラッグ開始
    isDragging = true;
    lastX = e.touches[0].clientX - currentX;
    lastY = e.touches[0].clientY - currentY;
    
    // シングルタップ判定用
    touchStartTime = Date.now();
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    // 2本指: ピンチズーム開始
    isDragging = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    initialDistance = Math.sqrt(dx * dx + dy * dy);
    initialScale = currentScale;
    
    // 2本指の中点を計算
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    
    // 拡大の中心点を調整
    lastX = midX - currentX;
    lastY = midY - currentY;
  }
}, { passive: false });

overlayImg.addEventListener('touchmove', (e) => {
  e.preventDefault();
  
  if (e.touches.length === 1 && isDragging) {
    // 1本指: ドラッグ
    const x = e.touches[0].clientX - lastX;
    const y = e.touches[0].clientY - lastY;
    
    currentX = x;
    currentY = y;
    updateTransform();
  } else if (e.touches.length === 2) {
    // 2本指: ピンチズーム
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (initialDistance !== null) {
      // 距離の変化からスケールを計算
      currentScale = initialScale * (distance / initialDistance);
      
      // スケールを制限 (0.5倍〜5倍)
      currentScale = Math.max(0.5, Math.min(5, currentScale));
      
      // 2本指の中点
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      
      // 拡大中心を調整
      const scaleChange = currentScale / initialScale;
      currentX = midX - (midX - currentX) * scaleChange;
      currentY = midY - (midY - currentY) * scaleChange;
      
      updateTransform();
    }
  }
}, { passive: false });

// スマホ用：シンプルなタップで閉じる
overlayImg.addEventListener('touchend', (e) => {
  e.preventDefault();
  
  // タッチ開始からの時間と移動距離を計算
  const touchTime = Date.now() - touchStartTime;
  const touch = e.changedTouches[0];
  const touchMoveX = Math.abs(touch.clientX - touchStartX);
  const touchMoveY = Math.abs(touch.clientY - touchStartY);
  
  // 条件：短時間（300ms以内）かつほとんど動かず（10px以内）、ズームしていない
  if (touchTime < 300 && touchMoveX < 10 && touchMoveY < 10 && !isZoomed) {
    // シングルタップで閉じる
    setTimeout(() => {
      closePhoto();
    }, 50);
    return;
  }
  
  // ズーム中のシングルタップは元のサイズに戻す
  if (touchTime < 300 && touchMoveX < 10 && touchMoveY < 10 && isZoomed && e.touches.length === 0) {
    // 元のサイズに戻す
    currentScale = 1;
    currentX = 0;
    currentY = 0;
    updateTransform();
    return;
  }
  
  if (e.touches.length === 0) {
    // タッチ終了
    isDragging = false;
    initialDistance = null;
    updateTransform();
  } else if (e.touches.length === 1) {
    // 2本指から1本指になった場合
    isDragging = true;
    lastX = e.touches[0].clientX - currentX;
    lastY = e.touches[0].clientY - currentY;
    initialDistance = null;
  }
}, { passive: false });

// マウスイベントの処理（PC用）
overlayImg.addEventListener('mousedown', (e) => {
  e.preventDefault();
  
  // 左クリックのみ処理
  if (e.button !== 0) return;
  
  isDragging = true;
  lastX = e.clientX - currentX;
  lastY = e.clientY - currentY;
  
  // クリック判定用
  touchStartTime = Date.now();
  touchStartX = e.clientX;
  touchStartY = e.clientY;
});

overlayImg.addEventListener('mousemove', (e) => {
  e.preventDefault();
  
  if (isDragging) {
    const x = e.clientX - lastX;
    const y = e.clientY - lastY;
    
    currentX = x;
    currentY = y;
    updateTransform();
  }
});

overlayImg.addEventListener('mouseup', (e) => {
  e.preventDefault();
  
  // クリック判定
  if (e.button === 0) {
    const clickTime = Date.now() - touchStartTime;
    const clickMoveX = Math.abs(e.clientX - touchStartX);
    const clickMoveY = Math.abs(e.clientY - touchStartY);
    
    // 条件：短時間でほとんど動かず、ズームしていない
    if (clickTime < 300 && clickMoveX < 10 && clickMoveY < 10 && !isZoomed) {
      closePhoto();
      return;
    }
    
    // ズーム中のクリックは元のサイズに戻す
    if (clickTime < 300 && clickMoveX < 10 && clickMoveY < 10 && isZoomed) {
      currentScale = 1;
      currentX = 0;
      currentY = 0;
      updateTransform();
      return;
    }
  }
  
  isDragging = false;
  updateTransform();
});

overlayImg.addEventListener('mouseleave', () => {
  isDragging = false;
});

// マウスホイールでズーム（PC用）
overlayImg.addEventListener('wheel', (e) => {
  e.preventDefault();
  
  const zoomIntensity = 0.1;
  const wheelDelta = e.deltaY > 0 ? -zoomIntensity : zoomIntensity;
  
  // マウス位置を拡大中心にする
  const rect = overlayImg.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  
  // 画像上の相対位置
  const imgX = (mouseX - currentX) / currentScale;
  const imgY = (mouseY - currentY) / currentScale;
  
  // スケールを更新
  const newScale = Math.max(0.5, Math.min(5, currentScale + wheelDelta));
  
  // 拡大中心を調整
  currentX = mouseX - imgX * newScale;
  currentY = mouseY - imgY * newScale;
  currentScale = newScale;
  
  updateTransform();
});

// 背景クリックでも閉じる
overlay.addEventListener('click', (e) => {
  if (e.target === overlay || e.target === tapToClose) {
    closePhoto();
  }
});

// ESCキーでも閉じられるように
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && overlay.style.display === 'block') {
    closePhoto();
  }
});

// スマホの回転イベントに対応
window.addEventListener('orientationchange', function() {
  setTimeout(() => {
    if (overlay.style.display === 'block') {
      adjustForMobile();
      updateTransform();
    }
  }, 300);
});

// 画像読み込み後にサイズ調整
overlayImg.addEventListener('load', function() {
  if (overlay.style.display === 'block') {
    adjustForMobile();
    updateTransform();
  }
});

/* =====================
   文字サイズ切替（保存）
===================== */
const sizeButtons = document.querySelectorAll(".font-controls button");

function applySize(size) {
  sizeButtons.forEach(b => b.classList.remove("active"));
  
  if (size === "small") {
    document.documentElement.style.setProperty("--font-base", "16px");
    document.documentElement.style.setProperty("--btn-font", "16px");
    document.documentElement.style.setProperty("--btn-padding", "8px 14px");
    document.documentElement.style.setProperty("--btn-border", "3px");
    document.documentElement.style.setProperty("--title-weight", "700");
    document.documentElement.style.setProperty("--photo-max-width", "95vw");
  } else if (size === "medium") {
    document.documentElement.style.setProperty("--font-base", "18px");
    document.documentElement.style.setProperty("--btn-font", "18px");
    document.documentElement.style.setProperty("--btn-padding", "10px 16px");
    document.documentElement.style.setProperty("--btn-border", "4px");
    document.documentElement.style.setProperty("--title-weight", "800");
    document.documentElement.style.setProperty("--photo-max-width", "90vw");
  } else if (size === "large") {
    document.documentElement.style.setProperty("--font-base", "20px");
    document.documentElement.style.setProperty("--btn-font", "20px");
    document.documentElement.style.setProperty("--btn-padding", "12px 18px");
    document.documentElement.style.setProperty("--btn-border", "5px");
    document.documentElement.style.setProperty("--title-weight", "900");
    document.documentElement.style.setProperty("--photo-max-width", "85vw");
  }
  
  localStorage.setItem("fontSize", size);
  document.querySelector(`.font-controls button[data-size="${size}"]`).classList.add("active");
}

sizeButtons.forEach(btn => {
  btn.onclick = () => {
    applySize(btn.dataset.size);
  };
});

// 保存された設定を適用（デフォルトは「大」）
const saved = localStorage.getItem("fontSize") || "large";
applySize(saved);

/* =====================
   初期読み込み
===================== */
window.addEventListener('load', function() {
  // 初期画像の存在をチェック
  const img = new Image();
  img.onload = function() {
    console.log('✅ 初期画像が正常に読み込まれました');
  };
  img.onerror = function() {
    console.error('❌ 初期画像が見つかりません');
  };
  img.src = sections.battery.img;
});
</script>
