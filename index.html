<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー作り 写真で確認シート（指導員用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =====================
   サイズ制御用変数
===================== */
:root{
  --font-base:20px;
  --btn-font:20px;
  --btn-padding:12px 18px;
  --btn-border:5px;
  --title-weight:900;
}

/* =====================
   共通
===================== */
body{
  margin:0;
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
  background:#faf7f2;
  color:#333;
  font-size:var(--font-base);
  line-height:1.7;
}

/* =====================
   ヘッダー
===================== */
header{
  position:sticky;
  top:0;
  background:#fff7dd;
  border-bottom:4px solid #e0cfa0;
  padding:8px 10px;
  z-index:100;
}

/* タイトル行 */
.header-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.title{
  font-size:1.3em;
  font-weight:var(--title-weight);
  margin:0;
  white-space:nowrap;
}

.subtitle{
  font-size:0.6em;
  font-weight:500;
  color:#555;
  margin-left:4px;
}

/* =====================
   文字サイズ切替
===================== */
.font-controls{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

.font-controls button{
  min-width:50px;
  padding:8px 12px;
  font-size:16px;
  border:2px solid #999;
  background:#fff;
  border-radius:8px;
  cursor:pointer;
}

.font-controls button.active{
  background:#333;
  color:#fff;
  border-color:#000;
}

/* =====================
   工程ナビ
===================== */
nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:8px 0 6px;
}

nav button{
  flex:1 1 auto;
  min-width:120px;
  min-height:50px;
  font-size:var(--btn-font);
  padding:var(--btn-padding);
  border:var(--btn-border) solid #a6842c;
  background:#fff;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  margin-bottom:5px;
}

nav button.active{
  background:#f0b344;
  color:#000;
  border-color:#000;
}

/* =====================
   メイン
===================== */
main{
  padding:12px;
}

.section-title{
  font-size:1.3em;
  font-weight:800;
  margin-bottom:12px;
  padding-bottom:5px;
  border-bottom:3px solid #f0b344;
}

.photo-box{
  background:#fff;
  border:4px solid #e0cfa0;
  border-radius:14px;
  padding:15px;
}

/* 写真 */
.photo-img{
  width:100%;
  max-width:640px;
  display:block;
  margin:0 auto 10px;
  border-radius:12px;
  border:4px solid #e0cfa0;
  cursor:pointer;
}

.photo-img:active{
  transform:scale(0.98);
}

/* スマホ向けヒント */
.photo-hint{
  text-align:center;
  color:#666;
  font-size:0.9em;
  margin:5px 0 15px;
  padding:8px;
  background:#f0f0f0;
  border-radius:8px;
  border-left:4px solid #f0b344;
}

/* OKメッセージ */
.ok-box{
  background:#e8f6e8;
  border:3px solid #4caf50;
  border-radius:10px;
  padding:12px;
  margin:15px 0;
  font-size:1.1em;
  font-weight:800;
  text-align:center;
}

/* 補足 */
.note{
  background:#f5efe4;
  padding:12px;
  border-radius:8px;
  font-size:1em;
  border-left:4px solid #a6842c;
}

/* =====================
   写真拡大（スマホ最適化）
===================== */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:999;
  align-items:center;
  justify-content:center;
  touch-action:none;
}

.overlay img{
  max-width:95%;
  max-height:95%;
  border-radius:12px;
  transition:transform 0.3s ease;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* 閉じるボタン */
.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  width:60px;
  height:60px;
  background:rgba(0,0,0,0.7);
  color:white;
  font-size:40px;
  line-height:60px;
  text-align:center;
  border-radius:50%;
  z-index:1000;
  cursor:pointer;
  border:3px solid white;
}

/* スマホ縦向きの場合 */
@media (max-width:768px) and (orientation:portrait){
  .overlay img{
    max-width:90vh;
    max-height:90vw;
    transform:rotate(90deg);
    transform-origin:center;
  }
  
  .rotate-hint{
    position:absolute;
    top:30px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.7);
    color:white;
    padding:12px 25px;
    border-radius:25px;
    font-size:18px;
    z-index:1000;
    animation:fadeInOut 4s ease-in-out forwards;
    text-align:center;
    line-height:1.4;
  }
  
  @keyframes fadeInOut{
    0%{ opacity:0; }
    20%{ opacity:1; }
    80%{ opacity:1; }
    100%{ opacity:0; }
  }
}

/* タブレット・PC・スマホ横向き */
@media (min-width:769px), (orientation:landscape){
  .overlay img{
    max-width:95%;
    max-height:95%;
  }
  
  .rotate-hint{
    display:none;
  }
}

/* =====================
   印刷対応
===================== */
@media print{
  header{
    display:none;
  }

  .photo-img, .photo-hint{
    display:none;
  }

  body{
    background:#fff;
    font-size:14pt;
  }

  .photo-box{
    border:none;
    padding:0;
  }
}

/* =====================
   フッター
===================== */
footer{
  text-align:center;
  padding:15px;
  font-size:0.9em;
  color:#666;
  border-top:2px solid #e0cfa0;
  margin-top:20px;
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <h1 class="title">
      リモコンカー作り 写真で確認シート
      <span class="subtitle">（指導員用）</span>
    </h1>

    <div class="font-controls">
      <button data-size="small">小</button>
      <button data-size="medium">中</button>
      <button data-size="large" class="active">大</button>
    </div>
  </div>

  <nav id="nav">
    <button data-target="battery" class="active">電池BOX完成</button>
    <button data-target="wire">電池につける電線</button>
    <button data-target="switch">前後切り替えスイッチ</button>
    <button data-target="test">モーターのテスト</button>
    <button data-target="complete">完成品</button>
  </nav>
</header>

<main>

  <div class="section-title" id="sectionTitle">
    電池BOX完成
  </div>

  <div class="photo-box">
    <img id="photo" src="images/battery_box.jpg" alt="電池BOX完成" class="photo-img">
    
    <p class="photo-hint">
      📱スマホの場合は写真をタップすると画面いっぱいに拡大表示されます
    </p>

    <div class="ok-box" id="okMessage">
      ✅ この写真と同じになっていれば OK です
    </div>

    <div class="note" id="note">
      電池の＋－向きが合っているかを確認します。
    </div>
  </div>

</main>

<footer>
  <p>このシートはリモコンカー作りの指導員用です。写真を見比べて確認しましょう。</p>
</footer>

<!-- 写真拡大 -->
<div id="overlay" class="overlay">
  <div class="close-btn" onclick="closePhoto()">×</div>
  <div class="rotate-hint">画面を横向きにしてご覧ください</div>
  <img id="overlayImg">
</div>

<script>
/* =====================
   工程データ
===================== */
const sections = {
  battery:{
    title:"電池BOX完成",
    img:"images/battery_box.jpg",
    ok:"この写真と同じになっていれば OK です",
    note:"電池の＋－向きが合っているかを確認します。"
  },
  wire:{
    title:"電池につける電線",
    img:"images/wire_magnet.jpg",
    ok:"この形になっていれば OK です",
    note:"磁石が端子にピタッと付いているか確認します。"
  },
  switch:{
    title:"前後切り替えスイッチ",
    img:"images/switch_complete.jpg",
    ok:"この配置になっていれば OK です",
    note:"左右のボタンで動きが変わることを確認します。"
  },
  test:{
    title:"モーターのテスト",
    img:"images/motor_test.jpg",
    ok:"写真のように回れば OK です",
    note:"回らない場合は接触を確認します。"
  },
  complete:{
    title:"完成品",
    img:"images/car_complete.jpg",
    ok:"この状態なら完成です",
    note:"配線がタイヤに絡んでいないか確認します。"
  }
};

/* =====================
   工程切替
===================== */
const buttons = document.querySelectorAll("nav button");
buttons.forEach(btn => {
  btn.onclick = () => {
    buttons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    const key = btn.dataset.target;
    document.getElementById("sectionTitle").textContent = sections[key].title;
    document.getElementById("photo").src = sections[key].img;
    document.getElementById("photo").alt = sections[key].title;
    document.getElementById("okMessage").innerHTML = "✅ " + sections[key].ok;
    document.getElementById("note").innerHTML = sections[key].note;
    
    // ボタンにフォーカスを当てる（スクリーンリーダー用）
    btn.focus();
  };
});

/* =====================
   写真拡大（スマホ最適化）
===================== */
const photo = document.getElementById("photo");
const overlay = document.getElementById("overlay");
const overlayImg = document.getElementById("overlayImg");
let currentScale = 1;

// 写真クリックで拡大
photo.onclick = () => {
  overlayImg.src = photo.src;
  overlay.style.display = "flex";
  
  // スクロール禁止
  document.body.style.overflow = "hidden";
  
  // スマホの場合、拡大画像をリセット
  currentScale = 1;
  updateImageTransform();
};

// 拡大画像を閉じる
function closePhoto() {
  overlay.style.display = "none";
  document.body.style.overflow = "auto";
  
  // 画像の状態をリセット
  currentScale = 1;
  updateImageTransform();
}

// オーバーレイクリックで閉じる（閉じるボタン以外の部分）
overlay.onclick = (e) => {
  if (e.target === overlay || e.target.classList.contains('rotate-hint')) {
    closePhoto();
  }
};

// 画像の変形を更新
function updateImageTransform() {
  if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) {
    // スマホ縦向き
    overlayImg.style.transform = `rotate(90deg) scale(${currentScale})`;
  } else {
    // その他（PC、タブレット、スマホ横向き）
    overlayImg.style.transform = `scale(${currentScale})`;
  }
}

// ダブルタップでズームイン/アウト
overlayImg.ondblclick = (e) => {
  e.stopPropagation();
  currentScale = currentScale === 1 ? 1.5 : 1;
  updateImageTransform();
};

// スマホの回転イベントに対応
window.addEventListener("orientationchange", function() {
  // 回転後に調整
  setTimeout(() => {
    if (overlay.style.display === "flex") {
      updateImageTransform();
    }
  }, 300);
});

// ESCキーでも閉じられるように
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && overlay.style.display === "flex") {
    closePhoto();
  }
});

/* =====================
   文字サイズ切替（保存）
===================== */
const sizeButtons = document.querySelectorAll(".font-controls button");

function applySize(size) {
  // ボタンのアクティブ状態
  sizeButtons.forEach(b => b.classList.remove("active"));
  
  // CSS変数の設定
  if (size === "small") {
    document.documentElement.style.setProperty("--font-base", "16px");
    document.documentElement.style.setProperty("--btn-font", "16px");
    document.documentElement.style.setProperty("--btn-padding", "8px 14px");
    document.documentElement.style.setProperty("--btn-border", "3px");
    document.documentElement.style.setProperty("--title-weight", "700");
  } else if (size === "medium") {
    document.documentElement.style.setProperty("--font-base", "18px");
    document.documentElement.style.setProperty("--btn-font", "18px");
    document.documentElement.style.setProperty("--btn-padding", "10px 16px");
    document.documentElement.style.setProperty("--btn-border", "4px");
    document.documentElement.style.setProperty("--title-weight", "800");
  } else if (size === "large") {
    document.documentElement.style.setProperty("--font-base", "20px");
    document.documentElement.style.setProperty("--btn-font", "20px");
    document.documentElement.style.setProperty("--btn-padding", "12px 18px");
    document.documentElement.style.setProperty("--btn-border", "5px");
    document.documentElement.style.setProperty("--title-weight", "900");
  }
  
  // 保存
  localStorage.setItem("fontSize", size);
  
  // アクティブボタンを設定
  document.querySelector(`.font-controls button[data-size="${size}"]`).classList.add("active");
}

sizeButtons.forEach(btn => {
  btn.onclick = () => {
    applySize(btn.dataset.size);
  };
});

// 保存された設定を適用（デフォルトは「大」）
const saved = localStorage.getItem("fontSize") || "large";
applySize(saved);
</script>

</body>
</html>
