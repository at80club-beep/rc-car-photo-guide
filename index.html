<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>👀みてつくるシート🚗</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --ok:#2e8b57;
  --note:#f39c12;
  --danger:#e74c3c;
  --bg:#f6f7f8;
  --card:#ffffff;
}

body{
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  background:var(--bg);
  color:#222;
}

header{
  position:sticky;
  top:0;
  background:#fff;
  z-index:10;
  border-bottom:1px solid #ddd;
}

h1{
  margin:0;
  padding:10px;
  text-align:center;
  font-size:1.3em;
}

nav{
  display:flex;
  overflow-x:auto;
  border-top:1px solid #eee;
}

nav button{
  flex:1;
  padding:10px 6px;
  font-size:0.85em;
  border:none;
  background:#fafafa;
  border-right:1px solid #eee;
  cursor:pointer;
}

nav button.active{
  background:#e3f2fd;
  font-weight:bold;
}

main{
  padding:12px;
}

.card{
  background:var(--card);
  border-radius:10px;
  padding:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.step-title{
  font-size:1.1em;
  margin-bottom:8px;
}

.photo-wrap{
  text-align:center;
}

.photo-wrap img{
  max-width:100%;
  border-radius:8px;
  cursor:pointer;
}

.ok{
  margin-top:10px;
  padding:8px;
  background:#eaf7ef;
  border-left:6px solid var(--ok);
  border-radius:6px;
  font-weight:bold;
}

.note{
  margin-top:8px;
  padding:8px;
  background:#fff7e6;
  border-left:6px solid var(--note);
  border-radius:6px;
}

.note.danger{
  background:#fdecea;
  border-left-color:var(--danger);
}

/* fullscreen image */
#overlay{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}

#overlay img{
  max-width:100%;
  max-height:100%;
}

</style>
</head>

<body>
<header>
  <h1>👀みてつくるシート🚗</h1>
  <nav id="nav"></nav>
</header>

<main>
  <div class="card">
    <div class="step-title" id="stepTitle"></div>
    <div class="photo-wrap">
      <img id="photo" src="" alt="">
    </div>
    <div class="ok" id="okText"></div>
    <div class="note" id="noteText"></div>
  </div>
</main>

<div id="overlay">
  <img id="overlayImg" src="" alt="">
</div>

<script>
const steps = [
  { nav:"① でんち", title:"① でんち（BOX）", img:"images/battery_box.jpg",
    ok:"電池の向きOK！", note:"＋と－を確認します。" },

  { nav:"② せん", title:"② でんちにつける せん", img:"images/wire_magnet.jpg",
    ok:"線がつながった！", note:"磁石がしっかり付いているか確認。外れていないか見ます。" },

  { nav:"③ スイッチ", title:"③ 前後切りかえスイッチ", img:"images/switch_complete.jpg",
    ok:"前後が切りかわる！", note:"左右SWを押して切りかわるか確認。向きを見ます。" },

  { nav:"④ まわる", title:"④ モーターは回る？", img:"images/motor_test.jpg",
    ok:"回ればOK（またはLEDでチェック）", note:"指を近づけない。回らない時は配線を見直そう。" },

  { nav:"⑤ みため", title:"⑤ みため完成（実験中）", img:"images/car_complete.jpg",
    ok:"つなぎ方をためそう！", note:"前後が逆なら入れかえてみよう。", danger:true },

  { nav:"⑥ かんせい", title:"⑥ ほんとうの完成！", img:"images/complete.jpg",
    ok:"前後に動いたら大成功！", note:"安全に走らせよう。", final:true }
];

let current = 0;

const nav = document.getElementById("nav");
const stepTitle = document.getElementById("stepTitle");
const photo = document.getElementById("photo");
const okText = document.getElementById("okText");
const noteText = document.getElementById("noteText");

steps.forEach((s,i)=>{
  const b=document.createElement("button");
  b.textContent=s.nav;
  b.onclick=()=>showStep(i);
  nav.appendChild(b);
});

function showStep(i){
  current=i;
  [...nav.children].forEach((b,idx)=>b.classList.toggle("active",idx===i));
  const s=steps[i];
  stepTitle.textContent=s.title;
  photo.src=s.img;
  okText.textContent="✔ "+s.ok;
  noteText.textContent="💡 "+s.note;
  noteText.classList.toggle("danger",!!s.danger);
}

showStep(0);

/* fullscreen */
const overlay=document.getElementById("overlay");
const overlayImg=document.getElementById("overlayImg");

photo.addEventListener("click",()=>{
  overlayImg.src=photo.src;
  overlay.style.display="flex";
  screen.orientation?.lock("landscape").catch(()=>{});
});

overlay.addEventListener("click",()=>{
  overlay.style.display="none";
  overlayImg.src="";
  screen.orientation?.unlock?.();
});
</script>
</body>
</html>
