<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー作り 写真で確認</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#fff8e1;
  --card:#ffffff;
  --line:#e0cfa0;
  --accent:#4caf50;
  --danger:#e53935;
  --text:#333;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ===== ヘッダー ===== */
header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  background:#fff3cd;
  border-bottom:4px solid #f0b64c;
  padding:12px 16px;
  font-size:22px;
  font-weight:bold;
  z-index:10;
}

main{
  padding:90px 12px 40px;
  max-width:700px;
  margin:auto;
}

/* ===== ナビ ===== */
.nav{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-bottom:12px;
}
.nav button{
  flex:0 0 auto;
  padding:8px 12px;
  border-radius:999px;
  border:2px solid var(--line);
  background:#fff;
  font-size:14px;
}
.nav button.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

/* ===== カード ===== */
.card{
  background:var(--card);
  border:4px solid var(--line);
  border-radius:20px;
  padding:14px;
}

.card.danger{
  border-color:var(--danger);
}

/* ===== タイトル ===== */
.step-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

/* ===== 写真 ===== */
.photo-wrap{
  position:relative;
}
.photo-wrap img{
  width:100%;
  border-radius:14px;
  border:3px solid #ddd;
}

/* ===== 操作説明（ここが重要） ===== */
.photo-help{
  margin-top:8px;
  padding:8px 10px;
  background:#f7f3e8;
  border-radius:10px;
  font-size:14px;
  text-align:center;
  line-height:1.4;
}

/* ===== OK / NOTE ===== */
.ok{
  margin-top:10px;
  padding:10px;
  background:#e8f5e9;
  border-radius:10px;
  font-weight:bold;
}
.note{
  margin-top:6px;
  font-size:14px;
}

/* ===== 拡大表示 ===== */
#viewer{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  z-index:999;
  touch-action:none;
}
#viewer img{
  position:absolute;
  max-width:none;
  transform-origin:center center;
}
#closeBtn{
  position:absolute;
  top:10px;
  right:10px;
  background:#fff;
  border:none;
  padding:10px 14px;
  font-size:16px;
  border-radius:999px;
}
</style>
</head>

<body>

<header>リモコンカー作り 写真で確認</header>

<main>

<div class="nav" id="nav"></div>

<div class="card" id="card">
  <div class="step-title" id="title"></div>

  <div class="photo-wrap">
    <img id="photo" src="" alt="">
  </div>

  <div class="photo-help">
    👉 写真をタップで拡大<br>
    ✌️ 2本指で拡大・縮小 ／ ✋ 1本指で動かす ／ 👆 タップで戻る
  </div>

  <div class="ok" id="ok"></div>
  <div class="note" id="note"></div>
</div>

</main>

<!-- 拡大ビュー -->
<div id="viewer">
  <button id="closeBtn">×</button>
  <img id="viewerImg">
</div>

<script>
const steps=[
 {nav:"① 電池",title:"① 電池（BOX）",img:"images/battery.jpg",ok:"電池の向きOK！",note:"＋と－を確認します。"},
 {nav:"② 電池の線",title:"② 電池の線",img:"images/battery_wire.jpg",ok:"線がつながった！",note:"外れていないか見ます。"},
 {nav:"③ スイッチ",title:"③ スイッチ",img:"images/switch.jpg",ok:"前後が切り替わる！",note:"向きを確認します。"},
 {nav:"④ 回る？",title:"④ モーターは回る？",img:"images/motor.jpg",ok:"モーターOK！",note:"指を近づけないよう注意。"},
 {nav:"⑤ 見た目完成",title:"⑤ 見た目完成（実験中）",img:"images/wire_test.jpg",ok:"つなぎ方をためそう！",note:"前後が逆なら入れ替えてみよう。",danger:true},
 {nav:"⑥ ほんとうの完成",title:"⑥ ほんとうの完成！",img:"images/complete.jpg",ok:"前後に動いたら大成功！",note:"安全に走らせよう。"}
];

const nav=document.getElementById("nav");
const card=document.getElementById("card");
const title=document.getElementById("title");
const photo=document.getElementById("photo");
const ok=document.getElementById("ok");
const note=document.getElementById("note");

let current=0;

steps.forEach((s,i)=>{
  const b=document.createElement("button");
  b.textContent=s.nav;
  b.onclick=()=>show(i);
  nav.appendChild(b);
});

function show(i){
  current=i;
  [...nav.children].forEach((b,j)=>b.classList.toggle("active",i===j));
  const s=steps[i];
  title.textContent=s.title;
  photo.src=s.img;
  ok.textContent=s.ok;
  note.textContent=s.note;
  card.classList.toggle("danger",!!s.danger);
}
show(0);

/* ===== 拡大操作 ===== */
const viewer=document.getElementById("viewer");
const viewerImg=document.getElementById("viewerImg");
let scale=1,dx=0,dy=0,startDist=0;

photo.onclick=()=>{
  viewer.style.display="block";
  viewerImg.src=photo.src;
  scale=1;dx=0;dy=0;
  update();
};

document.getElementById("closeBtn").onclick=()=>viewer.style.display="none";
viewer.onclick=e=>{ if(e.target===viewer) viewer.style.display="none"; };

viewer.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    startDist=Math.hypot(
      e.touches[0].pageX-e.touches[1].pageX,
      e.touches[0].pageY-e.touches[1].pageY
    );
  }
});

viewer.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(e.touches.length===1){
    dx+=e.touches[0].movementX||0;
    dy+=e.touches[0].movementY||0;
  }
  if(e.touches.length===2){
    const d=Math.hypot(
      e.touches[0].pageX-e.touches[1].pageX,
      e.touches[0].pageY-e.touches[1].pageY
    );
    scale*=d/startDist;
    startDist=d;
  }
  update();
},{passive:false});

function update(){
  viewerImg.style.transform=`translate(${dx}px,${dy}px) scale(${scale})`;
  viewerImg.style.left="50%";
  viewerImg.style.top="50%";
  viewerImg.style.transform+= " translate(-50%,-50%)";
}
</script>

</body>
</html>
