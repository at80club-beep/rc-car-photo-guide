<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー 写真参照ガイド（指導員用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --font-base: 18px;
  --nav-font: 18px;
  --btn-pad: 10px;
  --btn-border: 3px;
  --header-h: 140px;
}

/* ===== 基本 ===== */
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: var(--font-base);
  line-height: 1.7;
  background: #faf7f2;
  color: #333;
}

/* ===== ヘッダー ===== */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff7dd;
  border-bottom: 4px solid #e0cfa0;
  padding: 10px;
}

h1 {
  margin: 0 0 8px;
  font-size: 24px;
}

/* ===== 文字サイズボタン ===== */
.font-controls {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

.font-btn {
  padding: 6px 12px;
  border-radius: 999px;
  border: 2px solid #999;
  background: #fff;
  cursor: pointer;
  font-weight: bold;
}

.font-btn.active {
  background: #333;
  color: #fff;
}

/* ===== ナビ（縦1列） ===== */
nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

nav a {
  text-decoration: none;
  font-size: var(--nav-font);
  padding: var(--btn-pad);
  border: var(--btn-border) solid #333;
  border-radius: 10px;
  background: #fff;
  color: #000;
  font-weight: bold;
}

nav a.active {
  background: #333;
  color: #fff;
}

/* ===== メイン ===== */
main {
  padding: 12px;
}

section {
  background: #fff;
  border: 2px solid #e0d7c2;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 16px;
  scroll-margin-top: var(--header-h);
}

h2 {
  margin-top: 0;
  font-size: 22px;
}

/* ===== 写真枠 ===== */
.photo {
  border: 3px solid #f0b344;
  padding: 10px;
  margin: 10px 0;
  font-weight: bold;
  font-size: 20px;
}

/* ===== 指導ポイント ===== */
.note {
  background: #f5efe4;
  padding: 10px;
  border-left: 6px solid #999;
}
</style>
</head>

<body>

<header id="header">
  <h1>リモコンカー 写真参照ガイド（指導員用）</h1>

  <div class="font-controls">
    <button class="font-btn" onclick="setFont('small')">小</button>
    <button class="font-btn active" onclick="setFont('medium')">中</button>
    <button class="font-btn" onclick="setFont('large')">大</button>
  </div>

  <nav>
    <a href="#battery">📦 電池BOX</a>
    <a href="#wire">🔌 電線</a>
    <a href="#switch">🎮 スイッチ</a>
    <a href="#test">🔬 テスト</a>
    <a href="#complete">🏆 完成</a>
  </nav>
</header>

<main>

<section id="battery">
  <h2>📦 電池BOX</h2>
  <div class="photo">写真 P25</div>
  <div class="note">
    ・＋－の向き確認<br>
    ・銅テープを押す
  </div>
</section>

<section id="wire">
  <h2>🔌 電線</h2>
  <div class="photo">写真 P30</div>
  <div class="note">
    ・磁石は直接<br>
    ・外れていない？
  </div>
</section>

<section id="switch">
  <h2>🎮 スイッチ</h2>
  <div class="photo">写真 P62 / P72</div>
  <div class="note">
    ・押すとどこがつながる？
  </div>
</section>

<section id="test">
  <h2>🔬 テスト</h2>
  <div class="photo">写真 P81</div>
  <div class="note">
    ・回転方向を確認
  </div>
</section>

<section id="complete">
  <h2>🏆 完成</h2>
  <div class="photo">写真 P50</div>
</section>

</main>

<script>
const root = document.documentElement;
const buttons = document.querySelectorAll(".font-btn");

function setFont(mode) {
  buttons.forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");

  if (mode === "small") {
    root.style.setProperty("--font-base", "15px");
    root.style.setProperty("--nav-font", "16px");
    root.style.setProperty("--btn-pad", "6px");
    root.style.setProperty("--btn-border", "2px");
  }

  if (mode === "medium") {
    root.style.setProperty("--font-base", "18px");
    root.style.setProperty("--nav-font", "18px");
    root.style.setProperty("--btn-pad", "10px");
    root.style.setProperty("--btn-border", "3px");
  }

  if (mode === "large") {
    root.style.setProperty("--font-base", "22px");
    root.style.setProperty("--nav-font", "22px");
    root.style.setProperty("--btn-pad", "14px");
    root.style.setProperty("--btn-border", "5px");
  }

  localStorage.setItem("fontMode", mode);
}

/* 初期化 */
window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("fontMode") || "medium";
  document.querySelector(`.font-btn:nth-child(${saved==="small"?1:saved==="medium"?2:3})`).click();

  const header = document.getElementById("header");
  root.style.setProperty("--header-h", header.offsetHeight + "px");
});
</script>

</body>
</html>
