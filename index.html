<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>👀みてつくるシート🚗</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* ===== 基本設定 ===== */
*{ box-sizing:border-box; }
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  background:#f6f8fb;
  color:#222;
  font-size:18px;
}

/* ===== ヘッダー ===== */
header{
  position:sticky;
  top:0;
  background:#fff;
  z-index:10;
  border-bottom:1px solid #ddd;
}
header h1{
  margin:0;
  padding:12px;
  text-align:center;
  font-size:1.4em;
}

/* ===== ナビ ===== */
.nav{
  display:flex;
  gap:8px;
  padding:8px;
  overflow-x:auto;
}
.nav button{
  border:none;
  border-radius:999px;
  padding:10px 14px;
  font-size:0.9em;
  background:#e5edff;
  color:#003a8f;
  white-space:nowrap;
  cursor:pointer;
}
.nav button.active{
  background:#2b6cff;
  color:#fff;
  font-weight:bold;
}

/* ===== メイン ===== */
main{
  padding:12px;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}
.step-title{
  font-size:1.3em;
  font-weight:bold;
  margin-bottom:10px;
}

/* ===== 画像 ===== */
.photo{
  text-align:center;
  margin:10px 0;
}
.photo img{
  max-width:100%;
  border-radius:12px;
  cursor:pointer;
}
.photo .tap-label{
  margin-top:6px;
  font-size:0.85em;
  color:#555;
}

/* ===== メッセージ ===== */
.box{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
}
.box.ok{
  background:#e7f6ec;
  color:#0a6b2f;
}
.box.note{
  background:#fdecec;
  color:#9a1b1b;
}
.box.final{
  background:#fff1db;
  color:#a14f00;
  font-weight:bold;
}

/* ===== オーバーレイ ===== */
.overlay{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}
.overlay img{
  max-width:100vh;
  max-height:100vw;
  transform:rotate(90deg);
}
body.no-scroll{
  overflow:hidden;
}
</style>
</head>

<body>

<header>
  <h1>👀みてつくるシート🚗</h1>
  <div class="nav" id="nav"></div>
</header>

<main>
  <div class="card">
    <div class="step-title" id="stepTitle"></div>

    <div class="photo">
      <img id="stepImg" src="" alt="">
      <div class="tap-label">👆 タップで大きく見る</div>
    </div>

    <div class="box ok" id="okBox"></div>
    <div class="box note" id="noteBox"></div>
  </div>
</main>

<div class="overlay" id="overlay">
  <img id="overlayImg" src="">
</div>

<script>
const steps = [
  { nav:"① でんち", title:"① でんち（BOX）", img:"images/battery_box.jpg",
    ok:"電池の向きOK！", note:"＋と－を確認します。" },

  { nav:"② せん", title:"② 電池につける電線", img:"images/wire_magnet.jpg",
    ok:"線がつながった！", note:"磁石がしっかり付いているか確認。外れていないか見ます。" },

  { nav:"③ スイッチ", title:"③ 前後切り替えスイッチ", img:"images/switch_complete.jpg",
    ok:"前後が切り替わる！", note:"左右SWを押して切り替わるか確認。向きを確認します。" },

  { nav:"④ まわる", title:"④ モーターは回る？", img:"images/motor_test.jpg",
    ok:"回れば OK（又は、LEDチェッカーで調べる）", note:"指を近づけないよう注意。回らない（つかない）場合は配線を確認。" },

  { nav:"⑤ みため", title:"⑤ 見た目完成（実験中）", img:"images/car_complete.jpg",
    ok:"つなぎ方をためそう！", note:"前後が逆なら入れ替えてみよう。", danger:true },

  { nav:"⑥ かんせい", title:"⑥ ほんとうの完成！", img:"images/complete.jpg",
    ok:"前後に動いたら大成功！", note:"安全に走らせよう。", final:true }
];

const nav = document.getElementById("nav");
const stepTitle = document.getElementById("stepTitle");
const stepImg = document.getElementById("stepImg");
const okBox = document.getElementById("okBox");
const noteBox = document.getElementById("noteBox");

const overlay = document.getElementById("overlay");
const overlayImg = document.getElementById("overlayImg");

let current = 0;

/* ナビ生成 */
steps.forEach((s,i)=>{
  const btn = document.createElement("button");
  btn.textContent = s.nav;
  btn.addEventListener("click",()=>showStep(i));
  nav.appendChild(btn);
});

/* 工程表示 */
function showStep(i){
  current = i;
  [...nav.children].forEach((b,idx)=>b.classList.toggle("active",idx===i));

  const s = steps[i];
  stepTitle.textContent = s.title;
  stepImg.src = s.img;
  okBox.textContent = "✔ " + s.ok;
  noteBox.textContent = "⚠ " + s.note;

  noteBox.className = "box note";
  if(s.final){
    noteBox.classList.add("final");
  }
  window.scrollTo({ top:0 });
}

/* 拡大表示 */
stepImg.addEventListener("click",()=>{
  overlayImg.src = stepImg.src;
  overlay.style.display = "flex";
  document.body.classList.add("no-scroll");
});

/* 閉じる */
overlay.addEventListener("click",()=>{
  overlay.style.display = "none";
  document.body.classList.remove("no-scroll");
  window.scrollTo({ top:0 });
});

/* 初期表示 */
showStep(0);
</script>

</body>
</html>
