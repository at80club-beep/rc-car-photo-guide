<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リモコンカー作り 写真で確認シート</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f6f7fb;
      color: #222;
    }
    header {
      padding: 12px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav {
      display: flex;
      overflow-x: auto;
      padding: 8px;
      gap: 6px;
      scrollbar-width: none;
    }
    .nav::-webkit-scrollbar {
      display: none;
    }
    .nav button {
      flex: 1;
      font-weight: bold;
      font-size: 0.85rem;
      padding: 6px 4px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .nav button.active {
      background: #3a7bd5;
      color: #fff;
      border-color: #3a7bd5;
    }
    .card {
      background: #fff;
      margin: 12px;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 1.1rem;
    }
    .card p {
      margin: 4px 0;
      font-size: 0.85rem;
      color: #555;
    }
    .img-box {
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
    }
    .img-box img {
      width: 100%;
      display: block;
    }
    .ok {
      background: #e6f8ea;
      border: 1px solid #30a14e;
      color: #187338;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }
    .note {
      background: #fff8e6;
      border: 1px solid #ffb74d;
      color: #8a5b00;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .danger {
      background: #ffe9e9;
      border-color: #f44336;
      color: #b02121;
    }
    .final {
      background: #e9f7ff;
      border-color: #2196f3;
      color: #0b558f;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .overlay.visible {
      display: flex;
    }
    .overlay img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    @media (max-width: 799px) {
      .overlay img {
        transform: rotate(90deg);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>リモコンカー作り 写真で確認シート</h1>
  </header>
  <div class="nav" id="nav"></div>
  <div class="card" id="card">
    <h2 id="title"></h2>
    <p id="subtitle"></p>
    <div class="img-box" id="imgBox">
      <img id="mainImg" src="" alt="">
    </div>
    <div class="ok" id="okText"></div>
    <div class="note" id="noteText"></div>
  </div>
  <div class="overlay" id="overlay">
    <img id="overlayImg" src="" alt="">
  </div>

  <script>
    const steps = [
      { nav:"① 電池", title:"① 電池（BOX）", img:"images/battery_box.jpg", ok:"電池の向きOK！", note:"＋と－を確認します。" },
      { nav:"② 電池の線", title:"② 電池につける電線", img:"images/wire_magnet.jpg", ok:"線がつながった！", note:"磁石がしっかり付いているか確認。外れていないか見ます。" },
      { nav:"③ スイッチ", title:"③ 前後切り替えスイッチ", img:"images/switch_complete.jpg", ok:"前後が切り替わる！", note:"左右SWを押して切り替わるか確認。向きを確認します。" },
      { nav:"④ 回る？", title:"④ モーターは回る？", img:"images/motor_test.jpg", ok:"回れば OK（又は、LEDチェッカーで調べる）", note:"指を近づけないよう注意。回らない（つかない）場合は配線を確認。" },
      { nav:"⑤ 見た目完成", title:"⑤ 見た目完成（実験中）", img:"images/car_complete.jpg", ok:"つなぎ方をためそう！", note:"前後が逆なら入れ替えてみよう。", danger:true },
      { nav:"⑥ ほんとうの完成", title:"⑥ ほんとうの完成！", img:"images/complete.jpg", ok:"前後に動いたら大成功！", note:"安全に走らせよう。", final:true }
    ];

    const nav = document.getElementById('nav');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const mainImg = document.getElementById('mainImg');
    const okText = document.getElementById('okText');
    const noteText = document.getElementById('noteText');
    const imgBox = document.getElementById('imgBox');
    const overlay = document.getElementById('overlay');
    const overlayImg = document.getElementById('overlayImg');

    let current = 0;

    steps.forEach((step, i) => {
      const btn = document.createElement('button');
      btn.textContent = step.nav;
      btn.onclick = () => showStep(i);
      nav.appendChild(btn);
    });

    function showStep(i) {
      current = i;
      const step = steps[i];
      title.textContent = step.title;
      subtitle.textContent = `工程 ${i + 1} / ${steps.length}`;
      mainImg.src = step.img;
      overlayImg.src = step.img;
      okText.textContent = step.ok;
      noteText.textContent = step.note;
      noteText.className = 'note';
      if (step.danger) noteText.classList.add('danger');
      if (step.final) noteText.classList.add('final');
      [...nav.children].forEach((btn, idx) => {
        btn.classList.toggle('active', idx === i);
      });
    }

    imgBox.onclick = () => {
      overlay.classList.add('visible');
    };
    overlay.onclick = () => {
      overlay.classList.remove('visible');
    };

    showStep(0);
  </script>
</body>
</html>
