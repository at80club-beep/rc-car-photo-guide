<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー作り 写真で確認シート（指導員用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">


<style>
body{
  margin:0;
  font-family:"Hiragino Sans","メイリオ",sans-serif;
  background:#faf7f2;
  color:#333;
}


header{
  position:sticky;
  top:0;
  background:#fff7dd;
  border-bottom:4px solid #e0cfa0;
  padding:10px;
  z-index:100;
}


.title{
  font-size:1.3em;
  font-weight:900;
  margin:0;
}


.subtitle{
  font-size:0.6em;
  color:#555;
}


nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
}


nav button{
  flex:1;
  min-height:48px;
  font-size:18px;
  font-weight:700;
  border:4px solid #a6842c;
  background:#fff;
  border-radius:12px;
}


nav button.active{
  background:#f0b344;
  border-color:#000;
}


main{
  padding:12px;
}


.section-title{
  font-size:1.3em;
  font-weight:800;
  border-bottom:3px solid #f0b344;
  margin-bottom:12px;
}


.photo-box{
  background:#fff;
  border:4px solid #e0cfa0;
  border-radius:14px;
  padding:14px;
}


.photo-img{
  width:100%;
  max-width:640px;
  display:block;
  margin:0 auto 10px;
  border-radius:12px;
  border:4px solid #e0cfa0;
  cursor:pointer;
}


.photo-hint{
  text-align:center;
  font-size:0.9em;
  color:#666;
  background:#f0f0f0;
  padding:8px;
  border-radius:8px;
}


.ok-box{
  background:#e8f6e8;
  border:3px solid #4caf50;
  border-radius:10px;
  padding:12px;
  margin:12px 0;
  font-weight:800;
  text-align:center;
}


.note{
  background:#f5efe4;
  padding:12px;
  border-radius:8px;
  border-left:4px solid #a6842c;
}


/* ===== 拡大表示（横向き固定） ===== */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  z-index:999;
  align-items:center;
  justify-content:center;
  touch-action:none;
}


.overlay img{
  max-height:90vw;
  max-width:90vh;
  transform:rotate(90deg);
  border-radius:12px;
}


.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  width:56px;
  height:56px;
  background:#000;
  color:#fff;
  font-size:36px;
  text-align:center;
  line-height:56px;
  border-radius:50%;
  border:3px solid #fff;
}


.swipe-hint{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  background:rgba(0,0,0,0.7);
  padding:8px 20px;
  border-radius:20px;
  font-size:14px;
}


/* 横向きでは回転解除 */
@media (orientation:landscape){
  .overlay img{
    transform:none;
    max-width:95%;
    max-height:95%;
  }
}
</style>
</head>


<body>


<header>
  <h1 class="title">
    リモコンカー作り 写真で確認シート
    <span class="subtitle">（指導員用）</span>
  </h1>


  <nav id="nav">
    <button data-target="battery" class="active">電池BOX</button>
    <button data-target="wire">電線</button>
    <button data-target="switch">スイッチ</button>
    <button data-target="test">テスト</button>
    <button data-target="complete">完成</button>
  </nav>
</header>


<main>
  <div class="section-title" id="sectionTitle">電池BOX完成</div>


  <div class="photo-box">
    <img id="photo" src="images/battery_box.jpg" class="photo-img">
    <div class="photo-hint">📱 タップで拡大／スワイプで切り替え</div>
    <div class="ok-box" id="okMessage">✅ この写真と同じなら OK</div>
    <div class="note" id="note">電池の＋－向きを確認します。</div>
  </div>
</main>


<!-- 拡大表示 -->
<div id="overlay" class="overlay">
  <div class="close-btn" onclick="closePhoto()">×</div>
  <div class="swipe-hint">← → スワイプで写真切り替え</div>
  <img id="overlayImg">
</div>


<script>
/* ===== 工程データ ===== */
const order=["battery","wire","switch","test","complete"];


const sections={
  battery:{title:"電池BOX完成",img:"images/battery_box.jpg",ok:"この写真と同じなら OK",note:"電池の＋－向きを確認します。"},
  wire:{title:"電池につける電線",img:"images/wire_magnet.jpg",ok:"この形なら OK",note:"磁石が端子に付いているか確認。"},
  switch:{title:"前後切り替えスイッチ",img:"images/switch_complete.jpg",ok:"固定できていれば OK",note:"左右に倒して切り替え確認。"},
  test:{title:"モーターのテスト",img:"images/motor_test.jpg",ok:"回れば OK",note:"回らない場合は配線確認。"},
  complete:{title:"完成品",img:"images/car_complete.jpg",ok:"完成です！",note:"安全に走らせましょう。"}
};


let currentIndex=0;


const photo=document.getElementById("photo");
const overlay=document.getElementById("overlay");
const overlayImg=document.getElementById("overlayImg");
const sectionTitle=document.getElementById("sectionTitle");
const okMessage=document.getElementById("okMessage");
const note=document.getElementById("note");
const navButtons=document.querySelectorAll("#nav button");


function showSection(index){
  currentIndex=index;
  const key=order[index];
  const d=sections[key];
  sectionTitle.textContent=d.title;
  photo.src=d.img;
  overlayImg.src=d.img;
  okMessage.textContent="✅ "+d.ok;
  note.textContent=d.note;


  navButtons.forEach(b=>b.classList.remove("active"));
  navButtons[index].classList.add("active");
}


navButtons.forEach((btn,i)=>{
  btn.onclick=()=>showSection(i);
});


photo.onclick=()=>{
  overlay.style.display="flex";
  overlayImg.src=photo.src;
};


function closePhoto(){
  overlay.style.display="none";
}


/* ===== スワイプ処理 ===== */
let startX=0;


overlay.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
});


overlay.addEventListener("touchend",e=>{
  const diffX=e.changedTouches[0].clientX-startX;
  if(Math.abs(diffX)>50){
    if(diffX<0 && currentIndex<order.length-1){
      showSection(currentIndex+1);
    }
    if(diffX>0 && currentIndex>0){
      showSection(currentIndex-1);
    }
  }
});
</script>


</body>
</html>
