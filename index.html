<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>リモコンカー作り 確認シート</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', 'Hiragino Kaku Gothic ProN', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            padding-bottom: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        header {
            text-align: center;
            padding: 20px 0 15px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            margin-bottom: 20px;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .nav-btn {
            padding: 10px 15px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: calc(33% - 8px);
            text-align: center;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .nav-btn.active {
            background-color: #007bff;
            font-weight: bold;
        }

        .step-container {
            background-color: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: none;
        }

        .step-container.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-title {
            font-size: 1.6rem;
            color: #007bff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #e9ecef;
            text-align: center;
        }

        .step-image-container {
            margin-bottom: 25px;
            text-align: center;
        }

        .step-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .step-image:hover {
            transform: scale(1.02);
        }

        .check-point {
            background-color: #e8f5e9;
            border-left: 5px solid #4caf50;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
        }

        .check-title {
            color: #2e7d32;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .check-title::before {
            content: "✓";
            background-color: #4caf50;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .hint-point {
            background-color: #fff3e0;
            border-left: 5px solid #ff9800;
            padding: 15px;
            border-radius: 0 8px 8px 0;
        }

        .hint-title {
            color: #ef6c00;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hint-title::before {
            content: "!";
            background-color: #ff9800;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .danger {
            background-color: #ffebee;
            border-left: 5px solid #f44336;
        }

        .danger .hint-title {
            color: #c62828;
        }

        .danger .hint-title::before {
            background-color: #f44336;
            content: "⚠";
        }

        .final-step {
            border: 3px solid #4caf50;
            position: relative;
            overflow: hidden;
        }

        .final-step::before {
            content: "🎉 完成！";
            position: absolute;
            top: 15px;
            right: -35px;
            background-color: #4caf50;
            color: white;
            padding: 5px 40px;
            transform: rotate(45deg);
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* 拡大表示用スタイル */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .overlay.active {
            display: flex;
        }

        .overlay-image {
            max-width: 90%;
            max-height: 70%;
            object-fit: contain;
            border-radius: 5px;
            transform: rotate(0deg);
            transition: transform 0.5s ease;
        }

        .overlay.active .overlay-image {
            transform: rotate(90deg);
        }

        .overlay-title {
            color: white;
            font-size: 1.3rem;
            margin-top: 20px;
            text-align: center;
            padding: 0 20px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.1);
        }

        .instruction {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
        }

        @media (max-width: 768px) {
            .nav-btn {
                min-width: calc(50% - 8px);
                font-size: 0.9rem;
                padding: 10px 12px;
            }
            
            .step-title {
                font-size: 1.4rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .nav-btn {
                min-width: 100%;
            }
            
            .step-container {
                padding: 20px 15px;
            }
            
            .step-title {
                font-size: 1.3rem;
            }
            
            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👀みてつくるシート🚗</h1>
            <div class="subtitle">リモコンカー工作 写真で確認</div>
        </header>

        <div class="nav-buttons" id="navButtons">
            <!-- ナビゲーションボタンはJSで生成 -->
        </div>

        <div id="stepsContainer">
            <!-- ステップコンテンツはJSで生成 -->
        </div>

        <div class="instruction">
            写真をタップすると拡大表示します<br>
            拡大中はスマホを横に回転させて見てください
        </div>
    </div>

    <!-- 画像拡大表示用オーバーレイ -->
    <div class="overlay" id="imageOverlay">
        <div class="close-btn" id="closeBtn">×</div>
        <img class="overlay-image" id="overlayImage" src="" alt="拡大画像">
        <div class="overlay-title" id="overlayTitle"></div>
    </div>

    <script>
        // 工程データ
        const steps = [
            { 
                nav: "① でんち", 
                title: "① でんち（電池ボックス）", 
                img: "images/battery_box.jpg",
                ok: "電池の向きOK！", 
                note: "＋と－のマークを確認します。電池の平らな方が－、出っ張りが＋です。"
            },
            { 
                nav: "② せん", 
                title: "② 電池につける電線", 
                img: "images/wire_magnet.jpg",
                ok: "線がしっかりつながった！", 
                note: "磁石がしっかり付いているか確認。外れていないか見ます。線の色も確認しよう（赤が＋、黒が－）。"
            },
            { 
                nav: "③ スイッチ", 
                title: "③ 前後切り替えスイッチ", 
                img: "images/switch_complete.jpg",
                ok: "前後が切り替わる！", 
                note: "左右のスイッチを押して切り替わるか確認。向きを確認します。スイッチの真ん中で止まるように。"
            },
            { 
                nav: "④ まわる", 
                title: "④ モーターは回る？", 
                img: "images/motor_test.jpg",
                ok: "回れば OK（LEDチェッカーでも調べられる）", 
                note: "指を近づけないよう注意。回らない（つかない）場合は配線を確認。電池の向きや線のつなぎ方を再確認。"
            },
            { 
                nav: "⑤ みため", 
                title: "⑤ 見た目完成（実験中）", 
                img: "images/car_complete.jpg",
                ok: "つなぎ方をためそう！", 
                note: "前後が逆なら線を入れ替えてみよう。車体のバランスも確認。",
                danger: true
            },
            { 
                nav: "⑥ かんせい", 
                title: "⑥ ほんとうの完成！", 
                img: "images/complete.jpg",
                ok: "前後に動いたら大成功！", 
                note: "安全に走らせよう。人や物にぶつからない広い場所で試そう。",
                final: true
            }
        ];

        // DOM要素の取得
        const navButtonsContainer = document.getElementById('navButtons');
        const stepsContainer = document.getElementById('stepsContainer');
        const imageOverlay = document.getElementById('imageOverlay');
        const overlayImage = document.getElementById('overlayImage');
        const overlayTitle = document.getElementById('overlayTitle');
        const closeBtn = document.getElementById('closeBtn');

        // 現在のステップを追跡
        let currentStep = 0;

        // ナビゲーションボタンを生成
        function createNavButtons() {
            steps.forEach((step, index) => {
                const button = document.createElement('button');
                button.className = `nav-btn ${index === 0 ? 'active' : ''}`;
                button.textContent = step.nav;
                button.dataset.index = index;
                
                button.addEventListener('click', () => {
                    // アクティブなボタンの更新
                    document.querySelectorAll('.nav-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    button.classList.add('active');
                    
                    // ステップコンテンツの表示切り替え
                    showStep(index);
                });
                
                navButtonsContainer.appendChild(button);
            });
        }

        // ステップコンテンツを生成
        function createStepContainers() {
            steps.forEach((step, index) => {
                const stepDiv = document.createElement('div');
                stepDiv.className = `step-container ${index === 0 ? 'active' : ''}`;
                stepDiv.id = `step-${index}`;
                
                // 最終ステップの場合、特別なクラスを追加
                if (step.final) {
                    stepDiv.classList.add('final-step');
                }
                
                // タイトル
                const title = document.createElement('h2');
                title.className = 'step-title';
                title.textContent = step.title;
                
                // 画像コンテナ
                const imageContainer = document.createElement('div');
                imageContainer.className = 'step-image-container';
                
                const image = document.createElement('img');
                image.className = 'step-image';
                image.src = step.img;
                image.alt = step.title;
                image.dataset.index = index;
                
                // 画像タップで拡大表示
                image.addEventListener('click', () => {
                    showOverlay(index);
                });
                
                imageContainer.appendChild(image);
                
                // OKポイント
                const okDiv = document.createElement('div');
                okDiv.className = 'check-point';
                
                const okTitle = document.createElement('div');
                okTitle.className = 'check-title';
                okTitle.textContent = 'できているポイント';
                
                const okContent = document.createElement('div');
                okContent.textContent = step.ok;
                
                okDiv.appendChild(okTitle);
                okDiv.appendChild(okContent);
                
                // 注意・ヒントポイント
                const noteDiv = document.createElement('div');
                noteDiv.className = `hint-point ${step.danger ? 'danger' : ''}`;
                
                const noteTitle = document.createElement('div');
                noteTitle.className = 'hint-title';
                noteTitle.textContent = 'ちゅうい・ヒント';
                
                const noteContent = document.createElement('div');
                noteContent.textContent = step.note;
                
                noteDiv.appendChild(noteTitle);
                noteDiv.appendChild(noteContent);
                
                // すべての要素をステップコンテナに追加
                stepDiv.appendChild(title);
                stepDiv.appendChild(imageContainer);
                stepDiv.appendChild(okDiv);
                stepDiv.appendChild(noteDiv);
                
                stepsContainer.appendChild(stepDiv);
            });
        }

        // 指定したステップを表示
        function showStep(index) {
            // 現在のステップを非表示
            document.querySelectorAll('.step-container').forEach(container => {
                container.classList.remove('active');
            });
            
            // 新しいステップを表示
            const targetStep = document.getElementById(`step-${index}`);
            if (targetStep) {
                targetStep.classList.add('active');
                currentStep = index;
                
                // ページの先頭にスクロール
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // 画像オーバーレイを表示
        function showOverlay(stepIndex) {
            const step = steps[stepIndex];
            overlayImage.src = step.img;
            overlayTitle.textContent = step.title;
            imageOverlay.classList.add('active');
            
            // オーバーレイを縦向きでも横向き表示にする
            document.body.style.overflow = 'hidden';
        }

        // 画像オーバーレイを非表示
        function hideOverlay() {
            imageOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
            
            // 少し遅延させてから画像ソースをリセット（ちらつき防止）
            setTimeout(() => {
                overlayImage.src = '';
                overlayTitle.textContent = '';
            }, 300);
        }

        // イベントリスナーの設定
        closeBtn.addEventListener('click', hideOverlay);
        
        // オーバーレイの背景をクリックしても閉じる
        imageOverlay.addEventListener('click', (e) => {
            if (e.target === imageOverlay) {
                hideOverlay();
            }
        });
        
        // ESCキーでオーバーレイを閉じる
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && imageOverlay.classList.contains('active')) {
                hideOverlay();
            }
        });

        // 初期化
        function init() {
            createNavButtons();
            createStepContainers();
        }

        // ページ読み込み時に初期化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
