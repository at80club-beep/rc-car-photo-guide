<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー作り 写真で確認</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =====================
   全体基本
===================== */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  background: #fff7df;
  color: #333;
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff3cf;
  border-bottom: 4px solid #f0b040;
  padding: 14px 16px;
}

header h1 {
  margin: 0;
  font-size: 1.6rem;
}

/* =====================
   ナビ
===================== */
nav {
  display: flex;
  overflow-x: auto;
  gap: 8px;
  padding: 10px;
  background: #fff;
}

nav button {
  flex: 0 0 auto;
  padding: 10px 14px;
  font-size: 1rem;
  border-radius: 12px;
  border: 2px solid #ccc;
  background: #fafafa;
  cursor: pointer;
}

nav button.active {
  background: #c9f2c9;
  border-color: #4caf50;
  font-weight: bold;
}

nav button.danger {
  background: #ffecec;
  border-color: #e53935;
}

/* =====================
   メイン
===================== */
main {
  padding: 14px;
}

.step-title {
  font-size: 1.4rem;
  font-weight: bold;
  margin-bottom: 10px;
}

.photo-box {
  border-radius: 18px;
  border: 4px solid #e0d2a6;
  background: #fff;
  padding: 12px;
}

.photo-box.danger {
  border-color: #e53935;
}

.photo-box img {
  width: 100%;
  border-radius: 12px;
  cursor: zoom-in;
}

.hint {
  margin-top: 10px;
  font-size: 0.95rem;
  text-align: center;
  color: #555;
}

/* =====================
   OK / NOTE
===================== */
.ok {
  margin-top: 12px;
  padding: 10px;
  border-radius: 12px;
  background: #e8f8e8;
  border: 2px solid #4caf50;
  font-weight: bold;
}

.note {
  margin-top: 8px;
  padding: 10px;
  border-radius: 12px;
  background: #fff6dc;
  border: 2px dashed #f0b040;
}

/* =====================
   全画面拡大
===================== */
#viewer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  z-index: 999;
  touch-action: none;
}

#viewer.show {
  display: block;
}

#viewer img {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1);
  max-width: none;
  max-height: none;
  width: auto;
  height: auto;
}

#closeBtn {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 1.2rem;
  padding: 8px 14px;
  border-radius: 999px;
  border: none;
  background: #fff;
  cursor: pointer;
}

/* =====================
   スマホ最適化
===================== */
@media (min-width: 768px) {
  main {
    max-width: 640px;
    margin: auto;
  }
}
</style>
</head>

<body>

<header>
  <h1>リモコンカー作り 写真で確認</h1>
</header>

<nav id="nav"></nav>

<main>
  <div id="stepTitle" class="step-title"></div>

  <div id="photoBox" class="photo-box">
    <img id="photo" src="" alt="">
    <div class="hint">
      👉 写真タップで拡大 ／ ✌ 2本指で拡大縮小 ／ ✋ 動かす
    </div>
  </div>

  <div id="ok" class="ok"></div>
  <div id="note" class="note"></div>
</main>

<!-- 全画面ビュー -->
<div id="viewer">
  <button id="closeBtn">✕ 戻る</button>
  <img id="viewerImg" src="">
</div>

<script>
const steps = [
  { nav:"① 電池", title:"① 電池（BOX）", img:"images/battery.jpg",
    ok:"電池の向きOK！", note:"＋と－を確認します。" },

  { nav:"② 電池の線", title:"② 電池の線", img:"images/battery_wire.jpg",
    ok:"線がつながった！", note:"外れていないか見ます。" },

  { nav:"③ スイッチ", title:"③ スイッチ", img:"images/switch.jpg",
    ok:"前後が切り替わる！", note:"向きを確認します。" },

  { nav:"④ 回る？", title:"④ モーターは回る？", img:"images/motor.jpg",
    ok:"モーターOK！", note:"指を近づけないよう注意。" },

  { nav:"⑤ 見た目完成", title:"⑤ 見た目完成（実験中）", img:"images/wire_test.jpg",
    ok:"つなぎ方をためそう！", note:"前後が逆なら入れ替えてみよう。", danger:true },

  { nav:"⑥ 完成！", title:"⑥ ほんとうの完成！", img:"images/complete.jpg",
    ok:"前後に動いたら大成功！", note:"安全に走らせよう。" }
];

let current = 0;

/* ナビ生成 */
const nav = document.getElementById("nav");
steps.forEach((s,i)=>{
  const b = document.createElement("button");
  b.textContent = s.nav;
  if (s.danger) b.classList.add("danger");
  b.onclick = ()=>showStep(i);
  nav.appendChild(b);
});

/* 表示更新 */
function showStep(i){
  current = i;
  document.querySelectorAll("nav button").forEach((b,idx)=>{
    b.classList.toggle("active", idx===i);
  });

  const step = steps[i];
  document.getElementById("stepTitle").textContent = step.title;
  document.getElementById("photo").src = step.img;
  document.getElementById("ok").textContent = step.ok;
  document.getElementById("note").textContent = step.note;

  const box = document.getElementById("photoBox");
  box.classList.toggle("danger", !!step.danger);
}

/* 初期表示 */
showStep(0);

/* ===== 拡大ビュー操作 ===== */
const viewer = document.getElementById("viewer");
const viewerImg = document.getElementById("viewerImg");
let scale = 1, startDist = 0, offsetX = 0, offsetY = 0, startX = 0, startY = 0;

document.getElementById("photo").onclick = ()=>{
  viewerImg.src = steps[current].img;
  scale = 1; offsetX = 0; offsetY = 0;
  updateTransform();
  viewer.classList.add("show");
};

document.getElementById("closeBtn").onclick = ()=>{
  viewer.classList.remove("show");
};

function updateTransform(){
  viewerImg.style.transform =
    `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px)) scale(${scale})`;
}

viewer.addEventListener("touchstart", e=>{
  if(e.touches.length===2){
    const dx = e.touches[0].pageX - e.touches[1].pageX;
    const dy = e.touches[0].pageY - e.touches[1].pageY;
    startDist = Math.hypot(dx,dy);
  } else if(e.touches.length===1){
    startX = e.touches[0].pageX - offsetX;
    startY = e.touches[0].pageY - offsetY;
  }
});

viewer.addEventListener("touchmove", e=>{
  e.preventDefault();
  if(e.touches.length===2){
    const dx = e.touches[0].pageX - e.touches[1].pageX;
    const dy = e.touches[0].pageY - e.touches[1].pageY;
    const dist = Math.hypot(dx,dy);
    scale = Math.min(4, Math.max(1, scale * (dist/startDist)));
    startDist = dist;
    updateTransform();
  } else if(e.touches.length===1){
    offsetX = e.touches[0].pageX - startX;
    offsetY = e.touches[0].pageY - startY;
    updateTransform();
  }
},{passive:false});
</script>

</body>
</html>
