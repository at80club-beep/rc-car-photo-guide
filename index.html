<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー 写真参照ガイド</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =========================
   基本変数（ズレ完全防止）
========================= */
:root {
  --font-base: 18px;        /* 高齢者向け大きめ */
  --header-height: 150px;  /* 文字サイズ連動 */
  --main-color: #2f6fb1;
}

/* =========================
   全体
========================= */
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #faf7f2;
  color: #222;
  font-size: var(--font-base);
  line-height: 1.8;
}

/* =========================
   ヘッダー
========================= */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #ffffff;
  border-bottom: 2px solid #c8bfa6;
  padding: 10px 12px;
}

header h1 {
  margin: 0;
  font-size: 1.4em;
}

/* 現在地表示（重要） */
#current-section {
  margin-top: 8px;
  padding: 8px 10px;
  background: #eef3f8;
  border-left: 8px solid var(--main-color);
  font-weight: bold;
}

/* =========================
   ナビ
========================= */
nav {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  margin-top: 10px;
}

nav a,
nav button {
  font-size: 1em;
  padding: 10px 16px;
  border-radius: 8px;
  border: 3px solid #c8bfa6;
  background: #fff;
  color: #222;
  cursor: pointer;
  white-space: nowrap;
}

/* 現在地（色＋枠＋文字） */
nav a.active {
  background: var(--main-color);
  color: #fff;
  border-color: #163a5f;
  font-weight: bold;
}

nav a:active {
  background: #1f4e85;
}

/* =========================
   メイン
========================= */
main {
  padding: 16px;
}

/* =========================
   セクション
========================= */
section {
  background: #ffffff;
  border: 2px solid #eee0c8;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 28px;

  /* ★リンクズレ完全防止 */
  scroll-margin-top: var(--header-height);
}

h2 {
  margin: 0 0 10px;
  font-size: 1.3em;
  border-left: 6px solid var(--main-color);
  padding-left: 10px;
}

/* =========================
   指導ポイント
========================= */
.note-box {
  background: #f5efe4;
  padding: 12px;
  border-radius: 10px;
  margin-top: 12px;
  font-size: 0.95em;
}

/* 上級者制御 */
#toggle-note {
  display: none;
}

.advanced #toggle-note {
  display: inline-block;
}

.hide-note .note-box {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>リモコンカー 写真参照ガイド</h1>

  <div id="current-section">現在：電池BOX</div>

  <nav>
    <a href="#battery">電池BOX</a>
    <a href="#wire">電線</a>
    <a href="#switch">スイッチ</a>
    <a href="#test">テスト</a>
    <a href="#complete">完成</a>

    <!-- 上級者のみ -->
    <button id="toggle-note">指導ポイント ON / OFF</button>

    <!-- 文字サイズ -->
    <button onclick="setFont(0.9)">小</button>
    <button onclick="setFont(1)">中</button>
    <button onclick="setFont(1.1)">大</button>
  </nav>
</header>

<main>

<section id="battery">
  <h2>📦 電池BOX</h2>
  <p>写真 P25 を見ながら作ります。</p>
  <div class="note-box">
    ・＋と－の向きを必ず確認<br>
    ・銅テープはしっかり押さえる
  </div>
</section>

<section id="wire">
  <h2>🔌 電線づくり</h2>
  <p>写真 P30 を参考にします。</p>
  <div class="note-box">
    ・磁石の向きに注意<br>
    ・外れないか確認
  </div>
</section>

<section id="switch">
  <h2>🎮 スイッチ</h2>
  <p>写真 P62 / P72</p>
  <div class="note-box">
    ・左右で電気の向きが変わる
  </div>
</section>

<section id="test">
  <h2>🔬 テスト</h2>
  <p>写真 P81</p>
  <div class="note-box">
    ・回転方向を見比べる
  </div>
</section>

<section id="complete">
  <h2>🏆 完成</h2>
  <p>写真 P50</p>
  <div class="note-box">
    ・配線がタイヤに当たらない
  </div>
</section>

</main>

<script>
/* =========================
   初心者 / 上級者
========================= */
const params = new URLSearchParams(location.search);
if (params.get("mode") === "advanced") {
  document.body.classList.add("advanced");
}

/* =========================
   指導ポイント切替
========================= */
const toggleBtn = document.getElementById("toggle-note");
let noteVisible = true;

toggleBtn?.addEventListener("click", () => {
  noteVisible = !noteVisible;
  document.body.classList.toggle("hide-note", !noteVisible);
});

/* =========================
   文字サイズ（ズレ完全防止）
========================= */
function setFont(scale) {
  document.documentElement.style.setProperty("--font-base", `${18 * scale}px`);
  document.documentElement.style.setProperty("--header-height", `${150 * scale}px`);
}

/* =========================
   現在地ハイライト（高齢者向け）
========================= */
const navLinks = document.querySelectorAll("nav a");
const sections = document.querySelectorAll("main section");
const currentLabel = document.getElementById("current-section");

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const id = entry.target.id;
      const title = entry.target.querySelector("h2")?.innerText;

      navLinks.forEach(link => {
        link.classList.toggle(
          "active",
          link.getAttribute("href") === `#${id}`
        );
      });

      if (title) {
        currentLabel.textContent = "現在：" + title;
      }
    }
  });
}, {
  rootMargin: "-45% 0px -45% 0px"
});

sections.forEach(section => observer.observe(section));
</script>

</body>
</html>
