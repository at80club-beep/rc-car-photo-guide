<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー作り 写真で確認シート（指導員用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">

<style>
/* =====================
   サイズ制御用変数
===================== */
:root{
  --font-base:20px;
  --btn-font:20px;
  --btn-padding:12px 18px;
  --btn-border:5px;
  --title-weight:900;
  --photo-max-width:95vw;
}

/* =====================
   共通
===================== */
body{
  margin:0;
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
  background:#faf7f2;
  color:#333;
  font-size:var(--font-base);
  line-height:1.7;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

/* 拡大写真表示中のbody用クラス */
body.photo-expanded{
  overflow:hidden;
  position:fixed;
  width:100%;
  height:100%;
}

/* =====================
   ヘッダー
===================== */
header{
  position:sticky;
  top:0;
  background:#fff7dd;
  border-bottom:4px solid #e0cfa0;
  padding:8px 10px;
  z-index:100;
}

/* タイトル行 */
.header-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.title{
  font-size:1.3em;
  font-weight:var(--title-weight);
  margin:0;
  white-space:nowrap;
}

.subtitle{
  font-size:0.6em;
  font-weight:500;
  color:#555;
  margin-left:4px;
}

/* =====================
   文字サイズ切替
===================== */
.font-controls{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

.font-controls button{
  min-width:50px;
  padding:8px 12px;
  font-size:16px;
  border:2px solid #999;
  background:#fff;
  border-radius:8px;
  cursor:pointer;
}

.font-controls button.active{
  background:#333;
  color:#fff;
  border-color:#000;
}

/* =====================
   工程ナビ
===================== */
nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:8px 0 6px;
}

nav button{
  flex:1 1 auto;
  min-width:120px;
  min-height:50px;
  font-size:var(--btn-font);
  padding:var(--btn-padding);
  border:var(--btn-border) solid #a6842c;
  background:#fff;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  margin-bottom:5px;
}

nav button.active{
  background:#f0b344;
  color:#000;
  border-color:#000;
}

/* =====================
   メイン
===================== */
main{
  padding:12px;
  scroll-margin-top:120px;
}

.section-title{
  font-size:1.3em;
  font-weight:800;
  margin-bottom:12px;
  padding-bottom:5px;
  border-bottom:3px solid #f0b344;
  scroll-margin-top:120px;
}

.photo-box{
  background:#fff;
  border:4px solid #e0cfa0;
  border-radius:14px;
  padding:15px;
  text-align:center;
}

/* 写真コンテナ */
.photo-container{
  position:relative;
  max-width:var(--photo-max-width);
  margin:0 auto 15px;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:200px; /* 最小高さを確保 */
}

.photo-img{
  width:auto;
  max-width:100%;
  max-height:400px;
  object-fit:contain;
  display:block;
  border-radius:12px;
  border:4px solid #e0cfa0;
  cursor:pointer;
  background:#f9f9f9;
  margin:0 auto;
  -webkit-user-drag:none;
  user-drag:none;
  /* タッチ操作の改善 */
  touch-action:pan-y pinch-zoom;
  -webkit-touch-callout:none;
}

.photo-img:active{
  transform:scale(0.98);
}

/* スマホ向けヒント */
.photo-hint{
  text-align:center;
  color:#666;
  font-size:0.9em;
  margin:5px 0 15px;
  padding:8px;
  background:#f0f0f0;
  border-radius:8px;
  border-left:4px solid #f0b344;
}

/* OKメッセージ */
.ok-box{
  background:#e8f6e8;
  border:3px solid #4caf50;
  border-radius:10px;
  padding:12px;
  margin:15px 0;
  font-size:1.1em;
  font-weight:800;
  text-align:center;
}

/* 補足 */
.note{
  background:#f5efe4;
  padding:12px;
  border-radius:8px;
  font-size:1em;
  border-left:4px solid #a6842c;
}

/* =====================
   写真拡大（スマホ最適化）- ピンチズーム対応
===================== */
.overlay{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  z-index:999;
  overflow:hidden;
}

.overlay-content{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.overlay-img-container{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.overlay-img{
  position:absolute;
  max-width:100%;
  max-height:100%;
  transform-origin:center center;
  transition:transform 0.1s ease;
  cursor:move;
  user-select:none;
  -webkit-user-drag:none;
  -webkit-touch-callout:none;
  -webkit-transform:translateZ(0);
  transform:translateZ(0);
}

.overlay-img:active{
  cursor:grabbing;
}

/* スマホ向け：縦向きの場合は横向き表示 */
@media (max-width: 768px) and (orientation: portrait) {
  .overlay-img {
    transform: rotate(90deg) translate(0px, 0px) scale(1);
  }
}

/* 閉じるボタン */
.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  width:60px;
  height:60px;
  background:rgba(0,0,0,0.7);
  color:white;
  font-size:40px;
  line-height:60px;
  text-align:center;
  border-radius:50%;
  z-index:1001;
  cursor:pointer;
  border:3px solid white;
  user-select:none;
}

/* 操作説明 */
.instruction{
  position:absolute;
  bottom:20px;
  left:0;
  right:0;
  text-align:center;
  color:white;
  font-size:16px;
  z-index:1000;
  padding:10px;
  background:rgba(0,0,0,0.5);
  opacity:0.8;
  user-select:none;
}

/* =====================
   印刷対応
===================== */
@media print{
  header{
    display:none;
  }

  .photo-img, .photo-hint{
    display:none;
  }

  body{
    background:#fff;
    font-size:14pt;
  }

  .photo-box{
    border:none;
    padding:0;
  }
}

/* =====================
   フッター
===================== */
footer{
  text-align:center;
  padding:15px;
  font-size:0.9em;
  color:#666;
  border-top:2px solid #e0cfa0;
  margin-top:20px;
}

/* 画像エラースタイル */
.img-error{
  position:relative;
}

.img-error::after{
  content:"画像が見つかりません";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  color:#ff6b6b;
  font-weight:bold;
  text-align:center;
  padding:10px;
  background:rgba(255,255,255,0.9);
  border-radius:8px;
}

/* スクロールヒント */
.scroll-hint{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.7);
  color:white;
  padding:6px 12px;
  border-radius:20px;
  font-size:14px;
  z-index:10;
  animation:bounce 2s infinite;
  display:none;
}

@keyframes bounce{
  0%, 20%, 50%, 80%, 100%{ transform:translateX(-50%) translateY(0); }
  40%{ transform:translateX(-50%) translateY(-10px); }
  60%{ transform:translateX(-50%) translateY(-5px); }
}

/* スマホ向け最適化 */
@media (max-width: 768px){
  .scroll-hint{
    display:block;
  }
  
  /* 写真が大きい場合はスクロール可能に */
  .photo-container{
    max-height:50vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:30px; /* スクロールヒントのスペース */
  }
  
  .photo-img{
    touch-action:pan-y;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <h1 class="title">
      リモコンカー作り 写真で確認シート
      <span class="subtitle">（指導員用）</span>
    </h1>

    <div class="font-controls">
      <button data-size="small">小</button>
      <button data-size="medium">中</button>
      <button data-size="large" class="active">大</button>
    </div>
  </div>

  <nav id="nav">
    <button data-target="battery" class="active">電池BOX完成</button>
    <button data-target="wire">電池につける電線</button>
    <button data-target="switch">前後切り替えスイッチ</button>
    <button data-target="test">モーターのテスト</button>
    <button data-target="complete">完成品</button>
  </nav>
</header>

<main>
  <div class="section-title" id="sectionTitle">
    電池BOX完成
  </div>

  <div class="photo-box">
    <div class="photo-container">
      <img id="photo" src="images/battery_box.jpg" alt="電池BOX完成" class="photo-img">
      <div class="scroll-hint">↓ 写真の上でスクロールできます ↓</div>
    </div>
    
    <p class="photo-hint">
      📱写真をタップで拡大表示<br>
      🤏拡大中: 指2本で拡大縮小・1本指で移動・タップで閉じる
    </p>

    <div class="ok-box" id="okMessage">
      ✅ この写真と同じになっていれば OK です
    </div>

    <div class="note" id="note">
      電池の＋－向きが合っているかを確認します。
    </div>
  </div>
</main>

<footer>
  <p>このシートはリモコンカー作りの指導員用です。写真を見比べて確認しましょう。</p>
</footer>

<!-- 写真拡大 -->
<div id="overlay" class="overlay">
  <div class="overlay-content">
    <div class="close-btn" id="closeBtn">×</div>
    <div class="instruction" id="instruction">
      指2本で拡大縮小・1本指で移動・タップで閉じる
    </div>
    <div class="overlay-img-container">
      <img id="overlayImg" class="overlay-img">
    </div>
  </div>
</div>

<script>
/* =====================
   工程データ
===================== */
const sections = {
  battery:{
    title:"電池BOX完成",
    img:"images/battery_box.jpg",
    ok:"この写真と同じになっていれば OK です",
    note:"電池の＋－向きが合っているかを確認します。"
  },
  wire:{
    title:"電池につける電線",
    img:"images/wire_magnet.jpg",
    ok:"この形になっていれば OK です",
    note:"磁石が端子にピタッと付いているか確認します。"
  },
  switch:{
    title:"前後切り替えスイッチ",
    img:"images/switch_complete.jpg",
    ok:"この配置になっていれば OK です",
    note:"左右のボタンで動きが変わることを確認します。"
  },
  test:{
    title:"モーターのテスト",
    img:"images/motor_test.jpg",
    ok:"写真のように回れば OK です",
    note:"回らない場合は接触を確認します。"
  },
  complete:{
    title:"完成品",
    img:"images/car_complete.jpg",
    ok:"この状態なら完成です",
    note:"配線がタイヤに絡んでいないか確認します。"
  }
};

/* =====================
   スマホ判定
===================== */
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

/* =====================
   工程切替 - ページトップにスクロール（スマホ対応）
===================== */
const buttons = document.querySelectorAll("nav button");
const photo = document.getElementById("photo");

// 確実にページトップにスクロールする関数
function scrollToTop() {
  // 複数の方法で確実にトップに移動
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  // スマホ用に追加のスクロール方法
  if (isMobile) {
    document.body.scrollTop = 0;
    document.documentElement.scrollTop = 0;
    
    // 少し遅らせてもう一度スクロール（確実性のため）
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

buttons.forEach(btn => {
  btn.onclick = () => {
    // まず確実にページトップにスクロール
    scrollToTop();
    
    // 少し遅延させてから内容を変更
    setTimeout(() => {
      buttons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const key = btn.dataset.target;
      const section = sections[key];
      
      document.getElementById("sectionTitle").textContent = section.title;
      document.getElementById("okMessage").innerHTML = "✅ " + section.ok;
      document.getElementById("note").innerHTML = section.note;
      
      // 画像の読み込み
      const img = new Image();
      img.onload = function() {
        photo.src = section.img;
        photo.alt = section.title;
        photo.classList.remove("img-error");
        
        // 画像読み込み後にスクロールヒントを調整
        adjustScrollHint();
      };
      img.onerror = function() {
        photo.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480"><rect width="640" height="480" fill="%23f5f5f5"/><text x="320" y="220" font-family="Arial" font-size="24" fill="%23666" text-anchor="middle">${section.title}</text><text x="320" y="260" font-family="Arial" font-size="18" fill="%23999" text-anchor="middle">画像準備中</text></svg>`;
        photo.alt = `${section.title}（画像準備中）`;
        photo.classList.add("img-error");
      };
      img.src = section.img;
      
      // ボタンにフォーカスを当てる
      btn.focus();
    }, 300);
  };
});

/* =====================
   スクロールヒントの調整
===================== */
function adjustScrollHint() {
  const photoContainer = document.querySelector('.photo-container');
  const scrollHint = document.querySelector('.scroll-hint');
  
  if (!photoContainer || !scrollHint) return;
  
  // 画像の高さとコンテナの高さを比較
  const imgHeight = photo.naturalHeight || photo.clientHeight;
  const containerHeight = photoContainer.clientHeight;
  
  // 画像がコンテナより大きい場合のみスクロールヒントを表示
  if (imgHeight > containerHeight && isMobile) {
    scrollHint.style.display = 'block';
    
    // 5秒後にフェードアウト
    setTimeout(() => {
      scrollHint.style.transition = 'opacity 1s';
      scrollHint.style.opacity = '0';
      setTimeout(() => {
        scrollHint.style.display = 'none';
      }, 1000);
    }, 5000);
  } else {
    scrollHint.style.display = 'none';
  }
}

/* =====================
   写真拡大 - 修正版
===================== */
const overlay = document.getElementById("overlay");
const overlayImg = document.getElementById("overlayImg");
const instruction = document.getElementById("instruction");
const closeBtn = document.getElementById("closeBtn");

// 状態変数
let scale = 1;
let posX = 0;
let posY = 0;
let isDragging = false;
let isPinching = false;
let lastPosX = 0;
let lastPosY = 0;
let startX = 0;
let startY = 0;
let startDistance = 0;

// 2点間の距離を計算
function getDistance(touch1, touch2) {
  const dx = touch1.clientX - touch2.clientX;
  const dy = touch1.clientY - touch2.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

// 2点間の中点を計算
function getMidpoint(touch1, touch2) {
  return {
    x: (touch1.clientX + touch2.clientX) / 2,
    y: (touch1.clientY + touch2.clientY) / 2
  };
}

// 拡大写真の移動範囲を制限する関数
function clampPosition() {
  if (!overlayImg || !overlay) return;
  
  // 画像の実際の表示サイズ（スケール考慮）
  const imgDisplayWidth = overlayImg.naturalWidth * scale;
  const imgDisplayHeight = overlayImg.naturalHeight * scale;
  
  // コンテナのサイズ
  const containerWidth = overlay.clientWidth;
  const containerHeight = overlay.clientHeight;
  
  // スマホ縦向きの場合は回転を考慮
  if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) {
    // 回転時は画像の幅と高さが入れ替わる
    const rotatedWidth = imgDisplayHeight;
    const rotatedHeight = imgDisplayWidth;
    
    // 移動可能な範囲を計算
    const maxX = Math.max(0, (rotatedWidth - containerWidth) / 2);
    const maxY = Math.max(0, (rotatedHeight - containerHeight) / 2);
    
    // 範囲内に制限
    posX = Math.max(Math.min(posX, maxX), -maxX);
    posY = Math.max(Math.min(posY, maxY), -maxY);
  } else {
    // 通常の場合
    const maxX = Math.max(0, (imgDisplayWidth - containerWidth) / 2);
    const maxY = Math.max(0, (imgDisplayHeight - containerHeight) / 2);
    
    // 範囲内に制限
    posX = Math.max(Math.min(posX, maxX), -maxX);
    posY = Math.max(Math.min(posY, maxY), -maxY);
  }
}

// トランスフォームを更新
function updateTransform() {
  let transform;
  if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) {
    // スマホ縦向き
    transform = `rotate(90deg) translate(${posX}px, ${posY}px) scale(${scale})`;
  } else {
    // その他
    transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
  }
  overlayImg.style.transform = transform;
}

// 初期画面の写真でのタッチ操作
let photoTouchStartTime = 0;
let photoTouchStartX = 0;
let photoTouchStartY = 0;
let photoIsScrolling = false;

// 写真のタッチ開始
photo.addEventListener('touchstart', function(e) {
  // タッチ開始時の情報を保存
  const touch = e.touches[0];
  photoTouchStartTime = Date.now();
  photoTouchStartX = touch.clientX;
  photoTouchStartY = touch.clientY;
  photoIsScrolling = false;
  
  // デフォルト動作は許可（スクロール可能に）
  // ただし、マルチタッチ（2本指以上）の場合はピンチズームを防ぐ
  if (e.touches.length > 1) {
    e.preventDefault();
  }
}, { passive: true });

// 写真のタッチ移動
photo.addEventListener('touchmove', function(e) {
  if (e.touches.length === 1) {
    const touch = e.touches[0];
    const deltaX = Math.abs(touch.clientX - photoTouchStartX);
    const deltaY = Math.abs(touch.clientY - photoTouchStartY);
    
    // 縦方向の移動が横方向より大きければスクロールと判定
    if (deltaY > deltaX && deltaY > 10) {
      photoIsScrolling = true;
    }
    
    // スクロール中は何もしない（ブラウザのデフォルトスクロールを使用）
  } else if (e.touches.length > 1) {
    // マルチタッチの場合は拡大写真表示でのみ許可
    e.preventDefault();
  }
}, { passive: true });

// 写真のタッチ終了
photo.addEventListener('touchend', function(e) {
  const touchTime = Date.now() - photoTouchStartTime;
  const touch = e.changedTouches[0];
  const touchMoveX = Math.abs(touch.clientX - photoTouchStartX);
  const touchMoveY = Math.abs(touch.clientY - photoTouchStartY);
  
  // 短時間でほとんど動かず、スクロール中でなければ拡大表示
  if (touchTime < 300 && touchMoveX < 10 && touchMoveY < 10 && !photoIsScrolling) {
    e.preventDefault();
    openPhoto();
  }
}, { passive: false });

// 写真クリックで拡大表示（PC用とフォールバック）
photo.addEventListener('click', function(e) {
  // タッチデバイスではタッチイベントで処理するので、ここではPC用
  if (!('ontouchstart' in window)) {
    openPhoto();
  }
});

// 拡大表示を開く関数
function openPhoto() {
  overlayImg.src = photo.src;
  overlay.style.display = "block";
  
  // スマホの場合はbodyにクラスを追加してスクロールを制御
  if (isMobile) {
    document.body.classList.add("photo-expanded");
    document.body.style.overflow = "hidden";
    document.documentElement.style.overflow = "hidden";
    document.body.style.position = "fixed";
    document.body.style.width = "100%";
    document.body.style.height = "100%";
  }
  
  // 初期状態に完全リセット
  resetZoomAndPosition();
  
  // スマホの場合は横向きに調整
  adjustForMobile();
  
  // 操作説明を表示（5秒後にフェードアウト）
  instruction.style.opacity = "1";
  instruction.style.display = "block";
  setTimeout(() => {
    instruction.style.transition = "opacity 1s";
    instruction.style.opacity = "0.3";
  }, 5000);
}

// スマホ表示用の調整
function adjustForMobile() {
  if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) {
    // スマホ縦向きの場合は横向き表示
    overlayImg.style.transform = "rotate(90deg) translate(0px, 0px) scale(1)";
  } else {
    // その他の場合は通常表示
    overlayImg.style.transform = "translate(0px, 0px) scale(1)";
  }
}

// ズーム状態と位置を完全リセット
function resetZoomAndPosition() {
  scale = 1;
  posX = 0;
  posY = 0;
  isDragging = false;
  isPinching = false;
  lastPosX = 0;
  lastPosY = 0;
  
  // CSS変数もリセット
  overlayImg.style.transform = "";
  overlayImg.style.transformOrigin = "center center";
  overlayImg.style.transition = "transform 0.1s ease";
}

// 拡大画像を閉じる
function closePhoto() {
  // まず完全にリセット
  resetZoomAndPosition();
  
  // オーバーレイを非表示
  overlay.style.display = "none";
  
  // スマホの場合はbodyの状態を完全にリセット
  if (isMobile) {
    // bodyの状態を完全リセット
    document.body.classList.remove("photo-expanded");
    document.body.style.overflow = "";
    document.documentElement.style.overflow = "";
    document.body.style.position = "";
    document.body.style.width = "";
    document.body.style.height = "";
    
    // 強制的にviewportをリセット
    resetViewport();
    
    // スクロール位置をリセット
    setTimeout(() => {
      window.scrollTo(0, 0);
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
    }, 10);
  } else {
    // PCの場合
    document.body.style.overflow = "";
    document.documentElement.style.overflow = "";
  }
  
  instruction.style.display = "none";
}

// スマホ用viewportリセット
function resetViewport() {
  // viewport metaタグを一時的に変更してズームをリセット
  const viewport = document.querySelector('meta[name="viewport"]');
  if (viewport) {
    const originalContent = viewport.getAttribute("content");
    
    // viewportを一時的に変更
    viewport.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes");
    
    // 少し遅らせて元に戻す
    setTimeout(() => {
      viewport.setAttribute("content", originalContent);
    }, 100);
  }
}

// 閉じるボタンのイベント
closeBtn.onclick = closePhoto;

// オーバーレイクリックでも閉じる
overlay.addEventListener('click', function(e) {
  if (e.target === overlay || e.target.classList.contains('instruction')) {
    closePhoto();
  }
});

// ESCキーでも閉じられるように
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && overlay.style.display === 'block') {
    closePhoto();
  }
});

/* =====================
   拡大写真のタッチイベント（スマホ用）
===================== */
let touchStartTime = 0;
let touchStartX = 0;
let touchStartY = 0;

overlayImg.addEventListener('touchstart', function(e) {
  e.preventDefault();
  e.stopPropagation();
  
  const touches = Array.from(e.touches);
  
  if (touches.length === 1) {
    // 1本指でのタッチ開始（ドラッグ開始）
    isDragging = true;
    isPinching = false;
    
    const touch = touches[0];
    
    // 現在の位置を保存
    lastPosX = posX;
    lastPosY = posY;
    
    // 開始位置を保存（画面座標）
    startX = touch.clientX;
    startY = touch.clientY;
    
    // シングルタップ判定のための情報を保存
    touchStartTime = Date.now();
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
    
    overlayImg.style.cursor = 'grabbing';
  } else if (touches.length === 2) {
    // 2本指でのタッチ開始（ピンチズーム開始）
    isPinching = true;
    isDragging = false;
    
    // 開始時の距離を保存
    startDistance = getDistance(touches[0], touches[1]);
    
    // 現在の位置を保存
    lastPosX = posX;
    lastPosY = posY;
    
    // ピンチの中心点を計算
    const midpoint = getMidpoint(touches[0], touches[1]);
    startX = midpoint.x;
    startY = midpoint.y;
  }
}, { passive: false });

overlayImg.addEventListener('touchmove', function(e) {
  e.preventDefault();
  e.stopPropagation();
  
  const touches = Array.from(e.touches);
  
  if (touches.length === 1 && isDragging) {
    // 1本指での移動（ドラッグ）
    const touch = touches[0];
    
    // 移動量を計算
    const deltaX = touch.clientX - startX;
    const deltaY = touch.clientY - startY;
    
    // 新しい位置を計算
    posX = lastPosX + deltaX;
    posY = lastPosY + deltaY;
    
    // 移動範囲を制限
    clampPosition();
    
    updateTransform();
  } else if (touches.length === 2 && isPinching) {
    // 2本指での移動（ピンチズーム）
    const currentDistance = getDistance(touches[0], touches[1]);
    const newScale = Math.max(0.5, Math.min(5, scale * (currentDistance / startDistance)));
    
    // スケールの変化量
    const scaleChange = newScale / scale;
    
    // ピンチの中心点
    const midpoint = getMidpoint(touches[0], touches[1]);
    
    // 拡大中心を調整（中心点を基準に拡大縮小）
    if (scaleChange !== 1) {
      // 中心点に対する相対位置を計算
      const relativeX = (midpoint.x - window.innerWidth / 2 - posX) / scale;
      const relativeY = (midpoint.y - window.innerHeight / 2 - posY) / scale;
      
      // 新しい位置を計算
      posX = midpoint.x - window.innerWidth / 2 - relativeX * newScale;
      posY = midpoint.y - window.innerHeight / 2 - relativeY * newScale;
      
      scale = newScale;
      
      // 移動範囲を制限
      clampPosition();
      
      updateTransform();
      
      // 次の計算のために開始距離を更新
      startDistance = currentDistance;
    }
  }
}, { passive: false });

overlayImg.addEventListener('touchend', function(e) {
  e.preventDefault();
  e.stopPropagation();
  
  const remainingTouches = Array.from(e.touches);
  const changedTouches = Array.from(e.changedTouches);
  
  // シングルタップ判定
  if (remainingTouches.length === 0 && changedTouches.length === 1) {
    const touch = changedTouches[0];
    const touchTime = Date.now() - touchStartTime;
    const touchMoveX = Math.abs(touch.clientX - touchStartX);
    const touchMoveY = Math.abs(touch.clientY - touchStartY);
    
    // 短時間でほとんど動かず、ズームしていなければ閉じる
    if (touchTime < 300 && touchMoveX < 10 && touchMoveY < 10 && scale <= 1.1) {
      setTimeout(() => {
        closePhoto();
      }, 50);
      return;
    }
    
    // ズーム中で短時間タップなら元のサイズに戻る
    if (touchTime < 300 && touchMoveX < 10 && touchMoveY < 10 && scale > 1.1) {
      scale = 1;
      posX = 0;
      posY = 0;
      clampPosition();
      updateTransform();
      return;
    }
  }
  
  // 状態リセット
  if (remainingTouches.length === 0) {
    isDragging = false;
    isPinching = false;
    overlayImg.style.cursor = 'move';
  } else if (remainingTouches.length === 1) {
    // 2本指から1本指になった場合、ドラッグモードに切り替え
    isDragging = true;
    isPinching = false;
    const touch = remainingTouches[0];
    
    // 現在の位置を保存
    lastPosX = posX;
    lastPosY = posY;
    
    // 開始位置を更新
    startX = touch.clientX;
    startY = touch.clientY;
  } else if (remainingTouches.length === 2) {
    // 新しい2本指の状態で距離を再計算
    startDistance = getDistance(remainingTouches[0], remainingTouches[1]);
    isPinching = true;
    isDragging = false;
  }
}, { passive: false });

/* =====================
   マウスイベント（PC用）
===================== */
let isMouseDown = false;
let lastMouseX = 0;
let lastMouseY = 0;
let lastClickTime = 0;

overlayImg.addEventListener('mousedown', function(e) {
  e.preventDefault();
  e.stopPropagation();
  
  if (e.button === 0) { // 左クリックのみ
    isMouseDown = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    overlayImg.style.cursor = 'grabbing';
    
    // ダブルクリック判定
    const now = Date.now();
    if (now - lastClickTime < 300) {
      // ダブルクリック：ズームトグル
      if (scale === 1) {
        scale = 2;
        posX = 0;
        posY = 0;
      } else {
        scale = 1;
        posX = 0;
        posY = 0;
      }
      clampPosition();
      updateTransform();
      lastClickTime = 0;
    } else {
      lastClickTime = now;
    }
  }
});

document.addEventListener('mousemove', function(e) {
  if (isMouseDown) {
    e.preventDefault();
    e.stopPropagation();
    
    const deltaX = e.clientX - lastMouseX;
    const deltaY = e.clientY - lastMouseY;
    
    // 画像の移動
    posX += deltaX;
    posY += deltaY;
    
    // 移動範囲を制限
    clampPosition();
    updateTransform();
    
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  }
});

document.addEventListener('mouseup', function(e) {
  if (e.button === 0) {
    isMouseDown = false;
    overlayImg.style.cursor = 'move';
  }
});

overlayImg.addEventListener('mouseleave', function() {
  isMouseDown = false;
  overlayImg.style.cursor = 'move';
});

// マウスホイールでズーム（PC用）
overlayImg.addEventListener('wheel', function(e) {
  e.preventDefault();
  e.stopPropagation();
  
  const zoomIntensity = 0.1;
  const wheelDelta = e.deltaY > 0 ? -zoomIntensity : zoomIntensity;
  const newScale = Math.max(0.5, Math.min(5, scale + wheelDelta));
  
  // マウス位置を拡大中心にする
  const rect = overlayImg.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  
  // 画像上の相対位置
  const imgX = (mouseX - posX) / scale;
  const imgY = (mouseY - posY) / scale;
  
  // 拡大中心を調整
  posX = mouseX - imgX * newScale;
  posY = mouseY - imgY * newScale;
  scale = newScale;
  
  clampPosition();
  updateTransform();
}, { passive: false });

// 画像読み込み後にサイズ調整
overlayImg.addEventListener('load', function() {
  if (overlay.style.display === 'block') {
    resetZoomAndPosition();
    adjustForMobile();
    overlayImg.style.cursor = 'move';
  }
});

// 写真画像読み込み後にスクロールヒントを調整
photo.addEventListener('load', function() {
  adjustScrollHint();
});

// スマホの回転イベントに対応
window.addEventListener('orientationchange', function() {
  setTimeout(() => {
    if (overlay.style.display === 'block') {
      resetZoomAndPosition();
      adjustForMobile();
    } else {
      // 拡大写真が表示されていない場合もリセット
      if (isMobile) {
        resetViewport();
      }
    }
    // 画面回転後にスクロールヒントを再調整
    adjustScrollHint();
  }, 300);
});

// ウィンドウリサイズ時にズーム状態を確認
window.addEventListener('resize', function() {
  if (overlay.style.display === 'block') {
    clampPosition();
    adjustForMobile();
    updateTransform();
  }
  // リサイズ後にスクロールヒントを再調整
  setTimeout(adjustScrollHint, 100);
});

/* =====================
   文字サイズ切替（保存）
===================== */
const sizeButtons = document.querySelectorAll(".font-controls button");

function applySize(size) {
  sizeButtons.forEach(b => b.classList.remove("active"));
  
  if (size === "small") {
    document.documentElement.style.setProperty("--font-base", "16px");
    document.documentElement.style.setProperty("--btn-font", "16px");
    document.documentElement.style.setProperty("--btn-padding", "8px 14px");
    document.documentElement.style.setProperty("--btn-border", "3px");
    document.documentElement.style.setProperty("--title-weight", "700");
    document.documentElement.style.setProperty("--photo-max-width", "95vw");
  } else if (size === "medium") {
    document.documentElement.style.setProperty("--font-base", "18px");
    document.documentElement.style.setProperty("--btn-font", "18px");
    document.documentElement.style.setProperty("--btn-padding", "10px 16px");
    document.documentElement.style.setProperty("--btn-border", "4px");
    document.documentElement.style.setProperty("--title-weight", "800");
    document.documentElement.style.setProperty("--photo-max-width", "90vw");
  } else if (size === "large") {
    document.documentElement.style.setProperty("--font-base", "20px");
    document.documentElement.style.setProperty("--btn-font", "20px");
    document.documentElement.style.setProperty("--btn-padding", "12px 18px");
    document.documentElement.style.setProperty("--btn-border", "5px");
    document.documentElement.style.setProperty("--title-weight", "900");
    document.documentElement.style.setProperty("--photo-max-width", "85vw");
  }
  
  localStorage.setItem("fontSize", size);
  document.querySelector(`.font-controls button[data-size="${size}"]`).classList.add("active");
  
  // 文字サイズ変更後にスクロールヒントを再調整
  setTimeout(adjustScrollHint, 100);
}

sizeButtons.forEach(btn => {
  btn.onclick = () => {
    applySize(btn.dataset.size);
  };
});

// 保存された設定を適用（デフォルトは「大」）
const saved = localStorage.getItem("fontSize") || "large";
applySize(saved);

/* =====================
   初期化
===================== */
window.addEventListener('load', function() {
  // 初期画像の存在をチェック
  const img = new Image();
  img.onload = function() {
    console.log('✅ 初期画像が正常に読み込まれました');
    
    // 初期画像読み込み後にスクロールヒントを調整
    setTimeout(adjustScrollHint, 500);
  };
  img.onerror = function() {
    console.error('❌ 初期画像が見つかりません');
  };
  img.src = sections.battery.img;
  
  // スマホ向けの初期設定
  if (isMobile) {
    console.log('📱 スマホデバイスを検出しました');
    
    // スマホ向けヒントを表示
    setTimeout(() => {
      const hint = document.querySelector('.scroll-hint');
      if (hint) {
        hint.style.display = 'block';
        setTimeout(() => {
          hint.style.transition = 'opacity 1s';
          hint.style.opacity = '0';
          setTimeout(() => {
            hint.style.display = 'none';
          }, 1000);
        }, 5000);
      }
    }, 1000);
  }
});
