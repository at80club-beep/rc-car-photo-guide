<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リモコンカー作り 写真で確認シート（指導員用）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* =====================
       基本レイアウト・文字
    ===================== */
    body{
      margin:0;
      font-family:"Hiragino Sans","メイリオ",sans-serif;
      background:#faf7f2;
      color:#333;
      line-height:1.8;
      font-size:18px; /* スマホで大きめ */
    }

    @media (min-width:768px){
      body{
        font-size:16px; /* PCでは少し標準に戻す */
      }
    }

    .wrap{
      max-width:900px;
      margin:0 auto;
    }

    header{
      position:sticky;
      top:0;
      background:#fff7dd;
      border-bottom:4px solid #e0cfa0;
      padding:10px;
      z-index:100;
    }

    .title{
      font-size:1.3em;
      font-weight:900;
      margin:0;
    }

    .subtitle{
      font-size:0.7em;
      color:#555;
      margin-left:4px;
    }

    .header-note{
      font-size:0.75em;
      color:#555;
      margin-top:4px;
    }

    /* =====================
       ナビゲーション（ボタン）
    ===================== */
    nav{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:8px;
    }

    nav button{
      flex:1 1 calc(50% - 8px); /* スマホで2列に分かれてもOK */
      min-height:52px;
      padding:6px 8px;
      font-size:18px;
      font-weight:800;
      border:4px solid #a6842c;
      background:#fff;
      border-radius:12px;
      cursor:pointer;
      text-align:center;
      white-space:nowrap; /* 文字を省略しない（折り返しなし） */
    }

    nav button.active{
      background:#f0b344;
      border-color:#000;
    }

    @media (min-width:768px){
      nav button{
        flex:1 1 auto;
        font-size:16px;
        min-height:46px;
      }
    }

    /* =====================
       メインコンテンツ
    ===================== */
    main{
      padding:12px;
    }

    .section-title{
      font-size:1.3em;
      font-weight:800;
      border-bottom:3px solid #f0b344;
      margin:0 0 12px;
      padding-bottom:2px;
    }

    .step-count{
      font-size:0.85em;
      color:#666;
      margin-bottom:8px;
    }

    .photo-box{
      background:#fff;
      border:4px solid #e0cfa0;
      border-radius:14px;
      padding:14px;
      box-shadow:0 3px 8px rgba(0,0,0,0.08);
    }

    .photo-img{
      width:100%;
      max-width:640px;
      display:block;
      margin:0 auto 10px;
      border-radius:12px;
      border:4px solid #d6c28c;
      cursor:pointer;
      background:#000;
    }

    .photo-hint{
      text-align:center;
      font-size:0.9em;
      color:#555;
      background:#f0f0f0;
      padding:8px;
      border-radius:8px;
    }

    .ok-box{
      background:#e8f6e8;
      border:3px solid #4caf50;
      border-radius:10px;
      padding:12px;
      margin:12px 0;
      font-weight:800;
      text-align:center;
      font-size:1em;
    }

    .note{
      background:#f5efe4;
      padding:12px;
      border-radius:8px;
      border-left:4px solid #a6842c;
      font-size:0.95em;
    }

    .note.danger{
      border-left-color:#f44336;
      background:#ffe9e9;
      color:#b02121;
    }

    .note.final{
      border-left-color:#2196f3;
      background:#e9f7ff;
      color:#0b558f;
    }

    .note-title{
      font-weight:800;
      margin-bottom:4px;
      font-size:0.9em;
    }

    .footer-note{
      margin-top:10px;
      font-size:0.8em;
      color:#666;
      text-align:right;
    }

    /* =====================
       拡大表示オーバーレイ
    ===================== */
    .overlay{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.95);
      z-index:999;
      align-items:center;
      justify-content:center;
    }

    .overlay.visible{
      display:flex;
    }

    .overlay-inner{
      position:relative;
      max-width:100vw;
      max-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .overlay-img{
      max-width:90vw;
      max-height:90vh;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,0.6);
      object-fit:contain;
      background:#000;
    }

    /* スマホ（縦向き）では横向き表示 */
    @media (max-width:767px){
      .overlay-img{
        transform:rotate(90deg);
      }
    }

    /* PC では回転させず、画面内に収めるだけ */
    @media (min-width:768px){
      .overlay-img{
        transform:none;
        max-width:80vw;
        max-height:80vh;
      }
    }

    .close-btn{
      position:absolute;
      top:20px;
      right:20px;
      width:56px;
      height:56px;
      background:#000;
      color:#fff;
      font-size:36px;
      text-align:center;
      line-height:56px;
      border-radius:50%;
      border:3px solid #fff;
      cursor:pointer;
    }

    .overlay-caption{
      position:absolute;
      bottom:16px;
      left:50%;
      transform:translateX(-50%);
      color:#fff;
      background:rgba(0,0,0,0.7);
      padding:8px 16px;
      border-radius:18px;
      font-size:0.9em;
      text-align:center;
      max-width:90vw;
    }
  </style>
</head>

<body>
<div class="wrap">

  <header>
    <h1 class="title">
      リモコンカー作り 写真で確認シート
      <span class="subtitle">（指導員用）</span>
    </h1>
    <p class="header-note">
      高学年〜大人と一緒に、写真を見ながら一つずつ確認します。
    </p>

    <nav id="nav">
      <button data-target="battery" class="active">① 電池BOX</button>
      <button data-target="wire">② 電池の線</button>
      <button data-target="switch">③ スイッチ</button>
      <button data-target="test">④ モーターテスト</button>
      <button data-target="look">⑤ 見た目完成</button>
      <button data-target="finish">⑥ ほんとうの完成</button>
    </nav>
  </header>

  <main>
    <div class="section-title" id="sectionTitle">① 電池BOX</div>
    <div class="step-count" id="stepCount">工程 1 / 6</div>

    <div class="photo-box">
      <img id="photo" src="images/battery_box.jpg" class="photo-img" alt="① 電池BOX">
      <div class="photo-hint">
        📱 写真をタップすると拡大します（スマホは横向き表示／タップで戻る）
      </div>

      <div class="ok-box" id="okMessage">
        ✅ 電池の向きOK！
      </div>

      <div class="note" id="note">
        <div class="note-title">注意・ヒント</div>
        ＋と－の向きをいっしょに確認します。
      </div>

      <div class="footer-note">
        写真を見ながら、子どもに「ここは同じかな？」と声かけして進めます。
      </div>
    </div>
  </main>

</div>

<!-- 拡大表示オーバーレイ -->
<div id="overlay" class="overlay">
  <div class="overlay-inner">
    <div class="close-btn" id="closeBtn">×</div>
    <img id="overlayImg" class="overlay-img" alt="">
    <div class="overlay-caption" id="overlayCaption"></div>
  </div>
</div>

<script>
  // 工程データ（高齢者にも分かりやすい短めテキスト）
  const sections = {
    battery:{
      index:1,
      title:"① 電池BOX",
      img:"images/battery_box.jpg",
      ok:"電池の向きOK！",
      note:"＋と－の向きをいっしょに確認します。"
    },
    wire:{
      index:2,
      title:"② 電池の線",
      img:"images/wire_magnet.jpg",
      ok:"線がしっかりつながった！",
      note:"磁石がしっかり付いているか、落ちそうでないかを見ます。"
    },
    switch:{
      index:3,
      title:"③ スイッチ",
      img:"images/switch_complete.jpg",
      ok:"前後が切り替わる！",
      note:"左右に倒して、前と後ろが入れ替わるか確認します。"
    },
    test:{
      index:4,
      title:"④ モーターテスト",
      img:"images/motor_test.jpg",
      ok:"回れば OK（またはLEDチェッカー）",
      note:"指を近づけないように注意。回らない場合は配線を確認します。",
      danger:true
    },
    look:{
      index:5,
      title:"⑤ 見た目完成",
      img:"images/car_complete.jpg",
      ok:"つなぎ方をためそう！",
      note:"前後が逆に動くときは、配線の向きを入れ替えてみます。",
      danger:true
    },
    finish:{
      index:6,
      title:"⑥ ほんとうの完成",
      img:"images/complete.jpg",
      ok:"前後に動いたら大成功！",
      note:"人やものにぶつからないよう、安全な場所で走らせます。",
      final:true
    }
  };

  const totalSteps = Object.keys(sections).length;

  const navButtons = document.querySelectorAll("#nav button");
  const sectionTitle = document.getElementById("sectionTitle");
  const stepCount = document.getElementById("stepCount");
  const photo = document.getElementById("photo");
  const okMessage = document.getElementById("okMessage");
  const noteBox = document.getElementById("note");
  const overlay = document.getElementById("overlay");
  const overlayImg = document.getElementById("overlayImg");
  const overlayCaption = document.getElementById("overlayCaption");
  const closeBtn = document.getElementById("closeBtn");

  let currentKey = "battery";

  // 工程切り替え
  function setSection(key){
    const data = sections[key];
    if(!data) return;

    currentKey = key;

    // 見出し・カウント
    sectionTitle.textContent = data.title;
    stepCount.textContent = "工程 " + data.index + " / " + totalSteps;

    // 写真
    photo.src = data.img;
    photo.alt = data.title;

    // OKメッセージ
    okMessage.textContent = "✅ " + data.ok;

    // 注意・ヒント
    noteBox.className = "note"; // リセット
    let noteTitle = "注意・ヒント";
    if(data.danger){
      noteBox.classList.add("danger");
      noteTitle = "安全に注意";
    }
    if(data.final){
      noteBox.classList.add("final");
      noteTitle = "さいごのひとこと";
    }
    noteBox.innerHTML =
      '<div class="note-title">' + noteTitle + '</div>' +
      data.note;

    // ナビのactive切り替え
    navButtons.forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.target === key);
    });
  }

  navButtons.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      setSection(btn.dataset.target);
    });
  });

  // 写真をタップで拡大
  photo.addEventListener("click", ()=>{
    const data = sections[currentKey];
    overlayImg.src = data.img;
    overlayImg.alt = data.title;
    overlayCaption.textContent = data.title + " ／ タップで戻ります";
    overlay.classList.add("visible");
  });

  // ×ボタンまたはオーバーレイ背景をタップで閉じる
  function closeOverlay(){
    overlay.classList.remove("visible");
    // 拡大状態をきちんとリセット（次の表示がくずれないように）
    overlayImg.src = "";
  }

  closeBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    closeOverlay();
  });

  overlay.addEventListener("click", ()=>{
    closeOverlay();
  });

  // 初期表示
  setSection("battery");
</script>

</body>
</html>
