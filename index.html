<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リモコンカー作り 写真で確認シート（指導員用）</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* =====================
   サイズ制御用変数
===================== */
:root{
  --font-base:20px;
  --btn-font:20px;
  --btn-padding:12px 18px;
  --btn-border:5px;
  --title-weight:900;
  --photo-max-width:95vw;
}

/* =====================
   共通
===================== */
body{
  margin:0;
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
  background:#faf7f2;
  color:#333;
  font-size:var(--font-base);
  line-height:1.7;
  overflow-x:hidden;
}

/* =====================
   ヘッダー
===================== */
header{
  position:sticky;
  top:0;
  background:#fff7dd;
  border-bottom:4px solid #e0cfa0;
  padding:8px 10px;
  z-index:100;
}

/* タイトル行 */
.header-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.title{
  font-size:1.3em;
  font-weight:var(--title-weight);
  margin:0;
  white-space:nowrap;
}

.subtitle{
  font-size:0.6em;
  font-weight:500;
  color:#555;
  margin-left:4px;
}

/* =====================
   文字サイズ切替
===================== */
.font-controls{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

.font-controls button{
  min-width:50px;
  padding:8px 12px;
  font-size:16px;
  border:2px solid #999;
  background:#fff;
  border-radius:8px;
  cursor:pointer;
}

.font-controls button.active{
  background:#333;
  color:#fff;
  border-color:#000;
}

/* =====================
   工程ナビ
===================== */
nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:8px 0 6px;
}

nav button{
  flex:1 1 auto;
  min-width:120px;
  min-height:50px;
  font-size:var(--btn-font);
  padding:var(--btn-padding);
  border:var(--btn-border) solid #a6842c;
  background:#fff;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  margin-bottom:5px;
}

nav button.active{
  background:#f0b344;
  color:#000;
  border-color:#000;
}

/* =====================
   メイン
===================== */
main{
  padding:12px;
  scroll-margin-top:120px;
}

.section-title{
  font-size:1.3em;
  font-weight:800;
  margin-bottom:12px;
  padding-bottom:5px;
  border-bottom:3px solid #f0b344;
  scroll-margin-top:120px;
}

.photo-box{
  background:#fff;
  border:4px solid #e0cfa0;
  border-radius:14px;
  padding:15px;
  text-align:center;
}

/* 写真コンテナ */
.photo-container{
  position:relative;
  max-width:var(--photo-max-width);
  margin:0 auto 15px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.photo-img{
  width:auto;
  max-width:100%;
  max-height:400px;
  object-fit:contain;
  display:block;
  border-radius:12px;
  border:4px solid #e0cfa0;
  cursor:pointer;
  background:#f9f9f9;
  margin:0 auto;
}

.photo-img:active{
  transform:scale(0.98);
}

/* スマホ向けヒント */
.photo-hint{
  text-align:center;
  color:#666;
  font-size:0.9em;
  margin:5px 0 15px;
  padding:8px;
  background:#f0f0f0;
  border-radius:8px;
  border-left:4px solid #f0b344;
}

/* OKメッセージ */
.ok-box{
  background:#e8f6e8;
  border:3px solid #4caf50;
  border-radius:10px;
  padding:12px;
  margin:15px 0;
  font-size:1.1em;
  font-weight:800;
  text-align:center;
}

/* 補足 */
.note{
  background:#f5efe4;
  padding:12px;
  border-radius:8px;
  font-size:1em;
  border-left:4px solid #a6842c;
}

/* =====================
   写真拡大（スマホ最適化）- ピンチズーム対応
===================== */
.overlay{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  z-index:999;
  touch-action:none;
  overflow:hidden;
}

.overlay-content{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.overlay-img-container{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.overlay-img{
  position:absolute;
  max-width:none;
  max-height:none;
  transition:transform 0.1s ease;
  cursor:move;
  will-change:transform;
  transform-origin:center center;
  user-select:none;
  -webkit-user-drag:none;
  -webkit-touch-callout:none;
  touch-action:none;
}

/* スマホ向け：縦向きの場合は横向き表示 */
@media (max-width: 768px) and (orientation: portrait) {
  .overlay-img {
    transform: rotate(90deg);
    transform-origin:center center;
  }
  
  .overlay-img.zoomed {
    transform: rotate(90deg) scale(var(--zoom-scale, 1));
  }
}

/* タブレット・PC・スマホ横向き */
@media (min-width:769px), (orientation:landscape){
  .overlay-img{
    transform: none !important;
  }
}

/* 閉じるボタン */
.close-btn{
  position:absolute;
  top:20px;
  right:20px;
  width:60px;
  height:60px;
  background:rgba(0,0,0,0.7);
  color:white;
  font-size:40px;
  line-height:60px;
  text-align:center;
  border-radius:50%;
  z-index:1001;
  cursor:pointer;
  border:3px solid white;
  user-select:none;
}

/* 操作説明 */
.instruction{
  position:absolute;
  bottom:20px;
  left:0;
  right:0;
  text-align:center;
  color:white;
  font-size:16px;
  z-index:1000;
  padding:10px;
  background:rgba(0,0,0,0.5);
  opacity:0.8;
  user-select:none;
}

/* タップで閉じるエリア */
.tap-to-close{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:998;
  display:none;
}

/* =====================
   印刷対応
===================== */
@media print{
  header{
    display:none;
  }

  .photo-img, .photo-hint{
    display:none;
  }

  body{
    background:#fff;
    font-size:14pt;
  }

  .photo-box{
    border:none;
    padding:0;
  }
}

/* =====================
   フッター
===================== */
footer{
  text-align:center;
  padding:15px;
  font-size:0.9em;
  color:#666;
  border-top:2px solid #e0cfa0;
  margin-top:20px;
}

/* 画像エラースタイル */
.img-error{
  position:relative;
}

.img-error::after{
  content:"画像が見つかりません";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  color:#ff6b6b;
  font-weight:bold;
  text-align:center;
  padding:10px;
  background:rgba(255,255,255,0.9);
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <div class="header-row">
    <h1 class="title">
      リモコンカー作り 写真で確認シート
      <span class="subtitle">（指導員用）</span>
    </h1>

    <div class="font-controls">
      <button data-size="small">小</button>
      <button data-size="medium">中</button>
      <button data-size="large" class="active">大</button>
    </div>
  </div>

  <nav id="nav">
    <button data-target="battery" class="active">電池BOX完成</button>
    <button data-target="wire">電池につける電線</button>
    <button data-target="switch">前後切り替えスイッチ</button>
    <button data-target="test">モーターのテスト</button>
    <button data-target="complete">完成品</button>
  </nav>
</header>

<main>
  <div class="section-title" id="sectionTitle">
    電池BOX完成
  </div>

  <div class="photo-box">
    <div class="photo-container">
      <img id="photo" src="images/battery_box.jpg" alt="電池BOX完成" class="photo-img">
    </div>
    
    <p class="photo-hint">
      📱写真をタップで拡大表示<br>
      🤏拡大中: 指2本で拡大縮小・1本指で移動・タップで閉じる
    </p>

    <div class="ok-box" id="okMessage">
      ✅ この写真と同じになっていれば OK です
    </div>

    <div class="note" id="note">
      電池の＋－向きが合っているかを確認します。
    </div>
  </div>
</main>

<footer>
  <p>このシートはリモコンカー作りの指導員用です。写真を見比べて確認しましょう。</p>
</footer>

<!-- 写真拡大 -->
<div id="overlay" class="overlay">
  <div class="overlay-content">
    <div class="close-btn" id="closeBtn">×</div>
    <div class="instruction" id="instruction">
      指2本で拡大縮小・1本指で移動・タップで閉じる
    </div>
    <!-- タップで閉じる透明なエリア -->
    <div class="tap-to-close" id="tapToClose"></div>
    <div class="overlay-img-container">
      <img id="overlayImg" class="overlay-img">
    </div>
  </div>
</div>

<script>
/* =====================
   工程データ
===================== */
const sections = {
  battery:{
    title:"電池BOX完成",
    img:"images/battery_box.jpg",
    ok:"この写真と同じになっていれば OK です",
    note:"電池の＋－向きが合っているかを確認します。"
  },
  wire:{
    title:"電池につける電線",
    img:"images/wire_magnet.jpg",
    ok:"この形になっていれば OK です",
    note:"磁石が端子にピタッと付いているか確認します。"
  },
  switch:{
    title:"前後切り替えスイッチ",
    img:"images/switch_complete.jpg",
    ok:"この配置になっていれば OK です",
    note:"左右のボタンで動きが変わることを確認します。"
  },
  test:{
    title:"モーターのテスト",
    img:"images/motor_test.jpg",
    ok:"写真のように回れば OK です",
    note:"回らない場合は接触を確認します。"
  },
  complete:{
    title:"完成品",
    img:"images/car_complete.jpg",
    ok:"この状態なら完成です",
    note:"配線がタイヤに絡んでいないか確認します。"
  }
};

/* =====================
   スマホ判定
===================== */
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

/* =====================
   工程切替 - ページトップにスクロール（スマホ対応）
===================== */
const buttons = document.querySelectorAll("nav button");
const photo = document.getElementById("photo");

// 確実にページトップにスクロールする関数
function scrollToTop() {
  // 複数の方法で確実にトップに移動
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  // スマホ用に追加のスクロール方法
  if (isMobile) {
    document.body.scrollTop = 0;
    document.documentElement.scrollTop = 0;
    
    // 少し遅らせてもう一度スクロール（確実性のため）
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

buttons.forEach(btn => {
  btn.onclick = () => {
    // まず確実にページトップにスクロール
    scrollToTop();
    
    // 少し遅延させてから内容を変更
    setTimeout(() => {
      buttons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const key = btn.dataset.target;
      const section = sections[key];
      
      document.getElementById("sectionTitle").textContent = section.title;
      document.getElementById("okMessage").innerHTML = "✅ " + section.ok;
      document.getElementById("note").innerHTML = section.note;
      
      // 画像の読み込み
      const img = new Image();
      img.onload = function() {
        photo.src = section.img;
        photo.alt = section.title;
        photo.classList.remove("img-error");
      };
      img.onerror = function() {
        photo.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480"><rect width="640" height="480" fill="%23f5f5f5"/><text x="320" y="220" font-family="Arial" font-size="24" fill="%23666" text-anchor="middle">${section.title}</text><text x="320" y="260" font-family="Arial" font-size="18" fill="%23999" text-anchor="middle">画像準備中</text></svg>`;
        photo.alt = `${section.title}（画像準備中）`;
        photo.classList.add("img-error");
      };
      img.src = section.img;
      
      // ボタンにフォーカスを当てる
      btn.focus();
    }, 300);
  };
});

/* =====================
   写真拡大 - スマホ完全対応版
===================== */
const overlay = document.getElementById("overlay");
const overlayImg = document.getElementById("overlayImg");
const instruction = document.getElementById("instruction");
const tapToClose = document.getElementById("tapToClose");
const closeBtn = document.getElementById("closeBtn");

// ズーム用の変数
let scale = 1;
let posX = 0;
let posY = 0;
let lastTouchDistance = null;
let isPinching = false;
let lastTapTime = 0;
let isDragging = false;
let startX = 0;
let startY = 0;
let currentX = 0;
let currentY = 0;

// 写真クリックで拡大表示
photo.onclick = () => {
  overlayImg.src = photo.src;
  overlay.style.display = "block";
  document.body.style.overflow = "hidden";
  document.documentElement.style.overflow = "hidden";
  
  // 初期状態にリセット
  resetZoom();
  
  // スマホの場合は横向きに調整
  adjustForMobile();
  
  // タップで閉じるエリアを表示
  tapToClose.style.display = "block";
  
  // 操作説明を表示（5秒後にフェードアウト）
  instruction.style.opacity = "1";
  setTimeout(() => {
    instruction.style.transition = "opacity 1s";
    instruction.style.opacity = "0.3";
  }, 5000);
};

// スマホ表示用の調整
function adjustForMobile() {
  if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) {
    // スマホ縦向きの場合は横向き表示
    overlayImg.style.transform = "rotate(90deg) translate(0px, 0px) scale(1)";
    overlayImg.style.setProperty('--zoom-scale', '1');
  } else {
    // その他の場合は通常表示
    overlayImg.style.transform = "translate(0px, 0px) scale(1)";
    overlayImg.style.setProperty('--zoom-scale', '1');
  }
}

// ズーム状態をリセット
function resetZoom() {
  scale = 1;
  posX = 0;
  posY = 0;
  currentX = 0;
  currentY = 0;
  isPinching = false;
  isDragging = false;
  updateTransform();
}

// トランスフォームを更新
function updateTransform() {
  let transform;
  if (window.innerWidth <= 768 && window.innerHeight > window.innerWidth) {
    // スマホ縦向き
    transform = `rotate(90deg) translate(${posX}px, ${posY}px) scale(${scale})`;
    overlayImg.style.setProperty('--zoom-scale', scale);
  } else {
    // その他
    transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
  }
  overlayImg.style.transform = transform;
}

// 拡大画像を閉じる
function closePhoto() {
  overlay.style.display = "none";
  document.body.style.overflow = "auto";
  document.documentElement.style.overflow = "auto";
  tapToClose.style.display = "none";
  resetZoom();
}

// 閉じるボタンのイベント
closeBtn.onclick = closePhoto;

// タップで閉じるエリアのイベント
tapToClose.onclick = closePhoto;

// 背景クリックでも閉じる
overlay.onclick = function(e) {
  if (e.target === overlay) {
    closePhoto();
  }
};

// ESCキーでも閉じられるように
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && overlay.style.display === 'block') {
    closePhoto();
  }
});

/* =====================
   タッチイベント処理（スマホ）
===================== */
let touchStartTime = 0;
let touchStartX = 0;
let touchStartY = 0;

overlayImg.addEventListener('touchstart', function(e) {
  e.preventDefault();
  
  const now = Date.now();
  const touch = e.touches[0];
  
  // シングルタッチ（1本指）
  if (e.touches.length === 1) {
    isDragging = true;
    startX = touch.clientX - posX;
    startY = touch.clientY - posY;
    
    // ダブルタップ判定用
    if (now - lastTapTime < 300) {
      // ダブルタップ：ズームトグル
      if (scale === 1) {
        scale = 2;
        posX = 0;
        posY = 0;
      } else {
        scale = 1;
        posX = 0;
        posY = 0;
      }
      updateTransform();
      lastTapTime = 0;
    } else {
      // シングルタップ開始を記録
      touchStartTime = now;
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      lastTapTime = now;
    }
  }
  
  // マルチタッチ（2本指以上）
  if (e.touches.length === 2) {
    isPinching = true;
    isDragging = false;
    
    const touch1 = e.touches[0];
    const touch2 = e.touches[1];
    
    // 2本指間の距離を計算
    const dx = touch1.clientX - touch2.clientX;
    const dy = touch1.clientY - touch2.clientY;
    lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
  }
}, { passive: false });

overlayImg.addEventListener('touchmove', function(e) {
  e.preventDefault();
  
  // 1本指でのドラッグ
  if (e.touches.length === 1 && isDragging) {
    const touch = e.touches[0];
    posX = touch.clientX - startX;
    posY = touch.clientY - startY;
    
    // 移動範囲を制限
    const limitX = (overlayImg.width * scale - window.innerWidth) / 2;
    const limitY = (overlayImg.height * scale - window.innerHeight) / 2;
    
    if (scale > 1) {
      posX = Math.max(Math.min(posX, limitX), -limitX);
      posY = Math.max(Math.min(posY, limitY), -limitY);
    } else {
      posX = 0;
      posY = 0;
    }
    
    updateTransform();
  }
  
  // 2本指でのピンチズーム
  if (e.touches.length === 2 && isPinching) {
    const touch1 = e.touches[0];
    const touch2 = e.touches[1];
    
    // 現在の2本指間の距離を計算
    const dx = touch1.clientX - touch2.clientX;
    const dy = touch1.clientY - touch2.clientY;
    const currentDistance = Math.sqrt(dx * dx + dy * dy);
    
    if (lastTouchDistance !== null) {
      // 距離の変化からスケールを計算
      const delta = currentDistance / lastTouchDistance;
      scale *= delta;
      
      // スケールを制限
      scale = Math.max(0.5, Math.min(5, scale));
      
      // 2本指の中点を計算
      const midX = (touch1.clientX + touch2.clientX) / 2;
      const midY = (touch1.clientY + touch2.clientY) / 2;
      
      // 拡大中心を調整
      const scaleChange = scale / (scale / delta);
      posX = midX - (midX - posX) * scaleChange;
      posY = midY - (midY - posY) * scaleChange;
      
      updateTransform();
    }
    
    lastTouchDistance = currentDistance;
  }
}, { passive: false });

overlayImg.addEventListener('touchend', function(e) {
  e.preventDefault();
  
  // シングルタップ判定（ズームしていない状態でタップで閉じる）
  if (e.touches.length === 0 && !isPinching) {
    const touch = e.changedTouches[0];
    const touchTime = Date.now() - touchStartTime;
    const touchMoveX = Math.abs(touch.clientX - touchStartX);
    const touchMoveY = Math.abs(touch.clientY - touchStartY);
    
    // 短時間でほとんど動かず、ズームしていなければ閉じる
    if (touchTime < 300 && touchMoveX < 10 && touchMoveY < 10 && scale <= 1.1) {
      setTimeout(() => {
        closePhoto();
      }, 50);
      return;
    }
    
    // ズーム中で短時間タップなら元のサイズに戻る
    if (touchTime < 300 && touchMoveX < 10 && touchMoveY < 10 && scale > 1.1) {
      scale = 1;
      posX = 0;
      posY = 0;
      updateTransform();
      return;
    }
  }
  
  // タッチ終了時のリセット
  if (e.touches.length === 0) {
    isDragging = false;
    isPinching = false;
    lastTouchDistance = null;
  } else if (e.touches.length === 1) {
    isDragging = true;
    isPinching = false;
    const touch = e.touches[0];
    startX = touch.clientX - posX;
    startY = touch.clientY - posY;
  }
}, { passive: false });

/* =====================
   マウスイベント処理（PC）
===================== */
overlayImg.addEventListener('mousedown', function(e) {
  e.preventDefault();
  
  if (e.button === 0) { // 左クリックのみ
    isDragging = true;
    startX = e.clientX - posX;
    startY = e.clientY - posY;
    
    // ダブルクリック判定用
    const now = Date.now();
    if (now - lastTapTime < 300) {
      // ダブルクリック：ズームトグル
      if (scale === 1) {
        scale = 2;
        posX = 0;
        posY = 0;
      } else {
        scale = 1;
        posX = 0;
        posY = 0;
      }
      updateTransform();
      lastTapTime = 0;
    } else {
      lastTapTime = now;
    }
  }
});

overlayImg.addEventListener('mousemove', function(e) {
  e.preventDefault();
  
  if (isDragging) {
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    
    // 移動範囲を制限
    const limitX = (overlayImg.width * scale - window.innerWidth) / 2;
    const limitY = (overlayImg.height * scale - window.innerHeight) / 2;
    
    if (scale > 1) {
      posX = Math.max(Math.min(posX, limitX), -limitX);
      posY = Math.max(Math.min(posY, limitY), -limitY);
    } else {
      posX = 0;
      posY = 0;
    }
    
    updateTransform();
  }
});

overlayImg.addEventListener('mouseup', function(e) {
  e.preventDefault();
  isDragging = false;
});

overlayImg.addEventListener('mouseleave', function() {
  isDragging = false;
});

// マウスホイールでズーム（PC用）
overlayImg.addEventListener('wheel', function(e) {
  e.preventDefault();
  
  const zoomIntensity = 0.1;
  const wheelDelta = e.deltaY > 0 ? -zoomIntensity : zoomIntensity;
  
  // マウス位置を拡大中心にする
  const rect = overlayImg.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  
  // 画像上の相対位置
  const imgX = (mouseX - posX) / scale;
  const imgY = (mouseY - posY) / scale;
  
  // スケールを更新
  const newScale = Math.max(0.5, Math.min(5, scale + wheelDelta));
  
  // 拡大中心を調整
  posX = mouseX - imgX * newScale;
  posY = mouseY - imgY * newScale;
  scale = newScale;
  
  updateTransform();
});

// スマホの回転イベントに対応
window.addEventListener('orientationchange', function() {
  setTimeout(() => {
    if (overlay.style.display === 'block') {
      adjustForMobile();
      updateTransform();
    }
  }, 300);
});

// 画像読み込み後にサイズ調整
overlayImg.addEventListener('load', function() {
  if (overlay.style.display === 'block') {
    adjustForMobile();
    updateTransform();
  }
});

/* =====================
   文字サイズ切替（保存）
===================== */
const sizeButtons = document.querySelectorAll(".font-controls button");

function applySize(size) {
  sizeButtons.forEach(b => b.classList.remove("active"));
  
  if (size === "small") {
    document.documentElement.style.setProperty("--font-base", "16px");
    document.documentElement.style.setProperty("--btn-font", "16px");
    document.documentElement.style.setProperty("--btn-padding", "8px 14px");
    document.documentElement.style.setProperty("--btn-border", "3px");
    document.documentElement.style.setProperty("--title-weight", "700");
    document.documentElement.style.setProperty("--photo-max-width", "95vw");
  } else if (size === "medium") {
    document.documentElement.style.setProperty("--font-base", "18px");
    document.documentElement.style.setProperty("--btn-font", "18px");
    document.documentElement.style.setProperty("--btn-padding", "10px 16px");
    document.documentElement.style.setProperty("--btn-border", "4px");
    document.documentElement.style.setProperty("--title-weight", "800");
    document.documentElement.style.setProperty("--photo-max-width", "90vw");
  } else if (size === "large") {
    document.documentElement.style.setProperty("--font-base", "20px");
    document.documentElement.style.setProperty("--btn-font", "20px");
    document.documentElement.style.setProperty("--btn-padding", "12px 18px");
    document.documentElement.style.setProperty("--btn-border", "5px");
    document.documentElement.style.setProperty("--title-weight", "900");
    document.documentElement.style.setProperty("--photo-max-width", "85vw");
  }
  
  localStorage.setItem("fontSize", size);
  document.querySelector(`.font-controls button[data-size="${size}"]`).classList.add("active");
}

sizeButtons.forEach(btn => {
  btn.onclick = () => {
    applySize(btn.dataset.size);
  };
});

// 保存された設定を適用（デフォルトは「大」）
const saved = localStorage.getItem("fontSize") || "large";
applySize(saved);

  }
});
</script>
